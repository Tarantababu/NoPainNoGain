<script type="text/babel" data-presets="react">
/* ============================================================================
   FLUENT LOOP — single-file voice language coach
   ----------------------------------------------------------------------------
   Required Supabase schema (run this SQL once in the Supabase SQL editor).
   Every learner-owned row is scoped to (user_id, target_language), so each
   target language is a separate workspace: its own level, its own vocabulary,
   its own session history. Nothing leaks between languages.

   create table if not exists public.profiles (
     id uuid primary key default gen_random_uuid(),
     user_id text default 'default_user',
     target_language text not null default 'German',
     current_cefr text default 'B1',
     vocab_injection_mode text default 'adapt_naturally', -- 'adapt_naturally' | 'force_verbatim'
     unique (user_id, target_language)
   );

   create table if not exists public.target_vocabulary (
     id uuid primary key default gen_random_uuid(),
     user_id text default 'default_user',
     target_language text not null default 'German',
     phrase text not null,
     translation text,
     correction_context text,
     times_reviewed int default 0,
     status text default 'learning', -- 'learning' | 'mastered'
     kind text not null default 'phrase', -- 'phrase' | 'word' (words in dictionary form)
     created_at timestamp with time zone default now()
   );

   create table if not exists public.conversations (
     id uuid primary key default gen_random_uuid(),
     user_id text default 'default_user',
     target_language text not null default 'German',
     topic text not null,
     duration_seconds int,
     transcript jsonb not null,
     feedback jsonb,
     created_at timestamp with time zone default now()
   );

   Upgrading from the single-language schema? The setup screen carries the
   migration, which backfills existing rows from your old profile row.

   This app talks to Supabase directly from the browser with the anon key,
   so either keep RLS off for these tables (single-user/local use) or add
   policies that allow anon read/write:

   alter table public.profiles enable row level security;
   create policy "anon all" on public.profiles for all to anon using (true) with check (true);
   (repeat for target_vocabulary and conversations)
   ========================================================================== */

const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ---------------------------------------------------------------- constants */

const DEFAULT_USER = 'default_user';
const MAX_PROFILES = 5;
const PROFILE_EMOJI = ['🙂', '🦊', '🐙', '🦉', '🐳', '🌵', '🍀', '⚡', '🎧', '🚀'];

// Every learner-owned row is scoped to (user_id, target_language) so that
// switching language switches to a completely separate vocabulary, history and
// level. Nothing crosses between languages.
function scoped(query, learnerId, language) {
  return query.eq('user_id', learnerId).eq('target_language', language);
}

function missingLanguageColumn(error) {
  const msg = (error && error.message ? error.message : String(error || '')).toLowerCase();
  return msg.indexOf('target_language') !== -1 &&
    (msg.indexOf('does not exist') !== -1 || msg.indexOf('column') !== -1 || msg.indexOf('schema cache') !== -1);
}

const MIGRATION_HINT = 'Your database is missing the latest schema. ' +
  'Run the migrations shown on the setup screen (or `supabase db push`), then reload.';
const SESSION_SECONDS = 30 * 60;
const MASTERY_THRESHOLD = 3;
const CONFIG_KEY = 'fluentloop.config.v1';

const LANGUAGES = [
  { name: 'German',   code: 'de' },
  { name: 'Spanish',  code: 'es' },
  { name: 'French',   code: 'fr' },
  { name: 'Italian',  code: 'it' },
  { name: 'Portuguese', code: 'pt' },
  { name: 'Dutch',    code: 'nl' },
  { name: 'Swedish',  code: 'sv' },
  { name: 'Polish',   code: 'pl' },
  { name: 'Turkish',  code: 'tr' },
  { name: 'Russian',  code: 'ru' },
  { name: 'Arabic',   code: 'ar' },
  { name: 'Japanese', code: 'ja' },
  { name: 'Korean',   code: 'ko' },
  { name: 'Mandarin Chinese', code: 'zh' },
  { name: 'English',  code: 'en' }
];

const CEFR_LEVELS = [
  { code: 'A1', label: 'A1 — Beginner' },
  { code: 'A2', label: 'A2 — Elementary' },
  { code: 'B1', label: 'B1 — Intermediate' },
  { code: 'B2', label: 'B2 — Upper intermediate' },
  { code: 'C1', label: 'C1 — Advanced' },
  { code: 'C2', label: 'C2 — Mastery' }
];

const FALLBACK_TOPICS = [
  'A weekend trip that did not go as planned',
  'Ordering food and dealing with a mixed-up order',
  'Describing your daily routine and what you would change',
  'A film or series you watched recently',
  'Talking to a neighbour about noise in the building',
  'Planning a birthday party with a friend',
  'A job interview for a role you really want'
];

const VOICES = ['alloy', 'echo', 'fable', 'onyx', 'nova', 'shimmer'];

const REALTIME_MODEL = 'gpt-realtime';
const REALTIME_VOICES = ['alloy', 'ash', 'ballad', 'coral', 'echo', 'sage', 'shimmer', 'verse'];
const MODE_TURN = 'turn_based';
const MODE_REALTIME = 'realtime';

/* ------------------------------------------------------------------ helpers */

function langCode(name) {
  const hit = LANGUAGES.find(l => l.name === name);
  return hit ? hit.code : 'en';
}

function loadConfig() {
  try {
    const raw = localStorage.getItem(CONFIG_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.openaiKey || !parsed.supabaseUrl || !parsed.supabaseKey) return null;
    return parsed;
  } catch (e) {
    return null;
  }
}

function saveConfig(cfg) {
  try {
    localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
  } catch (e) {
    console.warn('Could not persist config:', e);
  }
}

function formatClock(totalSeconds) {
  const s = Math.max(0, Math.floor(totalSeconds));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}

function normalizeText(input) {
  if (!input) return '';
  return String(input)
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^\p{L}\p{N}\s]/gu, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

// Fuzzy "did the learner actually use this phrase?" check.
// Exact normalized substring wins; otherwise require most content words present,
// which tolerates conjugation and case changes in inflected languages.
// Leading articles (and English "to") belong to a word's dictionary form but
// must not be demanded when the learner uses the word: "die Quittung" is used
// just as surely in "eine Quittung". Per language, because the same token can
// be an article in one language and a real word in another: "a conta" is a
// Portuguese noun with its article, "a lot" is an English phrase.
const ARTICLES_BY_LANGUAGE = {
  German: ['der', 'die', 'das', 'den', 'dem', 'des', 'ein', 'eine', 'einen', 'einem', 'einer', 'eines'],
  French: ['le', 'la', 'les', 'l', 'un', 'une'],
  Spanish: ['el', 'la', 'los', 'las', 'un', 'una', 'unos', 'unas'],
  Italian: ['il', 'lo', 'la', 'i', 'gli', 'le', 'l', 'un', 'uno', 'una'],
  Portuguese: ['o', 'a', 'os', 'as', 'um', 'uma'],
  Dutch: ['de', 'het', 'een'],
  Swedish: ['en', 'ett'],
  English: ['to']
};
const ALL_ARTICLES = new Set([].concat.apply([], Object.values(ARTICLES_BY_LANGUAGE)));

function articlesFor(language) {
  if (!language) return ALL_ARTICLES;
  return new Set(ARTICLES_BY_LANGUAGE[language] || []);
}

function headwordOf(phrase, language) {
  const t = normalizeText(phrase).split(' ').filter(Boolean);
  if (t.length === 2 && articlesFor(language).has(t[0])) return t[1];
  return t.join(' ');
}

// A single word, once any article is set aside.
function detectKind(phrase, language) {
  const head = headwordOf(phrase, language);
  return head && head.indexOf(' ') === -1 ? 'word' : 'phrase';
}

// The key two entries are compared on for duplicates. Words compare on their
// headword, so "Quittung" and "die Quittung" are one entry, not two.
function vocabKey(phrase, kind, language) {
  return (kind || detectKind(phrase, language)) === 'word' ? headwordOf(phrase, language) : normalizeText(phrase);
}

// Infinitive endings a conjugated verb drops: verstehen -> verstehst,
// hablar -> hablamos. Only used when a real stem of 4+ letters remains.
const INFINITIVE_ENDINGS = {
  German: ['en'], Dutch: ['en'],
  Spanish: ['ar', 'er', 'ir'], Portuguese: ['ar', 'er', 'ir'],
  French: ['er', 'ir', 're'], Italian: ['are', 'ere', 'ire'],
  Swedish: ['a']
};

// Words must appear as a token of their own. Substring matching, which is
// fine for phrases, would count "Hund" inside "Hundefutter" and "Art" inside
// "Karte". Two kinds of inflection are accepted:
//   - the whole word plus a short ending (Quittung -> Quittungen, borrow -> borrowed);
//   - a verb's stem once its infinitive ending is dropped (verstehen -> verstehe).
// Sharing a prefix is not enough: "receipt" is not used in "received".
// Irregular forms (gehen -> ging) are left to the analyser's own verdict.
function wordWasUsed(word, haystack, language) {
  const head = headwordOf(word, language);
  if (!head || head.indexOf(' ') !== -1) return false;
  const tokens = normalizeText(haystack).split(' ').filter(Boolean);

  let verbStem = '';
  (INFINITIVE_ENDINGS[language] || []).forEach(e => {
    if (!verbStem && head.endsWith(e) && head.length - e.length >= 4) verbStem = head.slice(0, head.length - e.length);
  });

  return tokens.some(tok => {
    if (tok === head) return true;
    if (head.length >= 3 && tok.startsWith(head) && tok.length - head.length <= 3) return true;
    if (verbStem && tok.startsWith(verbStem) && Math.abs(tok.length - head.length) <= 3) return true;
    return false;
  });
}

// Verbatim transcripts keep hesitations, which would otherwise break a phrase
// in two: "our project, uh, focuses on". Only unambiguous fillers are dropped,
// and only for matching; "um" (German "around") and "er" ("he") are words.
const FILLER_TOKENS = new Set(['uh', 'uhh', 'uhm', 'uhmm', 'umm', 'ahm', 'ah', 'ahh', 'ehm', 'erm', 'hmm', 'hm', 'mhm', 'mm', 'eh', 'ehh']);

function withoutFillers(normalized) {
  return normalized.split(' ').filter(t => t && !FILLER_TOKENS.has(t)).join(' ');
}

function phraseWasUsed(phrase, haystack, kind, language) {
  if (kind === 'word') return wordWasUsed(phrase, haystack, language);
  const p = normalizeText(phrase);
  const h = withoutFillers(normalizeText(haystack));
  if (!p || !h) return false;
  if (h.includes(p)) return true;

  const words = p.split(' ').filter(w => w.length > 3);
  if (words.length < 2) return false;

  const hits = words.filter(w => h.includes(w.slice(0, Math.max(4, w.length - 2)))).length;
  return hits / words.length >= 0.75;
}

function pickRecorderMime() {
  if (typeof MediaRecorder === 'undefined') return '';
  const candidates = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/ogg;codecs=opus',
    'audio/mp4',
    'audio/mpeg'
  ];
  for (const c of candidates) {
    if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
  }
  return '';
}

function extensionForMime(mime) {
  if (!mime) return 'webm';
  if (mime.includes('webm')) return 'webm';
  if (mime.includes('ogg')) return 'ogg';
  if (mime.includes('mp4')) return 'mp4';
  if (mime.includes('mpeg')) return 'mp3';
  if (mime.includes('wav')) return 'wav';
  return 'webm';
}


// One profile row per language: your German level and your Spanish level are
// independent of each other.
async function loadOrCreateProfile(db, learnerId, language, defaults) {
  const existing = await db
    .from('profiles')
    .select('*')
    .eq('user_id', learnerId)
    .eq('target_language', language)
    .maybeSingle();
  if (existing.error) throw new Error('Supabase: ' + existing.error.message);
  if (existing.data) return existing.data;

  const ins = await db
    .from('profiles')
    .insert({
      user_id: learnerId,
      target_language: language,
      current_cefr: (defaults && defaults.current_cefr) || 'B1',
      vocab_injection_mode: (defaults && defaults.vocab_injection_mode) || 'adapt_naturally'
    })
    .select()
    .single();
  if (ins.error) throw new Error('Supabase: ' + ins.error.message);
  return ins.data;
}


// Learner profiles are separate people using the same install: each one owns
// its own languages, vocabulary, history and stats. The database caps these at
// five with a trigger, so the UI limit is a courtesy, not the enforcement.
async function fetchLearners(db) {
  const res = await db.from('learners').select('*').order('created_at', { ascending: true });
  if (res.error) throw new Error('Supabase: ' + res.error.message);
  return res.data || [];
}

async function ensureLearner(db) {
  const rows = await fetchLearners(db);
  if (rows.length) return rows;

  const ins = await db
    .from('learners')
    .insert({ id: DEFAULT_USER, name: 'Me', emoji: PROFILE_EMOJI[0] })
    .select()
    .single();
  if (ins.error) throw new Error('Supabase: ' + ins.error.message);
  return [ins.data];
}

function newLearnerId() {
  const rand = (window.crypto && window.crypto.randomUUID)
    ? window.crypto.randomUUID()
    : String(Date.now()) + Math.random().toString(16).slice(2);
  return 'learner_' + rand;
}

function missingIslandTables(error) {
  const msg = (error && error.message ? error.message : String(error || '')).toLowerCase();
  return (msg.indexOf('islands') !== -1 || msg.indexOf('island_stages') !== -1) &&
    (msg.indexOf('does not exist') !== -1 || msg.indexOf('schema cache') !== -1);
}

function missingSrsTables(error) {
  const msg = (error && error.message ? error.message : String(error || '')).toLowerCase();
  return (msg.indexOf('vocab_sets') !== -1 || msg.indexOf('srs_reviews') !== -1 || msg.indexOf('srs_revlog') !== -1) &&
    (msg.indexOf('does not exist') !== -1 || msg.indexOf('schema cache') !== -1);
}

function missingLearnersTable(error) {
  const msg = (error && error.message ? error.message : String(error || '')).toLowerCase();
  return msg.indexOf('learners') !== -1 &&
    (msg.indexOf('does not exist') !== -1 || msg.indexOf('schema cache') !== -1);
}

/* --------------------------------------------------------------- spend meter */

// OpenAI has no API for remaining credit balance, so the app keeps its own
// ledger: the learner enters what the billing page shows, and every call this
// app makes is priced from the usage OpenAI reports back and subtracted.
// List prices in USD, checked against the official model pages on 11 Sep 2026.
const PRICES_AS_OF = '11 Sep 2026';
const PRICES = {
  chat: { input: 2.5, cachedInput: 1.25, output: 10 },          // gpt-4o, per 1M tokens
  realtime: {                                                   // gpt-realtime, per 1M tokens
    textIn: 4, audioIn: 32, cachedIn: 0.4, textOut: 16, audioOut: 64
  },
  whisperPerMinute: 0.006,                                      // whisper-1 (fallback)
  transcribe: { input: 2.5, output: 10 },                      // gpt-4o-transcribe, per 1M tokens
  ttsPerMillionChars: 15                                        // tts-1
};
const SPEND_KEY = 'fluentloop.spend.v1';
const BILLING_URL = 'https://platform.openai.com/settings/organization/billing/overview';
const SPEND_CATEGORIES = ['chat', 'transcription', 'speech', 'realtime'];

function loadSpend() {
  try {
    const raw = localStorage.getItem(SPEND_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || typeof s.balance !== 'number') return null;
    s.spent = typeof s.spent === 'number' ? s.spent : 0;
    s.by = s.by || {};
    return s;
  } catch (e) {
    return null;
  }
}

function saveSpend(state) {
  try { localStorage.setItem(SPEND_KEY, JSON.stringify(state)); } catch (e) { /* storage full or blocked */ }
  try { window.dispatchEvent(new CustomEvent('fluentloop:spend')); } catch (e) { /* noop */ }
}

// A fresh balance starts a fresh ledger: whatever was spent before is already
// reflected in the number the learner read off the billing page.
function setStartingBalance(usd) {
  const by = {};
  SPEND_CATEGORIES.forEach(c => { by[c] = 0; });
  saveSpend({ balance: usd, setAt: new Date().toISOString(), spent: 0, by: by });
}

function recordSpend(category, usd) {
  if (!(usd > 0) || !isFinite(usd)) return;
  const s = loadSpend();
  if (!s) return; // nothing to subtract from until a balance is entered
  s.spent += usd;
  s.by[category] = (s.by[category] || 0) + usd;
  saveSpend(s);
}

function costOfChat(usage) {
  if (!usage) return 0;
  const prompt = usage.prompt_tokens || 0;
  const cached = (usage.prompt_tokens_details && usage.prompt_tokens_details.cached_tokens) || 0;
  const out = usage.completion_tokens || 0;
  return ((prompt - cached) * PRICES.chat.input + cached * PRICES.chat.cachedInput + out * PRICES.chat.output) / 1e6;
}

// Cached tokens are a subset of the input tokens of each modality, so they are
// taken out before the rest is priced at the full rate.
function costOfRealtimeResponse(usage) {
  if (!usage) return 0;
  const inD = usage.input_token_details || {};
  const cachedD = inD.cached_tokens_details || {};
  const outD = usage.output_token_details || {};
  const cachedText = cachedD.text_tokens || 0;
  const cachedAudio = cachedD.audio_tokens || 0;
  const p = PRICES.realtime;
  return (
    Math.max(0, (inD.text_tokens || 0) - cachedText) * p.textIn +
    Math.max(0, (inD.audio_tokens || 0) - cachedAudio) * p.audioIn +
    (cachedText + cachedAudio) * p.cachedIn +
    (outD.text_tokens || 0) * p.textOut +
    (outD.audio_tokens || 0) * p.audioOut
  ) / 1e6;
}

function costOfTranscription(seconds) {
  return Math.max(0, seconds || 0) / 60 * PRICES.whisperPerMinute;
}

// Transcription bills either by tokens (gpt-4o-transcribe) or by duration
// (whisper-1), and says which in the usage it returns. With no usage at all,
// the measured recording length at the per-minute rate is the estimate.
function costOfTranscriptionUsage(usage, fallbackSeconds) {
  if (usage && usage.type === 'tokens') {
    return ((usage.input_tokens || 0) * PRICES.transcribe.input +
      (usage.output_tokens || 0) * PRICES.transcribe.output) / 1e6;
  }
  if (usage && usage.type === 'duration') return costOfTranscription(usage.seconds);
  return costOfTranscription(fallbackSeconds);
}

function costOfSpeech(text) {
  return String(text || '').length / 1e6 * PRICES.ttsPerMillionChars;
}

/* -------------------------------------------------------------- OpenAI calls */

async function openaiError(res) {
  let detail = '';
  try {
    const body = await res.json();
    detail = (body && body.error && body.error.message) ? body.error.message : JSON.stringify(body);
  } catch (e) {
    try { detail = await res.text(); } catch (e2) { detail = ''; }
  }
  return new Error('OpenAI ' + res.status + ': ' + (detail || res.statusText));
}

/* ------------------------------------------------------- verbatim transcription */

// The analysis can only catch mistakes the transcriber leaves in. Speech
// recognisers are trained to produce clean text, and whisper-1 in particular
// quietly repairs non-native grammar. gpt-4o-transcribe follows written
// instructions, so it is told to keep the learner's speech exactly as said.
// whisper-1 stays as a fallback if the newer model is unavailable.
const TRANSCRIBE_MODEL = 'gpt-4o-transcribe';
const TRANSCRIBE_FALLBACK = 'whisper-1';

function verbatimPrompt(language, level) {
  return [
    'Verbatim transcript of a ' + (level || '') + ' learner of ' + language + ' speaking.',
    'Write exactly what the speaker says, word for word. Keep every mistake as spoken: wrong verb forms and ' +
      'endings, wrong articles and genders, wrong word order, wrong or invented words. Do not correct, improve, ' +
      'complete or tidy anything.',
    'Keep filler words, false starts, repetitions and self-corrections.',
    'If the speaker says a word in another language, write that word in the language it was said in; do not ' +
      'translate it.'
  ].join(' ');
}

// opts.model / opts.verbatim exist for the transcription check, which runs the
// old and new setups side by side on the same recording.
async function transcribeAudio(apiKey, blob, language, durationSec, level, opts) {
  const model = (opts && opts.model) || TRANSCRIBE_MODEL;
  const verbatim = !(opts && opts.verbatim === false);

  const send = async (useModel) => {
    const form = new FormData();
    form.append('file', blob, 'speech.' + extensionForMime(blob.type));
    form.append('model', useModel);
    form.append('language', langCode(language));
    form.append('temperature', '0');
    if (verbatim) form.append('prompt', verbatimPrompt(language, level));
    return fetch('https://api.openai.com/v1/audio/transcriptions', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + apiKey },
      body: form
    });
  };

  let used = model;
  let res = await send(model);
  // An account without access to the newer model still gets a transcript.
  if (!res.ok && model !== TRANSCRIBE_FALLBACK && (res.status === 400 || res.status === 403 || res.status === 404)) {
    console.warn(model + ' unavailable (' + res.status + '), falling back to ' + TRANSCRIBE_FALLBACK);
    used = TRANSCRIBE_FALLBACK;
    res = await send(TRANSCRIBE_FALLBACK);
  }
  if (!res.ok) throw await openaiError(res);
  const data = await res.json();
  recordSpend('transcription', costOfTranscriptionUsage(data.usage, durationSec));
  const text = (data.text || '').trim();
  return (opts && opts.detailed) ? { text: text, model: used } : text;
}

async function chatCompletion(apiKey, messages, options) {
  const opts = options || {};
  const payload = {
    model: 'gpt-4o',
    messages: messages,
    temperature: typeof opts.temperature === 'number' ? opts.temperature : 0.8
  };
  if (opts.maxTokens) payload.max_tokens = opts.maxTokens;
  if (opts.json) payload.response_format = { type: 'json_object' };

  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + apiKey,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw await openaiError(res);
  const data = await res.json();
  recordSpend('chat', costOfChat(data.usage));
  const choice = data.choices && data.choices[0];
  return (choice && choice.message && choice.message.content ? choice.message.content : '').trim();
}

async function synthesizeSpeech(apiKey, text, voice, speed) {
  const res = await fetch('https://api.openai.com/v1/audio/speech', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + apiKey,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      model: 'tts-1',
      voice: voice || 'alloy',
      input: text,
      response_format: 'mp3',
      // Conversation audio follows the learner's level; flashcard audio does not pass one.
      speed: typeof speed === 'number' ? speed : 1.0
    })
  });
  if (!res.ok) throw await openaiError(res);
  recordSpend('speech', costOfSpeech(text));
  return await res.blob();
}

async function verifyOpenAIKey(apiKey) {
  const res = await fetch('https://api.openai.com/v1/models', {
    headers: { 'Authorization': 'Bearer ' + apiKey }
  });
  if (!res.ok) throw await openaiError(res);
  return true;
}

/* --------------------------------------------------------- realtime engine */

// Realtime runs over WebRTC: the browser sends the mic track straight to OpenAI
// and plays the model's audio back through an <audio> element, so there is no
// record -> upload -> synthesize round trip. Turn taking is done server side by
// voice activity detection, which also handles barge-in.
function buildRealtimeSession(profile, topic, vocab, voice, stage, memory) {
  const base = buildSystemPrompt(profile, topic, vocab, stage, memory);
  const realtimeRules = [
    '',
    'THIS IS A LIVE SPOKEN CALL:',
    '- Speak at a pace a CEFR ' + profile.current_cefr + ' listener can follow, and keep each turn within the ' +
      'length set under HOW YOU SPEAK. Then stop and let the learner speak.',
    '- Never talk over the learner. If they start speaking, stop immediately and listen.',
    '- Tolerate pauses. If the learner goes quiet for a while, ask a simpler version of your question.',
    '- If you cannot make out what they said, ask them to repeat it in ' + profile.target_language + '.'
  ].join('\n');

  return {
    type: 'realtime',
    model: REALTIME_MODEL,
    instructions: base + '\n' + realtimeRules,
    output_modalities: ['audio'],
    audio: {
      input: {
        transcription: {
          model: TRANSCRIBE_MODEL,
          language: langCode(profile.target_language),
          prompt: verbatimPrompt(profile.target_language, profile.current_cefr)
        },
        noise_reduction: { type: 'near_field' },
        turn_detection: {
          type: 'server_vad',
          threshold: 0.5,
          prefix_padding_ms: 300,
          silence_duration_ms: 700,
          create_response: true,
          interrupt_response: true
        }
      },
      output: {
        voice: REALTIME_VOICES.indexOf(voice) === -1 ? 'alloy' : voice,
        // Slower for beginners, a touch quicker at the top. Range 0.25-1.5.
        speed: levelSpec(profile.current_cefr).speed
      }
    }
  };
}

// Ephemeral client secrets are the documented way to authenticate a browser.
// If the endpoint is unavailable we fall back to the API key that is already in
// this browser anyway, so the feature still works on older accounts.
async function createRealtimeSecret(apiKey, sessionConfig) {
  const res = await fetch('https://api.openai.com/v1/realtime/client_secrets', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + apiKey,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      expires_after: { anchor: 'created_at', seconds: 600 },
      session: sessionConfig
    })
  });
  if (!res.ok) throw await openaiError(res);
  const data = await res.json();
  if (data.value) return data.value;
  if (data.client_secret && data.client_secret.value) return data.client_secret.value;
  return '';
}

async function connectRealtime(apiKey, sessionConfig, handlers) {
  let secret = '';
  let usedRawKey = false;
  try {
    secret = await createRealtimeSecret(apiKey, sessionConfig);
  } catch (err) {
    console.warn('Ephemeral client secret unavailable, falling back to the API key:', err);
  }
  if (!secret) {
    secret = apiKey;
    usedRawKey = true;
  }

  const pc = new RTCPeerConnection();
  const audioEl = document.createElement('audio');
  audioEl.autoplay = true;
  audioEl.setAttribute('playsinline', '');
  audioEl.style.display = 'none';
  document.body.appendChild(audioEl);

  let micStream = null;

  function teardown() {
    try { if (micStream) micStream.getTracks().forEach(t => t.stop()); } catch (e) { /* noop */ }
    try { pc.close(); } catch (e) { /* noop */ }
    try {
      audioEl.srcObject = null;
      if (audioEl.parentNode) audioEl.parentNode.removeChild(audioEl);
    } catch (e) { /* noop */ }
  }

  try {
    pc.ontrack = (e) => { audioEl.srcObject = e.streams[0]; };

    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    micStream.getTracks().forEach(t => pc.addTrack(t, micStream));

    const dc = pc.createDataChannel('oai-events');
    dc.addEventListener('open', () => handlers.onOpen(dc));
    dc.addEventListener('message', (e) => {
      let parsed = null;
      try { parsed = JSON.parse(e.data); } catch (err) { return; }
      handlers.onEvent(parsed);
    });

    pc.addEventListener('connectionstatechange', () => handlers.onConnectionState(pc.connectionState));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const url = 'https://api.openai.com/v1/realtime/calls' +
      (usedRawKey ? '?model=' + encodeURIComponent(sessionConfig.model) : '');

    const res = await fetch(url, {
      method: 'POST',
      body: offer.sdp,
      headers: {
        'Authorization': 'Bearer ' + secret,
        'Content-Type': 'application/sdp'
      }
    });
    if (!res.ok) throw await openaiError(res);

    const answerSdp = await res.text();
    await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });

    return {
      pc: pc,
      micStream: micStream,
      audioEl: audioEl,
      close: teardown
    };
  } catch (err) {
    teardown();
    throw err;
  }
}

/* ----------------------------------------------------------- language islands */

// A language island is a domain the learner wants to own outright — their job,
// their city, the argument they keep having. The learner picks the island; the
// model designs the roadmap that builds it, stage by stage.
const ISLAND_STAGES_TARGET = 10;

const ISLAND_SEEDS = [
  'My work and what I actually do all day',
  'Where I am from and what the place is like',
  'My family and the people close to me',
  'The thing I do at weekends',
  'Getting through everyday errands and admin',
  'My opinions on something I care about'
];

async function generateIslandRoadmap(apiKey, profile, islandName, aboutYou, weakSpots) {
  const weakness = (weakSpots && weakSpots.length)
    ? 'Recent recorded weaknesses to design around:\n' + weakSpots.map(w => '- ' + w).join('\n')
    : 'No recorded weaknesses yet: assume the level is exactly CEFR ' + profile.current_cefr + '.';

  const about = (aboutYou && aboutYou.trim())
    ? 'What the learner told you about themselves:\n"""\n' + aboutYou.trim() + '\n"""'
    : 'The learner gave no personal detail, so keep the island widely usable but still concrete.';

  const raw = await chatCompletion(apiKey, [
    {
      role: 'system',
      content: 'You design speaking curricula built on Boris Shekhtman\'s "language islands": prepared, ' +
        'rehearsed blocks of speech a learner can deliver fluently on the subjects that keep coming up in their ' +
        'own life. You always reply with a single valid JSON object and nothing else.'
    },
    {
      role: 'user',
      content: [
        'Target language: ' + profile.target_language,
        'Learner level: CEFR ' + profile.current_cefr,
        'The island the learner chose to own: "' + islandName + '"',
        '',
        about,
        '',
        weakness,
        '',
        'Design a roadmap of EXACTLY ' + ISLAND_STAGES_TARGET + ' stages that takes this learner from wherever ' +
          'they are now to being able to hold this island fluently, without hesitation, in real conversation.',
        '',
        'What makes this a roadmap rather than a list of topics:',
        '- Order the stages so difficulty climbs steadily and each one is speakable at CEFR ' + profile.current_cefr + '.',
        '- Every stage after the first must reuse phrases from earlier stages: name those positions in ' +
          '"recycles_from". Recycling is what makes the island stick, so be deliberate about it.',
        '- Early stages are the load-bearing ones the learner will use in every single conversation. Later stages ' +
          'handle the harder, less predictable turns: disagreeing, telling a story with a point, handling a ' +
          'question they did not expect.',
        '- Ground every stage in the learner\'s actual life as described above. Specific beats generic: ' +
          '"explaining a deployment that went wrong" beats "talking about problems at work".',
        '',
        'Return ONLY a JSON object of this exact shape:',
        '{',
        '  "goal": "one sentence, in English, on what owning this island will let the learner do",',
        '  "stages": [',
        '    {',
        '      "position": 1,',
        '      "title": "short name for the stage, in English",',
        '      "objective": "the concrete thing they must be able to say, in English, one sentence",',
        '      "scenario": "the situation to practise it in, in English, one sentence",',
        '      "structures": ["grammar or patterns to lean on, in English, 1-3 items"],',
        '      "phrases": [',
        '        { "phrase": "the chunk in ' + profile.target_language + '", "translation": "English", "note": "when to reach for it", "kind": "phrase" }',
        '      ],',
        '      "done_when": "an observable test the learner passes, in English, one sentence",',
        '      "recycles_from": [1, 2]',
        '    }',
        '  ]',
        '}',
        '',
        'Rules:',
        '- EXACTLY ' + ISLAND_STAGES_TARGET + ' stages, positions 1 to ' + ISLAND_STAGES_TARGET + ' in order.',
        '- 4 to 6 items per stage. Most are multi-word chunks a native would actually say ("kind": "phrase").',
        '- A stage may also include AT MOST 2 single key words ("kind": "word"), and only words its situation cannot ' +
          'be talked about without that a CEFR ' + profile.current_cefr + ' learner may well not know. Give them ' +
          'in dictionary form: verbs in the infinitive, nouns with their definite article in gendered languages. ' +
          'Never spend a slot on a word the learner surely knows already.',
        '- "recycles_from" is an array of earlier positions, empty only for position 1.',
        '- "done_when" must be observable from a spoken conversation, not a feeling.',
        '- Output raw JSON only, no markdown fences, no commentary.'
      ].join('\n')
    }
  ], { json: true, temperature: 0.7, maxTokens: 4000 });

  const cleaned = raw.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  const parsed = JSON.parse(cleaned);
  if (!Array.isArray(parsed.stages) || !parsed.stages.length) {
    throw new Error('The model returned no stages.');
  }

  const stages = parsed.stages
    .slice(0, ISLAND_STAGES_TARGET)
    .map((st, i) => ({
      position: i + 1,
      title: String(st.title || ('Stage ' + (i + 1))).trim(),
      objective: String(st.objective || '').trim(),
      scenario: String(st.scenario || '').trim(),
      structures: Array.isArray(st.structures) ? st.structures.map(String) : [],
      phrases: (function () {
        let words = 0;
        return (Array.isArray(st.phrases) ? st.phrases : [])
          .filter(p => p && p.phrase)
          .map(p => {
            const phrase = String(p.phrase).trim();
            return {
              phrase: phrase,
              // The text decides, not the label: one word is a word.
              kind: detectKind(phrase, profile.target_language),
              translation: p.translation ? String(p.translation).trim() : '',
              note: p.note ? String(p.note).trim() : ''
            };
          })
          .filter(p => p.kind !== 'word' || ++words <= 2);
      })(),
      done_when: String(st.done_when || '').trim(),
      recycles_from: Array.isArray(st.recycles_from)
        ? st.recycles_from.map(n => parseInt(n, 10)).filter(n => Number.isInteger(n) && n >= 1 && n <= i)
        : []
    }));

  return { goal: String(parsed.goal || '').trim(), stages: stages };
}

// Suggest islands worth owning, given who the learner is.
async function suggestIslands(apiKey, profile, aboutYou) {
  const raw = await chatCompletion(apiKey, [
    {
      role: 'system',
      content: 'You help language learners choose which "language island" to build next. ' +
        'You always reply with a single valid JSON object and nothing else.'
    },
    {
      role: 'user',
      content: [
        'Target language: ' + profile.target_language + '. Level: CEFR ' + profile.current_cefr + '.',
        aboutYou && aboutYou.trim()
          ? 'About the learner:\n"""\n' + aboutYou.trim() + '\n"""'
          : 'The learner has told you nothing about themselves yet.',
        '',
        'Propose 4 islands: subjects this learner will genuinely have to speak about again and again, ' +
          'worth rehearsing until they are automatic. Ground them in the learner\'s real life where you know it.',
        '',
        'Return ONLY: { "islands": [ { "name": "short island name", "why": "one sentence on why it earns the effort" } ] }',
        'Output raw JSON only, no fences.'
      ].join('\n')
    }
  ], { json: true, temperature: 0.8, maxTokens: 800 });

  const cleaned = raw.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  const parsed = JSON.parse(cleaned);
  return (Array.isArray(parsed.islands) ? parsed.islands : [])
    .filter(i => i && i.name)
    .map(i => ({ name: String(i.name).trim(), why: i.why ? String(i.why).trim() : '' }));
}

// A stage clears when both halves are satisfied:
//   - every concrete check of its objective has been shown in some session
//     (checks accumulate: once met, a check stays met), and
//   - every phrase it introduced has been used in STAGE_PHRASE_SESSIONS
//     separate sessions, which proves recall on another day. Vocabulary
//     mastery proper stays at MASTERY_THRESHOLD; flashcards do long-term work.
const STAGE_PHRASE_SESSIONS = 2;
const STUCK_AFTER_SESSIONS = 3;
const FOCUS_SESSION_SECONDS = 10 * 60;

function stageGate(stage, vocabRows) {
  const phrases = Array.isArray(stage.phrases) ? stage.phrases : [];
  const lang = stage.target_language;
  const byPhrase = new Map();
  (vocabRows || []).forEach(v => byPhrase.set(vocabKey(v.phrase, v.kind, lang), v));

  let ready = 0;
  const outstanding = [];
  const phraseStates = phrases.map(p => {
    // A stage word may already be in the list without its article, or with it.
    const row = byPhrase.get(vocabKey(p.phrase, p.kind, lang));
    const uses = row ? (row.times_reviewed || 0) : 0;
    const isReady = !!row && (row.status === 'mastered' || uses >= STAGE_PHRASE_SESSIONS);
    if (isReady) ready += 1;
    else outstanding.push({ phrase: p.phrase, uses: uses });
    return { phrase: p.phrase, kind: p.kind, uses: Math.min(uses, STAGE_PHRASE_SESSIONS), ready: isReady };
  });

  const checks = Array.isArray(stage.checks) ? stage.checks : [];
  const checksMet = checks.filter(c => c.met).length;
  // Stages from before checks existed fall back to the single verdict.
  const aiDone = checks.length ? checksMet === checks.length : !!stage.ai_verdict;
  const vocabDone = phrases.length > 0 && ready === phrases.length;

  // One number for "how far through this stage": checks and phrase-sessions
  // weighted equally, so a session's worth of work always moves the bar.
  const phraseUnits = phrases.length * STAGE_PHRASE_SESSIONS;
  const phraseDone = phraseStates.reduce((n, p) => n + p.uses, 0);
  const checkPart = checks.length ? checksMet / checks.length : (aiDone ? 1 : 0);
  const phrasePart = phraseUnits ? phraseDone / phraseUnits : 0;
  const progress = Math.round(((checkPart + phrasePart) / 2) * 100);

  return {
    total: phrases.length,
    ready: ready,
    outstanding: outstanding,
    phrases: phraseStates,
    checks: checks,
    checksMet: checksMet,
    vocabDone: vocabDone,
    aiDone: aiDone,
    complete: vocabDone && aiDone,
    progress: progress,
    stuck: !(vocabDone && aiDone) && (stage.sessions_count || 0) >= STUCK_AFTER_SESSIONS
  };
}

// Fold one session's verdicts into the stage's checks. A check met before
// stays met with its original evidence; a newly met one is flagged so the
// feedback can celebrate it; an unmet one keeps the judge's latest note.
function mergeStageChecks(checks, verdicts, nowIso) {
  const byId = new Map((verdicts || []).map(v => [String(v.id), v]));
  return (checks || []).map(c => {
    const v = byId.get(String(c.id));
    if (c.met) return Object.assign({}, c, { newly: false });
    if (v && v.met && v.evidence && String(v.evidence).trim()) {
      return Object.assign({}, c, {
        met: true, newly: true, evidence: String(v.evidence).trim(), missing: '', met_at: nowIso
      });
    }
    return Object.assign({}, c, {
      newly: false,
      missing: v && v.missing ? String(v.missing).trim() : (c.missing || '')
    });
  });
}

// Turn a stage objective into 2-3 checks a judge can verify from a transcript
// of what the learner said. Style words that transcription cannot see are
// ruled out, which is what failed "introduce the project without hesitation".
async function generateStageChecks(apiKey, profile, stage) {
  const raw = await chatCompletion(apiKey, [
    {
      role: 'system',
      content: 'You write assessment criteria for spoken language practice. ' +
        'You always reply with a single valid JSON object and nothing else.'
    },
    {
      role: 'user',
      content: [
        'A ' + profile.target_language + ' learner at CEFR ' + profile.current_cefr + ' is working on this stage:',
        'Title: ' + stage.title,
        'Objective: ' + (stage.objective || stage.title),
        'Scenario: ' + (stage.scenario || '—'),
        'Original completion test: ' + (stage.done_when || '—'),
        '',
        'Split the objective into 2 or 3 concrete checks that a judge can verify ONLY from a written transcript ' +
          'of what the learner said. Each check names one thing the learner must say or do in their own words: ' +
          '"states what the project is for", "names one thing the team is working on now", "mentions a next step".',
        '',
        'Rules:',
        '- Never use criteria transcription cannot see or that are matters of taste: no "without hesitation", ' +
          '"fluently", "confidently", "naturally", "concisely", "clearly", "smoothly".',
        '- Each check must be satisfiable in a single turn by a CEFR ' + profile.current_cefr + ' learner.',
        '- Write each check as a short phrase in English, starting with a verb, max 12 words.',
        '',
        'Return ONLY: { "checks": [ { "text": "string" } ] }. Raw JSON, no fences.'
      ].join('\n')
    }
  ], { json: true, temperature: 0.3, maxTokens: 400 });

  const cleaned = raw.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  const parsed = JSON.parse(cleaned);
  const list = (Array.isArray(parsed.checks) ? parsed.checks : [])
    .map(c => (c && c.text ? String(c.text).trim() : ''))
    .filter(Boolean)
    .slice(0, 3);
  if (list.length < 2) throw new Error('Too few checks came back.');
  return list.map((text, i) => ({ id: 'c' + (i + 1), text: text, met: false, evidence: '', missing: '', met_at: null }));
}


/* -------------------------------------------------------------- daily stats */

// Local calendar days, not UTC: a session at 23:30 belongs to that evening.
function dayKey(value) {
  const d = value instanceof Date ? value : new Date(value);
  if (isNaN(d.getTime())) return '';
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function addDays(date, delta) {
  const d = new Date(date.getTime());
  d.setDate(d.getDate() + delta);
  return d;
}

function computeStreak(daysWithActivity, today) {
  // Today not being practised yet does not break a streak that ran to yesterday.
  let cursor = daysWithActivity.has(dayKey(today)) ? new Date(today) : addDays(today, -1);
  let current = 0;
  while (daysWithActivity.has(dayKey(cursor))) {
    current += 1;
    cursor = addDays(cursor, -1);
  }

  let best = 0;
  let run = 0;
  const sorted = Array.from(daysWithActivity).sort();
  let previous = null;
  sorted.forEach(key => {
    if (previous) {
      const gap = Math.round((new Date(key + 'T00:00:00') - new Date(previous + 'T00:00:00')) / 86400000);
      run = gap === 1 ? run + 1 : 1;
    } else {
      run = 1;
    }
    if (run > best) best = run;
    previous = key;
  });

  return { current: current, best: Math.max(best, current) };
}

function buildDailyStats(conversations, vocabulary, windowDays) {
  const today = new Date();
  const days = windowDays || 14;

  const byDay = new Map();
  const activeDays = new Set();

  (conversations || []).forEach(c => {
    const key = dayKey(c.created_at);
    if (!key) return;
    const entry = byDay.get(key) || { sessions: 0, seconds: 0, mastered: 0, added: 0 };
    entry.sessions += 1;
    entry.seconds += c.duration_seconds || 0;
    byDay.set(key, entry);
    activeDays.add(key);
  });

  (vocabulary || []).forEach(v => {
    const addedKey = dayKey(v.created_at);
    if (addedKey) {
      const entry = byDay.get(addedKey) || { sessions: 0, seconds: 0, mastered: 0, added: 0 };
      entry.added += 1;
      byDay.set(addedKey, entry);
    }
    if (v.status === 'mastered' && v.mastered_at) {
      const masteredKey = dayKey(v.mastered_at);
      if (masteredKey) {
        const entry = byDay.get(masteredKey) || { sessions: 0, seconds: 0, mastered: 0, added: 0 };
        entry.mastered += 1;
        byDay.set(masteredKey, entry);
      }
    }
  });

  const series = [];
  for (let i = days - 1; i >= 0; i--) {
    const date = addDays(today, -i);
    const key = dayKey(date);
    const entry = byDay.get(key) || { sessions: 0, seconds: 0, mastered: 0, added: 0 };
    series.push({
      key: key,
      date: date,
      label: date.toLocaleDateString(undefined, { weekday: 'narrow' }),
      minutes: Math.round(entry.seconds / 60),
      sessions: entry.sessions,
      mastered: entry.mastered,
      added: entry.added
    });
  }

  const todayEntry = byDay.get(dayKey(today)) || { sessions: 0, seconds: 0, mastered: 0, added: 0 };
  const totalSeconds = (conversations || []).reduce((sum, c) => sum + (c.duration_seconds || 0), 0);
  const streak = computeStreak(activeDays, today);

  const weekSeconds = series.slice(-7).reduce((sum, d) => sum + d.minutes * 60, 0);

  return {
    today: {
      sessions: todayEntry.sessions,
      minutes: Math.round(todayEntry.seconds / 60),
      mastered: todayEntry.mastered,
      added: todayEntry.added
    },
    streak: streak,
    series: series,
    totals: {
      sessions: (conversations || []).length,
      minutes: Math.round(totalSeconds / 60),
      learning: (vocabulary || []).filter(v => v.status === 'learning').length,
      mastered: (vocabulary || []).filter(v => v.status === 'mastered').length,
      weekMinutes: Math.round(weekSeconds / 60),
      activeDays: activeDays.size
    }
  };
}

/* ------------------------------------------------------- phrase suggestions */

// The analysis engine only ever proposes phrases reactively, from mistakes the
// learner already made. This fills the other half: high-frequency chunks worth
// starting to use, generated for the level rather than for a past session.
async function suggestStarterPhrases(apiKey, profile, theme, existingPhrases) {
  const avoid = (existingPhrases || []).slice(0, 120);
  const avoidBlock = avoid.length
    ? 'The learner already has these phrases, so do NOT suggest them or close variants:\n' +
      avoid.map(p => '- ' + p).join('\n')
    : 'The learner has no saved phrases yet, so cover the essentials first.';

  const themeLine = theme && theme.trim()
    ? 'Focus the whole set on this theme or situation: ' + theme.trim() + '.'
    : 'Cover a spread of everyday situations rather than one narrow theme.';

  const raw = await chatCompletion(apiKey, [
    {
      role: 'system',
      content: 'You are an experienced ' + profile.target_language + ' teacher who builds vocabulary lists from ' +
        'corpus frequency and real spoken usage. You always reply with a single valid JSON object and nothing else.'
    },
    {
      role: 'user',
      content: [
        'Propose 10 ' + profile.target_language + ' phrases a CEFR ' + profile.current_cefr +
          ' learner should start actively using in conversation.',
        '',
        themeLine,
        '',
        avoidBlock,
        '',
        'What to propose:',
        '- Mostly multi-word chunks: collocations, fixed expressions, sentence starters, connectors, ' +
          'hedges, reactions and polite formulas.',
        '- You may include AT MOST 2 single words, and only when the theme cannot really be talked about without ' +
          'them and a CEFR ' + profile.current_cefr + ' learner plausibly does not know them yet. Give those in ' +
          'dictionary form (infinitive; nouns with their definite article in gendered languages) and set their ' +
          '"kind" to "word". Everything else has "kind": "phrase".',
        '- Things a native actually says often, not textbook curiosities.',
        '- Pitched at CEFR ' + profile.current_cefr + ': comfortably sayable at that level but a step above ' +
          'what the learner probably reaches for by default.',
        '- Give each phrase in its natural citation form, the form the learner should memorise.',
        '',
        'Return ONLY a JSON object of this exact shape:',
        '{',
        '  "phrases": [',
        '    { "phrase": "string", "translation": "string", "context": "string", "category": "string", "kind": "phrase" }',
        '  ]',
        '}',
        '',
        'Field rules:',
        '- "phrase" is in ' + profile.target_language + '.',
        '- "translation" is a short, natural English equivalent.',
        '- "context" is one short English sentence saying when to reach for it.',
        '- "category" is one or two words, such as "opinion", "connector", "small talk", "polite request", "reaction", ' +
          'or "key word" for a single word.',
        '- Output raw JSON only, with no markdown fences and no commentary.'
      ].join('\n')
    }
  ], { json: true, temperature: 0.7, maxTokens: 1600 });

  const cleaned = raw.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  const parsed = JSON.parse(cleaned);
  const rows = Array.isArray(parsed.phrases) ? parsed.phrases : [];

  const lang = profile.target_language;
  const seen = new Set((existingPhrases || []).map(e => vocabKey(e, undefined, lang)));
  const out = [];
  let wordsTaken = 0;
  rows.forEach(r => {
    if (!r || !r.phrase) return;
    const phrase = String(r.phrase).trim();
    // Trust the text over the label: a one-word "phrase" is a word.
    const kind = detectKind(phrase, lang);
    if (kind === 'word' && wordsTaken >= 2) return;
    const key = vocabKey(phrase, kind, lang);
    if (!key || seen.has(key)) return;
    seen.add(key);
    if (kind === 'word') wordsTaken += 1;
    out.push({
      phrase: phrase,
      kind: kind,
      translation: r.translation ? String(r.translation).trim() : '',
      context: r.context ? String(r.context).trim() : '',
      category: kind === 'word' ? 'key word' : (r.category ? String(r.category).trim() : ''),
      source: 'suggested'
    });
  });
  return out;
}

/* ----------------------------------------------------------- export helpers */

// The schema has no Turkish column, so Turkish is produced on demand at export
// time and cached in memory for the rest of the session.
async function translateToTurkish(apiKey, items, sourceLanguage) {
  if (!items.length) return [];

  const list = items.map((it, i) => {
    const en = it.translation ? '  [known English meaning: ' + it.translation + ']' : '';
    return (i + 1) + '. ' + it.phrase + en;
  }).join('\n');

  const raw = await chatCompletion(apiKey, [
    {
      role: 'system',
      content: 'You are a professional ' + sourceLanguage + '-to-Turkish translator. ' +
        'You always reply with a single valid JSON object and nothing else.'
    },
    {
      role: 'user',
      content: [
        'Translate each of the following ' + sourceLanguage + ' phrases into natural Turkish.',
        '',
        list,
        '',
        'Return ONLY a JSON object of this exact shape:',
        '{ "translations": [ { "index": 1, "turkish": "string" } ] }',
        '',
        'Rules:',
        '- Include one entry for EVERY index from 1 to ' + items.length + ', in order.',
        '- "turkish" is the Turkish rendering a native speaker would actually say, not a word-for-word gloss.',
        '- For idioms and fixed expressions, give the equivalent Turkish idiom rather than a literal translation.',
        '- Keep each translation as short as the original. No explanations, no notes, no alternatives in brackets.',
        '- Output raw JSON only, with no markdown fences and no commentary.'
      ].join('\n')
    }
  ], { json: true, temperature: 0.2, maxTokens: 2000 });

  const cleaned = raw.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  const parsed = JSON.parse(cleaned);
  const rows = Array.isArray(parsed.translations) ? parsed.translations : [];

  const byIndex = new Map();
  rows.forEach(r => {
    const n = Number(r && r.index);
    if (Number.isInteger(n) && n >= 1 && n <= items.length) {
      byIndex.set(n, String(r.turkish == null ? '' : r.turkish).trim());
    }
  });

  return items.map((it, i) => byIndex.get(i + 1) || '');
}

function csvCell(value) {
  const text = value == null ? '' : String(value);
  return '"' + text.replace(/"/g, '""') + '"';
}

function buildVocabCsv(rows, sourceLanguage, withTurkish) {
  const header = [sourceLanguage + ' phrase', 'English', 'Turkish', 'Context', 'Times reviewed', 'Target reviews', 'Status', 'Added']
    .filter((h, i) => withTurkish || i !== 2);

  const lines = [header.map(csvCell).join(',')];

  rows.forEach(r => {
    const cells = [
      r.phrase,
      r.translation || '',
      r.turkish || '',
      r.correction_context || '',
      r.times_reviewed || 0,
      MASTERY_THRESHOLD,
      r.status || 'learning',
      r.created_at ? String(r.created_at).slice(0, 10) : ''
    ].filter((c, i) => withTurkish || i !== 2);
    lines.push(cells.map(csvCell).join(','));
  });

  // The BOM keeps Turkish and German characters intact when Excel opens the file.
  return '﻿' + lines.join('\r\n') + '\r\n';
}

function buildVocabText(rows, sourceLanguage, withTurkish) {
  const stamp = new Date().toISOString().slice(0, 10);
  const title = 'Active vocabulary — ' + sourceLanguage + (withTurkish ? ' → Turkish' : '');
  const out = [
    title,
    'Exported ' + stamp + ' · ' + rows.length + ' phrase' + (rows.length === 1 ? '' : 's'),
    '='.repeat(Math.max(title.length, 32)),
    ''
  ];

  rows.forEach((r, i) => {
    out.push((i + 1) + '. ' + r.phrase);
    if (withTurkish) out.push('   TR: ' + (r.turkish || '—'));
    if (r.translation) out.push('   EN: ' + r.translation);
    if (r.correction_context) out.push('   Context: ' + r.correction_context);
    out.push('   Progress: ' + (r.times_reviewed || 0) + '/' + MASTERY_THRESHOLD + ' uses · ' + (r.status || 'learning'));
    out.push('');
  });

  return out.join('\n');
}

function downloadFile(filename, mimeType, content) {
  const blob = new Blob([content], { type: mimeType + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ------------------------------------------------------------ prompt builders */

function relativeDay(iso) {
  const then = new Date(iso);
  const a = new Date(then.getFullYear(), then.getMonth(), then.getDate());
  const now = new Date();
  const b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const days = Math.round((b - a) / 86400000);
  if (days <= 0) return 'earlier today';
  if (days === 1) return 'yesterday';
  if (days < 7) return days + ' days ago';
  if (days < 14) return 'last week';
  return Math.round(days / 7) + ' weeks ago';
}

// What the partner "remembers": facts the learner has shared, what recent
// sessions were about, and the mistakes that keep coming back. Built from the
// analysis stored with each past conversation, so it costs no extra API call.
function buildMemoryBlock(memory) {
  if (!memory) return '';
  const facts = memory.facts || [];
  const recent = memory.recent || [];
  const weak = memory.weakSpots || [];
  const about = (memory.about || '').trim();
  if (!facts.length && !recent.length && !weak.length && !about) return '';

  const out = [
    '',
    'WHAT YOU REMEMBER ABOUT THIS LEARNER. You are the same conversation partner they have talked to before, ' +
      'not a stranger:'
  ];
  if (about) out.push('In their own words: "' + about + '"');
  if (facts.length) {
    out.push('Things they have told you in earlier conversations:');
    facts.forEach(f => out.push('- ' + f));
  }
  if (recent.length) {
    out.push('Your recent conversations together:');
    recent.forEach(r => out.push('- ' + r.when + ': ' + r.what));
  }
  if (weak.length) {
    out.push('Things they keep getting wrong. Create natural chances for them to practise these, but never correct ' +
      'them out loud and never mention these notes:');
    weak.forEach(w => out.push('- ' + w));
  }
  out.push('Use this the way a friend would: pick up threads, ask how things they mentioned turned out, build on ' +
    'what you already know instead of asking again. Never recite this list, never reveal that you keep notes, and ' +
    'never invent details that are not here. If something they say now contradicts it, believe them.');
  return out.join('\n');
}

// Collapse the stored analyses of recent sessions into partner memory.
// Newest first; facts are de-duplicated so a repeated detail is said once.
function memoryFromConversations(rows, aboutYou) {
  const facts = [];
  const seen = new Set();
  const recent = [];
  const weakCount = new Map();

  (rows || []).forEach(row => {
    const fb = row.feedback || {};
    (Array.isArray(fb.learner_facts) ? fb.learner_facts : []).forEach(f => {
      const key = normalizeText(f);
      if (key && !seen.has(key) && facts.length < 12) { seen.add(key); facts.push(String(f).trim()); }
    });
    if (recent.length < 4) {
      const what = (fb.conversation_summary && String(fb.conversation_summary).trim()) ||
        (row.topic ? 'talked about ' + String(row.topic).trim() : '');
      if (what) recent.push({ when: relativeDay(row.created_at), what: what });
    }
    (Array.isArray(fb.grammar_mistakes) ? fb.grammar_mistakes : []).forEach(m => {
      const e = m && m.explanation ? String(m.explanation).trim() : '';
      if (e) weakCount.set(e, (weakCount.get(e) || 0) + 1);
    });
  });

  // Most frequent mistakes first: those are the habits worth breaking.
  const weakSpots = Array.from(weakCount.entries())
    .sort((a, b) => b[1] - a[1])
    .slice(0, 4)
    .map(e => e[0]);

  return { facts: facts, recent: recent, weakSpots: weakSpots, about: aboutYou || '' };
}

// How the partner speaks at each CEFR level. Concrete numbers instead of
// adjectives: "calibrate to B2" alone let one B2 session sound like A2 and the
// next like C1 business English. Only the selected level goes into the prompt.
const LEVEL_SPEC = {
  A1: {
    speed: 0.8, maxTokens: 90,
    sentences: 'very short sentences of about 3 to 7 words',
    turn: 'one or two sentences, 15 words at most in total',
    grammar: 'present tense only, simple word order, no subordinate clauses; "can", "like" and "want" are fine',
    vocabulary: 'only the most common everyday words: people, food, home, time, numbers, simple actions. ' +
      'No idioms, no slang, no phrasal verbs, no abstract words',
    questions: 'yes/no or either/or questions about the here and now ("Do you like tea or coffee?")',
    stuck: 'say it again more slowly with even simpler words, or offer two short options to choose from'
  },
  A2: {
    speed: 0.87, maxTokens: 110,
    sentences: 'short sentences of about 5 to 10 words',
    turn: 'one or two sentences, about 22 words at most in total',
    grammar: 'present, simple past and near future ("going to"); join ideas with "and", "but", "because"',
    vocabulary: 'frequent everyday words for routines, family, work, shopping and free time. No idioms, rare ' +
      'words or abstract vocabulary',
    questions: 'simple wh-questions about their routines, their last weekend and their plans',
    stuck: 'rephrase with simpler, more common words and a shorter sentence'
  },
  B1: {
    speed: 0.95, maxTokens: 150,
    sentences: 'clear sentences of about 8 to 14 words',
    turn: 'two or three sentences, about 35 words at most in total',
    grammar: 'all common tenses and simple subordinate clauses ("when", "if", "because", "that")',
    vocabulary: 'everyday vocabulary plus the words the topic needs; at most an occasional very common idiom whose ' +
      'meaning is obvious from context',
    questions: 'open questions about their experiences, opinions and reasons ("Why?", "What happened when...?")',
    stuck: 'rephrase more simply and give a little context'
  },
  B2: {
    speed: 1.0, maxTokens: 180,
    sentences: 'natural sentences of about 10 to 18 words',
    turn: 'two or three sentences, about 45 words at most in total',
    grammar: 'the full everyday range: conditionals, passive, relative clauses, natural linking words',
    vocabulary: 'broad everyday and topic vocabulary, common idioms and phrasal verbs. Avoid rare, formal or ' +
      'corporate words ("leverage", "streamline", "synergy") unless the learner used them first',
    questions: 'ask them to explain, compare, justify or imagine ("What would you do if...?")',
    stuck: 'rephrase in plainer words without slowing down'
  },
  C1: {
    speed: 1.05, maxTokens: 220,
    sentences: 'varied, natural sentences of any length a fluent speaker would use',
    turn: 'up to three or four sentences, about 60 words at most in total',
    grammar: 'complex structures, hedging and nuance',
    vocabulary: 'precise and idiomatic, with shifts of register; less common words are welcome',
    questions: 'nuanced and abstract questions; politely challenge their views and ask them to defend them',
    stuck: 'rephrase once, then carry on at full level'
  },
  C2: {
    speed: 1.1, maxTokens: 260,
    sentences: 'fully native sentences',
    turn: 'up to four sentences, about 70 words at most in total',
    grammar: 'anything a highly articulate native speaker would use',
    vocabulary: 'idioms, humour, irony, cultural references and fine distinctions of meaning',
    questions: 'demanding, open-ended questions that need a considered answer',
    stuck: 'carry on at native level; they can handle it'
  }
};

function levelSpec(level) {
  return LEVEL_SPEC[level] || LEVEL_SPEC.B1;
}

function buildLevelBlock(level) {
  const L = levelSpec(level);
  return [
    'HOW YOU SPEAK: the learner is at CEFR ' + level + '. Hold every turn to this, from your very first line:',
    '- Sentences: ' + L.sentences + ' (or the equivalent in a language that does not separate words).',
    '- Length of each turn: ' + L.turn + '.',
    '- Grammar: ' + L.grammar + '.',
    '- Vocabulary: ' + L.vocabulary + '.',
    '- Questions: ' + L.questions + '.',
    '- If they do not understand: ' + L.stuck + '.',
    '- Stay AT ' + level + ': not below and not above. Sounding like a beginners\' textbook to a ' + level +
      ' learner is as much a failure as talking over their head.',
    '- Do not drift upward to match the learner. You may reuse a harder word they introduced themselves, but keep ' +
      'everything around it at ' + level + '.'
  ].join('\n');
}

function buildSystemPrompt(profile, topic, vocab, stage, memory) {
  const lang = profile.target_language;
  const level = profile.current_cefr;
  const forceVerbatim = profile.vocab_injection_mode === 'force_verbatim';

  const vocabLines = vocab.map(v => {
    const tr = v.translation ? ' — means: ' + v.translation : '';
    const ctx = v.correction_context ? ' — context: ' + v.correction_context : '';
    return '- ' + (v.kind === 'word' ? 'word ' : '') + '"' + v.phrase + '"' + tr + ctx;
  }).join('\n');
  const hasWords = vocab.some(v => v.kind === 'word');

  const injectionRule = forceVerbatim
    ? 'FORCE VERBATIM MODE: you must use each target phrase EXACTLY as written, character for character, ' +
      'with no change to word order, conjugation, article, or case. Build your sentences around the phrase so ' +
      'the verbatim form still fits. Use at most one target phrase per turn, and prefer phrases you have not used yet.'
    : 'ADAPT NATURALLY MODE: weave the target phrases into your turns so they sound native. You may conjugate, ' +
      'decline, change tense, adjust articles and word order so the phrase fits the sentence. Use at most one ' +
      'target phrase per turn, and prefer phrases you have not used yet.';

  const vocabBlock = vocab.length
    ? 'ACTIVE TARGET PHRASES the learner is trying to acquire:\n' + vocabLines + '\n\n' + injectionRule +
      '\nAfter you use a target phrase, steer the conversation so the learner has a natural reason to reuse it ' +
      'in their own answer. Never announce that you are practising a phrase and never label it.' +
      (hasWords
        ? '\nEntries marked "word" are single words the learner was missing. Do not hand them over: create moments ' +
          'where the learner has to name that thing or action themselves, for example by asking about it, and only ' +
          'use the word yourself if they are clearly stuck.'
        : '')
    : 'The learner has no active target phrases yet. Introduce useful, level-appropriate everyday expressions ' +
      'naturally and give the learner reasons to reuse them.';

  const stageBlock = stage ? [
    '',
    'THIS SESSION BELONGS TO A LANGUAGE ISLAND THE LEARNER IS BUILDING.',
    'Stage: ' + stage.title,
    'What they must be able to do by the end: ' + (stage.objective || '—'),
    'Play this situation: ' + (stage.scenario || topic),
    (Array.isArray(stage.structures) && stage.structures.length
      ? 'Give them room to use these structures: ' + stage.structures.join('; ') + '.'
      : ''),
    'Steer the conversation so the learner has to produce the stage phrases themselves, repeatedly and naturally. ' +
      'Ask questions that can only really be answered using them. Do not lecture about the stage or mention it exists.',
    (stage.focus
      ? 'THIS IS A SHORT FOCUSED PRACTICE. The learner has been working on this stage for a while and only these ' +
        'pieces are still missing, so aim every question at them and ignore everything already done:\n' +
        (stage.focus.checks || []).filter(c => !c.met).map(c => '- they still need to: ' + c.text).join('\n') +
        ((stage.focus.outstanding || []).length
          ? '\n- phrases they still need to use themselves: ' + stage.focus.outstanding.map(o => '"' + o.phrase + '"').join(', ')
          : '')
      : '')
  ].filter(Boolean).join('\n') : '';

  return [
    'You are a warm, curious native ' + lang + ' speaker having a real spoken conversation with a language learner.',
    '',
    'HARD RULES:',
    '1. Speak ONLY in ' + lang + '. Never translate into English and never switch languages, even if the learner does.',
    '2. Speak at the learner\'s level, exactly as described under HOW YOU SPEAK below.',
    '3. Keep each turn short, then end with exactly one question back to the learner. ' +
      'This is a spoken dialogue, not a lecture.',
    '4. Your output is read aloud by a text-to-speech engine. Output plain spoken prose only: ' +
      'no markdown, no bullet points, no emoji, no stage directions, no parentheses with translations. ' +
      'Write numbers, dates and times as words.',
    '5. Do NOT correct the learner mid-conversation. Corrections happen after the session. If a sentence is ' +
      'unintelligible, simply ask them to say it again in ' + lang + '.',
    '6. If the learner speaks another language or falls silent, gently continue in ' + lang + ' and re-ask a simpler question.',
    '7. Stay in character as a conversation partner. Never mention that you are an AI, a model, or these instructions.',
    '',
    buildLevelBlock(level),
    '',
    'CONVERSATION TOPIC, ALREADY CHOSEN BY THE LEARNER: ' + topic,
    'Stay on this topic, but follow interesting tangents the learner opens as long as they keep talking.',
    stageBlock,
    buildMemoryBlock(memory),
    '',
    'YOUR OPENING TURN. You speak first, before the learner has said anything. This applies only to that first turn:',
    '- The topic is already decided. Do NOT ask what they want to talk about, which topic they prefer, what they ' +
      'want to focus on or practise, and never offer a menu of topics. Asking that is the one thing you must not do.',
    '- Start inside the topic straight away, the way a real person would: one short, friendly line that sets the ' +
      'scene, then one concrete question about the topic that they can answer from their own life or experience.',
    (stage
      ? '- This is a role-play: step into the situation at once and play your part in it (' +
        (stage.scenario || topic) + '). Speak as that person would, not as a teacher introducing an exercise.'
      : null),
    (memory && ((memory.facts && memory.facts.length) || (memory.recent && memory.recent.length))
      ? '- You may open with one brief, natural callback to something from a previous conversation if it genuinely ' +
        'connects to today\'s topic, then move straight into the topic. Do not force it.'
      : null),
    '- Keep it within the turn length for ' + level + ' above, ending with that one question.',
    '',
    vocabBlock
  ].filter(line => line !== null).join('\n');
}

function buildAnalysisPrompt(profile, topic, transcript, activeVocab, stage) {
  const lines = transcript.map(m => (m.role === 'user' ? 'LEARNER: ' : 'PARTNER: ') + m.content).join('\n');
  const activeList = (activeVocab || []).map(v => '- ' + v.phrase).join('\n');
  return [
    'You are a strict but encouraging ' + profile.target_language + ' teacher analysing a spoken practice session.',
    'The learner is at CEFR level ' + profile.current_cefr + '. The topic was: ' + topic + '.',
    'The learner turns are a VERBATIM speech-to-text transcript: the transcriber was told not to correct anything, ' +
      'so a wrong form in the transcript is what the learner actually said and counts as a real mistake. Fillers, ' +
      'false starts and repetitions are kept too: never list those as grammar mistakes, though you may mention ' +
      'hesitation in "cefr_level_feedback". Ignore punctuation and capitalisation, which the transcriber adds. ' +
      'Judge grammar, word choice, word order and register.',
    '',
    'TRANSCRIPT:',
    lines,
    '',
    'Return ONLY a JSON object with exactly this shape:',
    '{',
    '  "grammar_mistakes": [',
    '    { "original": "string", "correction": "string", "explanation": "string" }',
    '  ],',
    '  "recommended_phrases": [',
    '    { "phrase": "string", "translation": "string", "context": "string" }',
    '  ],',
    '  "word_gaps": [',
    '    { "word": "string", "translation": "string", "evidence": "string", "context": "string" }',
    '  ],',
    '  "next_topic_recommendation": "string",',
    '  "cefr_level_feedback": "string",',
    '  "used_target_phrases": ["string"],',
    '  "conversation_summary": "string",',
    '  "learner_facts": ["string"],',
    '  "stage_goal_met": true,',
    '  "stage_evidence": "string",',
    '  "stage_checks": [ { "id": "c1", "met": true, "evidence": "string", "missing": "string" } ]',
    '}',
    '',
    'Rules for the fields:',
    '- "grammar_mistakes": up to 8 real mistakes the LEARNER made. "original" is their exact wording, ' +
      '"correction" is the fixed ' + profile.target_language + ' sentence, "explanation" is one short sentence in English ' +
      'saying WHY. If the learner made no real mistakes, return an empty array.',
    '- "word_gaps": single ' + profile.target_language + ' WORDS the learner demonstrably needed in this ' +
      'conversation and did not have. Include a word only when the transcript shows the gap: they switched to ' +
      'another language for it, talked around it because they lacked it, used a wrong word in its place, asked what ' +
      'it meant, or plainly failed to understand it when the partner used it. "evidence" quotes the learner\'s own ' +
      'words that show the gap; if you cannot quote evidence, leave the word out. Give each word in dictionary ' +
      'form: verbs in the infinitive, and nouns WITH their definite article in languages with grammatical gender ' +
      '("die Quittung", "la facture", "la cuenta") because the gender has to be learned with the noun. ' +
      '"translation" is English; "context" is one short English sentence on when they will need it. 0 to 6 ' +
      'items. An empty array is normal and correct when there were no gaps: never pad it, never include a word ' +
      'too rare to come up again, and never repeat a word that is part of a recommended phrase.',
    '- "recommended_phrases": 3 to 6 NEW multi-word ' + profile.target_language + ' phrases (single words belong ' +
      'in "word_gaps", not here) that would have made this exact ' +
      'conversation smoother, appropriate for CEFR ' + profile.current_cefr + '. "phrase" is in ' + profile.target_language +
      ', "translation" is English, "context" is one short English sentence on when to use it.',
    '- "next_topic_recommendation": one concrete conversation topic for the next session that will force the learner ' +
      'to reuse those phrases and re-attempt the structures they got wrong. One sentence, in English.',
    '- "cefr_level_feedback": two to four sentences in English on their current level, what went well, and the single ' +
      'highest-value thing to fix next.',
    activeList
      ? '- "used_target_phrases": the learner is currently practising these target phrases:\n' + activeList + '\n' +
        '"used_target_phrases" must list, copied EXACTLY as written above, only those target phrases the LEARNER ' +
        'actually produced in their own turns. Count a phrase as used even if they conjugated it, declined it, ' +
        'split it, changed its tense, or made a small error in it. Do not count phrases only the PARTNER said. ' +
        'Do not invent phrases that are not in the list. If none were used, return an empty array.'
      : '- "used_target_phrases": return an empty array, the learner has no active target phrases.',
    '- "conversation_summary": one or two sentences, in English, on what the two of you actually talked about, ' +
      'specific enough that a friend could pick the thread up next time ("they described a deployment that broke ' +
      'on Friday and how the team rolled it back"), not a label ("talked about work").',
    '- "learner_facts": up to 6 short facts, in English, that the LEARNER revealed about their own life in this ' +
      'conversation: job, people, places, plans, preferences, things that happened to them. Only what they actually ' +
      'said, never guesses, never facts about the partner. Empty array if they shared nothing personal.',
    (stage && Array.isArray(stage.checks) && stage.checks.length)
      ? '- "stage_checks": this session was part of a language island stage ("' + stage.title + '"). Judge each ' +
        'check below separately, strictly on what the LEARNER said, never on what the partner said:\n' +
        stage.checks.map(c => '  ' + c.id + ': ' + c.text + (c.met ? ' (already met in an earlier session)' : '')).join('\n') +
        '\nFor each check return its id, "met" true only if the learner\'s own words in THIS transcript show it, ' +
        'and "evidence": a short verbatim quote of those words. If it is not met, "evidence" is "" and "missing" is ' +
        'one short, encouraging sentence on what they still need to say. Judge content only: do not fail a check ' +
        'for being long, hesitant, imperfect or wordy: the transcript is verbatim, so fillers and false starts are ' +
        'there on purpose, and grammar is covered elsewhere. Set "stage_goal_met" true only if every check is met, ' +
        'and "stage_evidence" to "".'
      : null,
    (stage && !(Array.isArray(stage.checks) && stage.checks.length)) ?
      '- "stage_checks": []. And for "stage_goal_met" and "stage_evidence": this session was part of a language island. The stage objective ' +
        'was: "' + (stage.objective || stage.title) + '". It counts as met when: "' + (stage.done_when || 'the learner ' +
        'achieved the objective unaided') + '". Judge STRICTLY from the transcript, on what the LEARNER produced, not ' +
        'on what the partner said. Set "stage_goal_met" true only if the transcript really shows it, and quote the ' +
        'learner\'s own words in "stage_evidence" (one sentence). If it was not met, say what is still missing.'
      : null,
    !stage ? '- "stage_goal_met": false, "stage_evidence": "", "stage_checks": [] — this session was not part of an island.' : null,
    'Output raw JSON only, with no markdown fences and no commentary.'
  ].filter(line => line !== null).join('\n');
}

/* ============================================================================
   SPACED REPETITION — ported from Wordstack, driven by saved vocabulary.

   Each saved phrase is forged into a card set: six natural example sentences
   plus one mp3 per sentence. That set yields 13 cards — 1 reading, 6 listening,
   6 speaking-cloze — scheduled with the same SM-2 variant Wordstack uses.
   ========================================================================== */

const SRS_DECKS = ['reading', 'listening', 'speaking'];
const LEARN_STEPS_MIN = [1, 10];
const RELEARN_STEPS_MIN = [10];
const LEARN_AHEAD_MIN = 20;
const DEFAULT_NEW_PER_DAY = 20;
const SENTENCES_PER_SET = 6;

const CARD_ACCENTS = {
  reading:   ['#2B59C3', '#7C3AED'],
  listening: ['#0EA5A4', '#2B59C3'],
  speaking:  ['#E8590C', '#F5C400']
};

/* ---------- text helpers (verbatim behaviour from the original) ---------- */

const esc = v => String(v == null ? '' : v)
  .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
  .replaceAll('"', '&quot;').replaceAll("'", '&#39;');

const stripField = v => String(v == null ? '' : v).replace(/\t/g, ' ').replace(/\r?\n/g, '<br>');
const rescape = v => v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

const splitPhrase = w => String(w == null ? '' : w)
  .split(/\s*(?:\.{2,}|…)\s*/)
  .map(t => t.trim())
  .filter(Boolean);

function findParts(safe, parts) {
  const ranges = [];
  let from = 0;
  for (const part of parts) {
    const pat = new RegExp(rescape(esc(part)), 'ig');
    pat.lastIndex = from;
    const m = pat.exec(safe);
    if (!m) return null;
    ranges.push([m.index, m.index + m[0].length]);
    from = m.index + m[0].length;
  }
  return ranges;
}

function wrapRanges(safe, ranges, wrapFn) {
  let out = '';
  let prev = 0;
  ranges.forEach(r => {
    out += safe.slice(prev, r[0]) + wrapFn(safe.slice(r[0], r[1]));
    prev = r[1];
  });
  return out + safe.slice(prev);
}

const CARD_FONT = "-apple-system,'Segoe UI',Roboto,'Noto Sans','Helvetica Neue',sans-serif";
const HL_B = inner =>
  '<b style="font-weight:700;color:#1E2A38;background:#FFE45C;padding:0 .18em;border-radius:4px;">' + inner + '</b>';
const NATIVE_SPAN = t => '<span style="color: #666666; font-size: 0.9em;">' + t + '</span>';
const AUDIO_TAG = b64 => b64
  ? '<audio controls preload="none" style="width:100%;max-width:420px;" src="data:audio/mp3;base64,' + b64 + '"></audio>'
  : '<div style="font-size:.85em;color:#8A94A6;border:1px dashed #C9D2DD;border-radius:8px;padding:8px 12px;">Audio is still loading for this card.</div>';

function boldify(sentence, form, baseWord) {
  const safe = esc(sentence);
  const needles = [form, baseWord];
  for (const needle of needles) {
    const parts = splitPhrase(needle);
    if (!parts.length) continue;
    if (parts.length === 1) {
      const pattern = new RegExp(rescape(esc(parts[0])), 'gi');
