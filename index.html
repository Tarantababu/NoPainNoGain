<script type="text/babel" data-presets="react">
/* ============================================================================
   FLUENT LOOP — single-file voice language coach
   ----------------------------------------------------------------------------
   Required Supabase schema (run this SQL once in the Supabase SQL editor).
   Every learner-owned row is scoped to (user_id, target_language), so each
   target language is a separate workspace: its own level, its own vocabulary,
   its own session history. Nothing leaks between languages.

   create table if not exists public.profiles (
     id uuid primary key default gen_random_uuid(),
     user_id text default 'default_user',
     target_language text not null default 'German',
     current_cefr text default 'B1',
     vocab_injection_mode text default 'adapt_naturally', -- 'adapt_naturally' | 'force_verbatim'
     unique (user_id, target_language)
   );

   create table if not exists public.target_vocabulary (
     id uuid primary key default gen_random_uuid(),
     user_id text default 'default_user',
     target_language text not null default 'German',
     phrase text not null,
     translation text,
     correction_context text,
     times_reviewed int default 0,
     status text default 'learning', -- 'learning' | 'mastered'
     created_at timestamp with time zone default now()
   );

   create table if not exists public.conversations (
     id uuid primary key default gen_random_uuid(),
     user_id text default 'default_user',
     target_language text not null default 'German',
     topic text not null,
     duration_seconds int,
     transcript jsonb not null,
     feedback jsonb,
     created_at timestamp with time zone default now()
   );

   Upgrading from the single-language schema? The setup screen carries the
   migration, which backfills existing rows from your old profile row.

   This app talks to Supabase directly from the browser with the anon key,
   so either keep RLS off for these tables (single-user/local use) or add
   policies that allow anon read/write:

   alter table public.profiles enable row level security;
   create policy "anon all" on public.profiles for all to anon using (true) with check (true);
   (repeat for target_vocabulary and conversations)
   ========================================================================== */

const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ---------------------------------------------------------------- constants */

const DEFAULT_USER = 'default_user';
const MAX_PROFILES = 5;
const PROFILE_EMOJI = ['🙂', '🦊', '🐙', '🦉', '🐳', '🌵', '🍀', '⚡', '🎧', '🚀'];

// Every learner-owned row is scoped to (user_id, target_language) so that
// switching language switches to a completely separate vocabulary, history and
// level. Nothing crosses between languages.
function scoped(query, learnerId, language) {
  return query.eq('user_id', learnerId).eq('target_language', language);
}

function missingLanguageColumn(error) {
  const msg = (error && error.message ? error.message : String(error || '')).toLowerCase();
  return msg.indexOf('target_language') !== -1 &&
    (msg.indexOf('does not exist') !== -1 || msg.indexOf('column') !== -1 || msg.indexOf('schema cache') !== -1);
}

const MIGRATION_HINT = 'Your database is missing the latest schema. ' +
  'Run the migrations shown on the setup screen (or `supabase db push`), then reload.';
const SESSION_SECONDS = 30 * 60;
const MASTERY_THRESHOLD = 3;
const CONFIG_KEY = 'fluentloop.config.v1';

const LANGUAGES = [
  { name: 'German',   code: 'de' },
  { name: 'Spanish',  code: 'es' },
  { name: 'French',   code: 'fr' },
  { name: 'Italian',  code: 'it' },
  { name: 'Portuguese', code: 'pt' },
  { name: 'Dutch',    code: 'nl' },
  { name: 'Swedish',  code: 'sv' },
  { name: 'Polish',   code: 'pl' },
  { name: 'Turkish',  code: 'tr' },
  { name: 'Russian',  code: 'ru' },
  { name: 'Arabic',   code: 'ar' },
  { name: 'Japanese', code: 'ja' },
  { name: 'Korean',   code: 'ko' },
  { name: 'Mandarin Chinese', code: 'zh' },
  { name: 'English',  code: 'en' }
];

const CEFR_LEVELS = [
  { code: 'A1', label: 'A1 — Beginner' },
  { code: 'A2', label: 'A2 — Elementary' },
  { code: 'B1', label: 'B1 — Intermediate' },
  { code: 'B2', label: 'B2 — Upper intermediate' },
  { code: 'C1', label: 'C1 — Advanced' },
  { code: 'C2', label: 'C2 — Mastery' }
];

const FALLBACK_TOPICS = [
  'A weekend trip that did not go as planned',
  'Ordering food and dealing with a mixed-up order',
  'Describing your daily routine and what you would change',
  'A film or series you watched recently',
  'Talking to a neighbour about noise in the building',
  'Planning a birthday party with a friend',
  'A job interview for a role you really want'
];

const VOICES = ['alloy', 'echo', 'fable', 'onyx', 'nova', 'shimmer'];

const REALTIME_MODEL = 'gpt-realtime';
const REALTIME_VOICES = ['alloy', 'ash', 'ballad', 'coral', 'echo', 'sage', 'shimmer', 'verse'];
const MODE_TURN = 'turn_based';
const MODE_REALTIME = 'realtime';

/* ------------------------------------------------------------------ helpers */

function langCode(name) {
  const hit = LANGUAGES.find(l => l.name === name);
  return hit ? hit.code : 'en';
}

function loadConfig() {
  try {
    const raw = localStorage.getItem(CONFIG_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.openaiKey || !parsed.supabaseUrl || !parsed.supabaseKey) return null;
    return parsed;
  } catch (e) {
    return null;
  }
}

function saveConfig(cfg) {
  try {
    localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
  } catch (e) {
    console.warn('Could not persist config:', e);
  }
}

function formatClock(totalSeconds) {
  const s = Math.max(0, Math.floor(totalSeconds));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}

function normalizeText(input) {
  if (!input) return '';
  return String(input)
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^\p{L}\p{N}\s]/gu, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

// Fuzzy "did the learner actually use this phrase?" check.
// Exact normalized substring wins; otherwise require most content words present,
// which tolerates conjugation and case changes in inflected languages.
function phraseWasUsed(phrase, haystack) {
  const p = normalizeText(phrase);
  const h = normalizeText(haystack);
  if (!p || !h) return false;
  if (h.includes(p)) return true;

  const words = p.split(' ').filter(w => w.length > 3);
  if (words.length < 2) return false;

  const hits = words.filter(w => h.includes(w.slice(0, Math.max(4, w.length - 2)))).length;
  return hits / words.length >= 0.75;
}

function pickRecorderMime() {
  if (typeof MediaRecorder === 'undefined') return '';
  const candidates = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/ogg;codecs=opus',
    'audio/mp4',
    'audio/mpeg'
  ];
  for (const c of candidates) {
    if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
  }
  return '';
}

function extensionForMime(mime) {
  if (!mime) return 'webm';
  if (mime.includes('webm')) return 'webm';
  if (mime.includes('ogg')) return 'ogg';
  if (mime.includes('mp4')) return 'mp4';
  if (mime.includes('mpeg')) return 'mp3';
  if (mime.includes('wav')) return 'wav';
  return 'webm';
}


// One profile row per language: your German level and your Spanish level are
// independent of each other.
async function loadOrCreateProfile(db, learnerId, language, defaults) {
  const existing = await db
    .from('profiles')
    .select('*')
    .eq('user_id', learnerId)
    .eq('target_language', language)
    .maybeSingle();
  if (existing.error) throw new Error('Supabase: ' + existing.error.message);
  if (existing.data) return existing.data;

  const ins = await db
    .from('profiles')
    .insert({
      user_id: learnerId,
      target_language: language,
      current_cefr: (defaults && defaults.current_cefr) || 'B1',
      vocab_injection_mode: (defaults && defaults.vocab_injection_mode) || 'adapt_naturally'
    })
    .select()
    .single();
  if (ins.error) throw new Error('Supabase: ' + ins.error.message);
  return ins.data;
}


// Learner profiles are separate people using the same install: each one owns
// its own languages, vocabulary, history and stats. The database caps these at
// five with a trigger, so the UI limit is a courtesy, not the enforcement.
async function fetchLearners(db) {
  const res = await db.from('learners').select('*').order('created_at', { ascending: true });
  if (res.error) throw new Error('Supabase: ' + res.error.message);
  return res.data || [];
}

async function ensureLearner(db) {
  const rows = await fetchLearners(db);
  if (rows.length) return rows;

  const ins = await db
    .from('learners')
    .insert({ id: DEFAULT_USER, name: 'Me', emoji: PROFILE_EMOJI[0] })
    .select()
    .single();
  if (ins.error) throw new Error('Supabase: ' + ins.error.message);
  return [ins.data];
}

function newLearnerId() {
  const rand = (window.crypto && window.crypto.randomUUID)
    ? window.crypto.randomUUID()
    : String(Date.now()) + Math.random().toString(16).slice(2);
  return 'learner_' + rand;
}

function missingIslandTables(error) {
  const msg = (error && error.message ? error.message : String(error || '')).toLowerCase();
  return (msg.indexOf('islands') !== -1 || msg.indexOf('island_stages') !== -1) &&
    (msg.indexOf('does not exist') !== -1 || msg.indexOf('schema cache') !== -1);
}

function missingSrsTables(error) {
  const msg = (error && error.message ? error.message : String(error || '')).toLowerCase();
  return (msg.indexOf('vocab_sets') !== -1 || msg.indexOf('srs_reviews') !== -1 || msg.indexOf('srs_revlog') !== -1) &&
    (msg.indexOf('does not exist') !== -1 || msg.indexOf('schema cache') !== -1);
}

function missingLearnersTable(error) {
  const msg = (error && error.message ? error.message : String(error || '')).toLowerCase();
  return msg.indexOf('learners') !== -1 &&
    (msg.indexOf('does not exist') !== -1 || msg.indexOf('schema cache') !== -1);
}

/* -------------------------------------------------------------- OpenAI calls */

async function openaiError(res) {
  let detail = '';
  try {
    const body = await res.json();
    detail = (body && body.error && body.error.message) ? body.error.message : JSON.stringify(body);
  } catch (e) {
    try { detail = await res.text(); } catch (e2) { detail = ''; }
  }
  return new Error('OpenAI ' + res.status + ': ' + (detail || res.statusText));
}

async function transcribeAudio(apiKey, blob, language) {
  const ext = extensionForMime(blob.type);
  const form = new FormData();
  form.append('file', blob, 'speech.' + ext);
  form.append('model', 'whisper-1');
  form.append('language', langCode(language));
  form.append('temperature', '0');

  const res = await fetch('https://api.openai.com/v1/audio/transcriptions', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + apiKey },
    body: form
  });
  if (!res.ok) throw await openaiError(res);
  const data = await res.json();
  return (data.text || '').trim();
}

async function chatCompletion(apiKey, messages, options) {
  const opts = options || {};
  const payload = {
    model: 'gpt-4o',
    messages: messages,
    temperature: typeof opts.temperature === 'number' ? opts.temperature : 0.8
  };
  if (opts.maxTokens) payload.max_tokens = opts.maxTokens;
  if (opts.json) payload.response_format = { type: 'json_object' };

  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + apiKey,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw await openaiError(res);
  const data = await res.json();
  const choice = data.choices && data.choices[0];
  return (choice && choice.message && choice.message.content ? choice.message.content : '').trim();
}

async function synthesizeSpeech(apiKey, text, voice) {
  const res = await fetch('https://api.openai.com/v1/audio/speech', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + apiKey,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      model: 'tts-1',
      voice: voice || 'alloy',
      input: text,
      response_format: 'mp3'
    })
  });
  if (!res.ok) throw await openaiError(res);
  return await res.blob();
}

async function verifyOpenAIKey(apiKey) {
  const res = await fetch('https://api.openai.com/v1/models', {
    headers: { 'Authorization': 'Bearer ' + apiKey }
  });
  if (!res.ok) throw await openaiError(res);
  return true;
}

/* --------------------------------------------------------- realtime engine */

// Realtime runs over WebRTC: the browser sends the mic track straight to OpenAI
// and plays the model's audio back through an <audio> element, so there is no
// record -> upload -> synthesize round trip. Turn taking is done server side by
// voice activity detection, which also handles barge-in.
function buildRealtimeSession(profile, topic, vocab, voice, stage) {
  const base = buildSystemPrompt(profile, topic, vocab, stage);
  const realtimeRules = [
    '',
    'THIS IS A LIVE SPOKEN CALL:',
    '- Speak at a natural, unhurried pace for a CEFR ' + profile.current_cefr + ' listener.',
    '- Keep every turn to one or two sentences, then stop and let the learner speak.',
    '- Never talk over the learner. If they start speaking, stop immediately and listen.',
    '- Tolerate pauses. If the learner goes quiet for a while, ask a simpler version of your question.',
    '- If you cannot make out what they said, ask them to repeat it in ' + profile.target_language + '.'
  ].join('\n');

  return {
    type: 'realtime',
    model: REALTIME_MODEL,
    instructions: base + '\n' + realtimeRules,
    output_modalities: ['audio'],
    audio: {
      input: {
        transcription: { model: 'whisper-1', language: langCode(profile.target_language) },
        noise_reduction: { type: 'near_field' },
        turn_detection: {
          type: 'server_vad',
          threshold: 0.5,
          prefix_padding_ms: 300,
          silence_duration_ms: 700,
          create_response: true,
          interrupt_response: true
        }
      },
      output: {
        voice: REALTIME_VOICES.indexOf(voice) === -1 ? 'alloy' : voice
      }
    }
  };
}

// Ephemeral client secrets are the documented way to authenticate a browser.
// If the endpoint is unavailable we fall back to the API key that is already in
// this browser anyway, so the feature still works on older accounts.
async function createRealtimeSecret(apiKey, sessionConfig) {
  const res = await fetch('https://api.openai.com/v1/realtime/client_secrets', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + apiKey,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      expires_after: { anchor: 'created_at', seconds: 600 },
      session: sessionConfig
    })
  });
  if (!res.ok) throw await openaiError(res);
  const data = await res.json();
  if (data.value) return data.value;
  if (data.client_secret && data.client_secret.value) return data.client_secret.value;
  return '';
}

async function connectRealtime(apiKey, sessionConfig, handlers) {
  let secret = '';
  let usedRawKey = false;
  try {
    secret = await createRealtimeSecret(apiKey, sessionConfig);
  } catch (err) {
    console.warn('Ephemeral client secret unavailable, falling back to the API key:', err);
  }
  if (!secret) {
    secret = apiKey;
    usedRawKey = true;
  }

  const pc = new RTCPeerConnection();
  const audioEl = document.createElement('audio');
  audioEl.autoplay = true;
  audioEl.setAttribute('playsinline', '');
  audioEl.style.display = 'none';
  document.body.appendChild(audioEl);

  let micStream = null;

  function teardown() {
    try { if (micStream) micStream.getTracks().forEach(t => t.stop()); } catch (e) { /* noop */ }
    try { pc.close(); } catch (e) { /* noop */ }
    try {
      audioEl.srcObject = null;
      if (audioEl.parentNode) audioEl.parentNode.removeChild(audioEl);
    } catch (e) { /* noop */ }
  }

  try {
    pc.ontrack = (e) => { audioEl.srcObject = e.streams[0]; };

    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    micStream.getTracks().forEach(t => pc.addTrack(t, micStream));

    const dc = pc.createDataChannel('oai-events');
    dc.addEventListener('open', () => handlers.onOpen(dc));
    dc.addEventListener('message', (e) => {
      let parsed = null;
      try { parsed = JSON.parse(e.data); } catch (err) { return; }
      handlers.onEvent(parsed);
    });

    pc.addEventListener('connectionstatechange', () => handlers.onConnectionState(pc.connectionState));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const url = 'https://api.openai.com/v1/realtime/calls' +
      (usedRawKey ? '?model=' + encodeURIComponent(sessionConfig.model) : '');

    const res = await fetch(url, {
      method: 'POST',
      body: offer.sdp,
      headers: {
        'Authorization': 'Bearer ' + secret,
        'Content-Type': 'application/sdp'
      }
    });
    if (!res.ok) throw await openaiError(res);

    const answerSdp = await res.text();
    await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });

    return {
      pc: pc,
      micStream: micStream,
      audioEl: audioEl,
      close: teardown
    };
  } catch (err) {
    teardown();
    throw err;
  }
}

/* ----------------------------------------------------------- language islands */

// A language island is a domain the learner wants to own outright — their job,
// their city, the argument they keep having. The learner picks the island; the
// model designs the roadmap that builds it, stage by stage.
const ISLAND_STAGES_TARGET = 10;

const ISLAND_SEEDS = [
  'My work and what I actually do all day',
  'Where I am from and what the place is like',
  'My family and the people close to me',
  'The thing I do at weekends',
  'Getting through everyday errands and admin',
  'My opinions on something I care about'
];

async function generateIslandRoadmap(apiKey, profile, islandName, aboutYou, weakSpots) {
  const weakness = (weakSpots && weakSpots.length)
    ? 'Recent recorded weaknesses to design around:\n' + weakSpots.map(w => '- ' + w).join('\n')
    : 'No recorded weaknesses yet: assume the level is exactly CEFR ' + profile.current_cefr + '.';

  const about = (aboutYou && aboutYou.trim())
    ? 'What the learner told you about themselves:\n"""\n' + aboutYou.trim() + '\n"""'
    : 'The learner gave no personal detail, so keep the island widely usable but still concrete.';

  const raw = await chatCompletion(apiKey, [
    {
      role: 'system',
      content: 'You design speaking curricula built on Boris Shekhtman\'s "language islands": prepared, ' +
        'rehearsed blocks of speech a learner can deliver fluently on the subjects that keep coming up in their ' +
        'own life. You always reply with a single valid JSON object and nothing else.'
    },
    {
      role: 'user',
      content: [
        'Target language: ' + profile.target_language,
        'Learner level: CEFR ' + profile.current_cefr,
        'The island the learner chose to own: "' + islandName + '"',
        '',
        about,
        '',
        weakness,
        '',
        'Design a roadmap of EXACTLY ' + ISLAND_STAGES_TARGET + ' stages that takes this learner from wherever ' +
          'they are now to being able to hold this island fluently, without hesitation, in real conversation.',
        '',
        'What makes this a roadmap rather than a list of topics:',
        '- Order the stages so difficulty climbs steadily and each one is speakable at CEFR ' + profile.current_cefr + '.',
        '- Every stage after the first must reuse phrases from earlier stages: name those positions in ' +
          '"recycles_from". Recycling is what makes the island stick, so be deliberate about it.',
        '- Early stages are the load-bearing ones the learner will use in every single conversation. Later stages ' +
          'handle the harder, less predictable turns: disagreeing, telling a story with a point, handling a ' +
          'question they did not expect.',
        '- Ground every stage in the learner\'s actual life as described above. Specific beats generic: ' +
          '"explaining a deployment that went wrong" beats "talking about problems at work".',
        '',
        'Return ONLY a JSON object of this exact shape:',
        '{',
        '  "goal": "one sentence, in English, on what owning this island will let the learner do",',
        '  "stages": [',
        '    {',
        '      "position": 1,',
        '      "title": "short name for the stage, in English",',
        '      "objective": "the concrete thing they must be able to say, in English, one sentence",',
        '      "scenario": "the situation to practise it in, in English, one sentence",',
        '      "structures": ["grammar or patterns to lean on, in English, 1-3 items"],',
        '      "phrases": [',
        '        { "phrase": "the chunk in ' + profile.target_language + '", "translation": "English", "note": "when to reach for it" }',
        '      ],',
        '      "done_when": "an observable test the learner passes, in English, one sentence",',
        '      "recycles_from": [1, 2]',
        '    }',
        '  ]',
        '}',
        '',
        'Rules:',
        '- EXACTLY ' + ISLAND_STAGES_TARGET + ' stages, positions 1 to ' + ISLAND_STAGES_TARGET + ' in order.',
        '- 4 to 6 phrases per stage. Phrases are multi-word chunks a native would actually say, never single words.',
        '- "recycles_from" is an array of earlier positions, empty only for position 1.',
        '- "done_when" must be observable from a spoken conversation, not a feeling.',
        '- Output raw JSON only, no markdown fences, no commentary.'
      ].join('\n')
    }
  ], { json: true, temperature: 0.7, maxTokens: 4000 });

  const cleaned = raw.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  const parsed = JSON.parse(cleaned);
  if (!Array.isArray(parsed.stages) || !parsed.stages.length) {
    throw new Error('The model returned no stages.');
  }

  const stages = parsed.stages
    .slice(0, ISLAND_STAGES_TARGET)
    .map((st, i) => ({
      position: i + 1,
      title: String(st.title || ('Stage ' + (i + 1))).trim(),
      objective: String(st.objective || '').trim(),
      scenario: String(st.scenario || '').trim(),
      structures: Array.isArray(st.structures) ? st.structures.map(String) : [],
      phrases: (Array.isArray(st.phrases) ? st.phrases : [])
        .filter(p => p && p.phrase)
        .map(p => ({
          phrase: String(p.phrase).trim(),
          translation: p.translation ? String(p.translation).trim() : '',
          note: p.note ? String(p.note).trim() : ''
        })),
      done_when: String(st.done_when || '').trim(),
      recycles_from: Array.isArray(st.recycles_from)
        ? st.recycles_from.map(n => parseInt(n, 10)).filter(n => Number.isInteger(n) && n >= 1 && n <= i)
        : []
    }));

  return { goal: String(parsed.goal || '').trim(), stages: stages };
}

// Suggest islands worth owning, given who the learner is.
async function suggestIslands(apiKey, profile, aboutYou) {
  const raw = await chatCompletion(apiKey, [

        'Target language: ' + profile.target_language + '. Level: CEFR ' + profile.current_cefr + '.',
        aboutYou && aboutYou.trim()
          ? 'About the learner:\n"""\n' + aboutYou.trim() + '\n"""'
          : 'The learner has told you nothing about themselves yet.',
        '',
        'Propose 4 islands: subjects this learner will genuinely have to speak about again and again, ' +
          'worth rehearsing until they are automatic. Ground them in the learner\'s real life where you know it.',
        '',
        'Return ONLY: { "islands": [ { "name": "short island name", "why": "one sentence on why it earns the effort" } ] }',
        'Output raw JSON only, no fences.'
      ].join('\n')
    }
  ], { json: true, temperature: 0.8, maxTokens: 800 });

  const cleaned = raw.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();

  return (Array.isArray(parsed.islands) ? parsed.islands : [])
    .filter(i => i && i.name)
    .map(i => ({ name: String(i.name).trim(), why: i.why ? String(i.why).trim() : '' }));

// A stage is only finished when the analysis says the objective was met AND
// every phrase it introduced has been genuinely used in conversation.
function stageGate(stage, vocabRows) {
  const phrases = Array.isArray(stage.phrases) ? stage.phrases : [];
  const byPhrase = new Map();
  (vocabRows || []).forEach(v => byPhrase.set(normalizeText(v.phrase), v));

  let mastered = 0;
  const outstanding = [];
  phrases.forEach(p => {
    const row = byPhrase.get(normalizeText(p.phrase));
    if (row && row.status === 'mastered') mastered += 1;
    else outstanding.push({
      phrase: p.phrase,
      uses: row ? (row.times_reviewed || 0) : 0
    });
  });

  const vocabDone = phrases.length > 0 && mastered === phrases.length;
  return {
    total: phrases.length,
    mastered: mastered,
    outstanding: outstanding,
    vocabDone: vocabDone,
    aiDone: !!stage.ai_verdict,
    complete: vocabDone && !!stage.ai_verdict
  };
}

/* -------------------------------------------------------------- daily stats */

// Local calendar days, not UTC: a session at 23:30 belongs to that evening.
function dayKey(value) {
  const d = value instanceof Date ? value : new Date(value);
  if (isNaN(d.getTime())) return '';
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function addDays(date, delta) {
  const d = new Date(date.getTime());
  d.setDate(d.getDate() + delta);
  return d;
}

function computeStreak(daysWithActivity, today) {
  // Today not being practised yet does not break a streak that ran to yesterday.
  let cursor = daysWithActivity.has(dayKey(today)) ? new Date(today) : addDays(today, -1);
  let current = 0;
  while (daysWithActivity.has(dayKey(cursor))) {
    current += 1;
    cursor = addDays(cursor, -1);
  }

  let best = 0;
  let run = 0;
  const sorted = Array.from(daysWithActivity).sort();
  let previous = null;
  sorted.forEach(key => {
    if (previous) {
      const gap = Math.round((new Date(key + 'T00:00:00') - new Date(previous + 'T00:00:00')) / 86400000);
      run = gap === 1 ? run + 1 : 1;
    } else {
      run = 1;
    }
    if (run > best) best = run;
    previous = key;
  });

  return { current: current, best: Math.max(best, current) };
}

function buildDailyStats(conversations, vocabulary, windowDays) {
  const today = new Date();
  const days = windowDays || 14;

  const byDay = new Map();
  const activeDays = new Set();

  (conversations || []).forEach(c => {
    const key = dayKey(c.created_at);
    if (!key) return;
    const entry = byDay.get(key) || { sessions: 0, seconds: 0, mastered: 0, added: 0 };
    entry.sessions += 1;
    entry.seconds += c.duration_seconds || 0;
    byDay.set(key, entry);
    activeDays.add(key);
  });

  (vocabulary || []).forEach(v => {
    const addedKey = dayKey(v.created_at);
    if (addedKey) {
      const entry = byDay.get(addedKey) || { sessions: 0, seconds: 0, mastered: 0, added: 0 };
      entry.added += 1;
      byDay.set(addedKey, entry);
    }
    if (v.status === 'mastered' && v.mastered_at) {
      const masteredKey = dayKey(v.mastered_at);
      if (masteredKey) {
        const entry = byDay.get(masteredKey) || { sessions: 0, seconds: 0, mastered: 0, added: 0 };
        entry.mastered += 1;
        byDay.set(masteredKey, entry);
      }
    }
  });

  const series = [];
  for (let i = days - 1; i >= 0; i--) {
    const date = addDays(today, -i);
    const key = dayKey(date);
    const entry = byDay.get(key) || { sessions: 0, seconds: 0, mastered: 0, added: 0 };
    series.push({
      key: key,
      date: date,
      label: date.toLocaleDateString(undefined, { weekday: 'narrow' }),
      minutes: Math.round(entry.seconds / 60),
      sessions: entry.sessions,
      mastered: entry.mastered,
      added: entry.added
    });
  }

  const todayEntry = byDay.get(dayKey(today)) || { sessions: 0, seconds: 0, mastered: 0, added: 0 };
  const totalSeconds = (conversations || []).reduce((sum, c) => sum + (c.duration_seconds || 0), 0);
  const streak = computeStreak(activeDays, today);

  const weekSeconds = series.slice(-7).reduce((sum, d) => sum + d.minutes * 60, 0);

  return {
    today: {
      sessions: todayEntry.sessions,
      minutes: Math.round(todayEntry.seconds / 60),
      mastered: todayEntry.mastered,
      added: todayEntry.added
    },
    streak: streak,
    series: series,
    totals: {
      sessions: (conversations || []).length,
      minutes: Math.round(totalSeconds / 60),
      learning: (vocabulary || []).filter(v => v.status === 'learning').length,
      mastered: (vocabulary || []).filter(v => v.status === 'mastered').length,
      weekMinutes: Math.round(weekSeconds / 60),
      activeDays: activeDays.size
    }
  };
}

/* ------------------------------------------------------- phrase suggestions */

// The analysis engine only ever proposes phrases reactively, from mistakes the
// learner already made. This fills the other half: high-frequency chunks worth
// starting to use, generated for the level rather than for a past session.
async function suggestStarterPhrases(apiKey, profile, theme, existingPhrases) {
  const avoid = (existingPhrases || []).slice(0, 120);
  const avoidBlock = avoid.length
    ? 'The learner already has these phrases, so do NOT suggest them or close variants:\n' +
      avoid.map(p => '- ' + p).join('\n')
    : 'The learner has no saved phrases yet, so cover the essentials first.';

  const themeLine = theme && theme.trim()
    ? 'Focus the whole set on this theme or situation: ' + theme.trim() + '.'
    : 'Cover a spread of everyday situations rather than one narrow theme.';

  const raw = await chatCompletion(apiKey, [
    {
      role: 'system',
      content: 'You are an experienced ' + profile.target_language + ' teacher who builds vocabulary lists from ' +
        'corpus frequency and real spoken usage. You always reply with a single valid JSON object and nothing else.'
    },
    {
      role: 'user',
      content: [
        'Propose 10 ' + profile.target_language + ' phrases a CEFR ' + profile.current_cefr +
          ' learner should start actively using in conversation.',
        '',
        themeLine,
        '',
        avoidBlock,
        '',
        'What to propose:',
        '- Multi-word chunks only: collocations, fixed expressions, sentence starters, connectors, ' +
          'hedges, reactions and polite formulas. Never isolated single words.',
        '- Things a native actually says often, not textbook curiosities.',
        '- Pitched at CEFR ' + profile.current_cefr + ': comfortably sayable at that level but a step above ' +
          'what the learner probably reaches for by default.',
        '- Give each phrase in its natural citation form, the form the learner should memorise.',
        '',
        'Return ONLY a JSON object of this exact shape:',
        '{',
        '  "phrases": [',
        '    { "phrase": "string", "translation": "string", "context": "string", "category": "string" }',
        '  ]',
        '}',
        '',
        'Field rules:',
        '- "phrase" is in ' + profile.target_language + '.',
        '- "translation" is a short, natural English equivalent.',
        '- "context" is one short English sentence saying when to reach for it.',
        '- "category" is one or two words, such as "opinion", "connector", "small talk", "polite request", "reaction".',
        '- Output raw JSON only, with no markdown fences and no commentary.'
      ].join('\n')
    }
  ], { json: true, temperature: 0.7, maxTokens: 1600 });

  const cleaned = raw.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  const parsed = JSON.parse(cleaned);
  const rows = Array.isArray(parsed.phrases) ? parsed.phrases : [];

  const seen = new Set((existingPhrases || []).map(normalizeText));
  const out = [];
  rows.forEach(r => {
    if (!r || !r.phrase) return;
    const phrase = String(r.phrase).trim();
    const key = normalizeText(phrase);
    if (!key || seen.has(key)) return;
    seen.add(key);
    out.push({
      phrase: phrase,
      translation: r.translation ? String(r.translation).trim() : '',
      context: r.context ? String(r.context).trim() : '',
      category: r.category ? String(r.category).trim() : '',
      source: 'suggested'
    });
  });
  return out;
}

// The schema has no Turkish column, so Turkish is produced on demand at export
// time and cached in memory for the rest of the session.
async function translateToTurkish(apiKey, items, sourceLanguage) {
  if (!items.length) return [];

  const list = items.map((it, i) => {
    const en = it.translation ? '  [known English meaning: ' + it.translation + ']' : '';
    return (i + 1) + '. ' + it.phrase + en;
  }).join('\n');

  const raw = await chatCompletion(apiKey, [
    {
      role: 'system',
      content: 'You are a professional ' + sourceLanguage + '-to-Turkish translator. ' +
        'You always reply with a single valid JSON object and nothing else.'
    },
    {
      role: 'user',
      content: [
        'Translate each of the following ' + sourceLanguage + ' phrases into natural Turkish.',
        '',
        list,
        '',
        'Return ONLY a JSON object of this exact shape:',
        '{ "translations": [ { "index": 1, "turkish": "string" } ] }',
        '',
        'Rules:',
        '- Include one entry for EVERY index from 1 to ' + items.length + ', in order.',
        '- "turkish" is the Turkish rendering a native speaker would actually say, not a word-for-word gloss.',
        '- For idioms and fixed expressions, give the equivalent Turkish idiom rather than a literal translation.',
        '- Keep each translation as short as the original. No explanations, no notes, no alternatives in brackets.',
        '- Output raw JSON only, with no markdown fences and no commentary.'
      ].join('\n')
    }
  ], { json: true, temperature: 0.2, maxTokens: 2000 });

  const cleaned = raw.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  const parsed = JSON.parse(cleaned);
  const rows = Array.isArray(parsed.translations) ? parsed.translations : [];

  const byIndex = new Map();
  rows.forEach(r => {
    const n = Number(r && r.index);
    if (Number.isInteger(n) && n >= 1 && n <= items.length) {
      byIndex.set(n, String(r.turkish == null ? '' : r.turkish).trim());
    }
  });

  return items.map((it, i) => byIndex.get(i + 1) || '');
}

function csvCell(value) {
  const text = value == null ? '' : String(value);
  return '"' + text.replace(/"/g, '""') + '"';
}

function buildVocabCsv(rows, sourceLanguage, withTurkish) {
  const header = [sourceLanguage + ' phrase', 'English', 'Turkish', 'Context', 'Times reviewed', 'Target reviews', 'Status', 'Added']
    .filter((h, i) => withTurkish || i !== 2);

  const lines = [header.map(csvCell).join(',')];

  rows.forEach(r => {
    const cells = [
      r.phrase,
      r.translation || '',
      r.turkish || '',
      r.correction_context || '',
      r.times_reviewed || 0,
      MASTERY_THRESHOLD,
      r.status || 'learning',
      r.created_at ? String(r.created_at).slice(0, 10) : ''
    ].filter((c, i) => withTurkish || i !== 2);
    lines.push(cells.map(csvCell).join(','));
  });

  // The BOM keeps Turkish and German characters intact when Excel opens the file.
  return '﻿' + lines.join('\r\n') + '\r\n';
}

function buildVocabText(rows, sourceLanguage, withTurkish) {
  const stamp = new Date().toISOString().slice(0, 10);
  const title = 'Active vocabulary — ' + sourceLanguage + (withTurkish ? ' → Turkish' : '');
  const out = [
    title,
    'Exported ' + stamp + ' · ' + rows.length + ' phrase' + (rows.length === 1 ? '' : 's'),
    '='.repeat(Math.max(title.length, 32)),
    ''
  ];

  rows.forEach((r, i) => {
    out.push((i + 1) + '. ' + r.phrase);
    if (withTurkish) out.push('   TR: ' + (r.turkish || '—'));
    if (r.translation) out.push('   EN: ' + r.translation);
    if (r.correction_context) out.push('   Context: ' + r.correction_context);
    out.push('   Progress: ' + (r.times_reviewed || 0) + '/' + MASTERY_THRESHOLD + ' uses · ' + (r.status || 'learning'));
    out.push('');
  });

  return out.join('\n');
}

function downloadFile(filename, mimeType, content) {
  const blob = new Blob([content], { type: mimeType + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ------------------------------------------------------------ prompt builders */

function buildSystemPrompt(profile, topic, vocab, stage) {
  const lang = profile.target_language;
  const level = profile.current_cefr;
  const forceVerbatim = profile.vocab_injection_mode === 'force_verbatim';

  const vocabLines = vocab.map(v => {
    const tr = v.translation ? ' — means: ' + v.translation : '';
    const ctx = v.correction_context ? ' — context: ' + v.correction_context : '';
    return '- "' + v.phrase + '"' + tr + ctx;
  }).join('\n');

  const injectionRule = forceVerbatim
    ? 'FORCE VERBATIM MODE: you must use each target phrase EXACTLY as written, character for character, ' +
      'with no change to word order, conjugation, article, or case. Build your sentences around the phrase so ' +
      'the verbatim form still fits. Use at most one target phrase per turn, and prefer phrases you have not used yet.'
    : 'ADAPT NATURALLY MODE: weave the target phrases into your turns so they sound native. You may conjugate, ' +
      'decline, change tense, adjust articles and word order so the phrase fits the sentence. Use at most one ' +
      'target phrase per turn, and prefer phrases you have not used yet.';

  const vocabBlock = vocab.length
    ? 'ACTIVE TARGET PHRASES the learner is trying to acquire:\n' + vocabLines + '\n\n' + injectionRule +
      '\nAfter you use a target phrase, steer the conversation so the learner has a natural reason to reuse it ' +
      'in their own answer. Never announce that you are practising a phrase and never label it.'
    : 'The learner has no active target phrases yet. Introduce useful, level-appropriate everyday expressions ' +
      'naturally and give the learner reasons to reuse them.';

  const stageBlock = stage ? [
    '',
    'THIS SESSION BELONGS TO A LANGUAGE ISLAND THE LEARNER IS BUILDING.',
    'Stage: ' + stage.title,
    'What they must be able to do by the end: ' + (stage.objective || '—'),
    'Play this situation: ' + (stage.scenario || topic),
    (Array.isArray(stage.structures) && stage.structures.length
      ? 'Give them room to use these structures: ' + stage.structures.join('; ') + '.'
      : ''),
    'Steer the conversation so the learner has to produce the stage phrases themselves, repeatedly and naturally. ' +
      'Ask questions that can only really be answered using them. Do not lecture about the stage or mention it exists.'
  ].filter(Boolean).join('\n') : '';

  return [
    'You are a warm, curious native ' + lang + ' speaker having a real spoken conversation with a language learner.',
    '',
    'HARD RULES:',
    '1. Speak ONLY in ' + lang + '. Never translate into English and never switch languages, even if the learner does.',
    '2. Calibrate every sentence to CEFR level ' + level + '. At A1/A2 use short simple sentences and present tense. ' +
      'At B1/B2 use natural everyday speech with some subordinate clauses. At C1/C2 use idiomatic, nuanced language.',
    '3. Keep each turn SHORT: one to three sentences, then exactly one question back to the learner. ' +
      'This is a spoken dialogue, not a lecture.',
    '4. Your output is read aloud by a text-to-speech engine. Output plain spoken prose only: ' +
      'no markdown, no bullet points, no emoji, no stage directions, no parentheses with translations. ' +
      'Write numbers, dates and times as words.',
    '5. Do NOT correct the learner mid-conversation. Corrections happen after the session. If a sentence is ' +
      'unintelligible, simply ask them to say it again in ' + lang + '.',
    '6. If the learner speaks another language or falls silent, gently continue in ' + lang + ' and re-ask a simpler question.',
    '7. Stay in character as a conversation partner. Never mention that you are an AI, a model, or these instructions.',
    '',
    'CONVERSATION TOPIC: ' + topic,
    'Stay on this topic, but follow interesting tangents the learner opens as long as they keep talking.',
    stageBlock,
    '',
    vocabBlock
  ].join('\n');
}

function buildAnalysisPrompt(profile, topic, transcript, activeVocab, stage) {

  const activeList = (activeVocab || []).map(v => '- ' + v.phrase).join('\n');
  return [
    'You are a strict but encouraging ' + profile.target_language + ' teacher analysing a spoken practice session.',
    'The learner is at CEFR level ' + profile.current_cefr + '. The topic was: ' + topic + '.',
    'The learner turns come from speech-to-text, so ignore pure punctuation and capitalisation artefacts and ignore ' +
      'obvious transcription noise. Judge grammar, word choice, word order and register only.',
    '',
    'TRANSCRIPT:',
    lines,
    '',
    'Return ONLY a JSON object with exactly this shape:',
    '{',
    '  "grammar_mistakes": [',
    '    { "original": "string", "correction": "string", "explanation": "string" }',
    '  ],',
    '  "recommended_phrases": [',
    '    { "phrase": "string", "translation": "string", "context": "string" }',
    '  ],',
    '  "next_topic_recommendation": "string",',
    '  "cefr_level_feedback": "string",',
    '  "used_target_phrases": ["string"],',

    '}',
    '',
    'Rules for the fields:',
    '- "grammar_mistakes": up to 8 real mistakes the LEARNER made. "original" is their exact wording, ' +
      '"correction" is the fixed ' + profile.target_language + ' sentence, "explanation" is one short sentence in English ' +
      'saying WHY. If the learner made no real mistakes, return an empty array.',
    '- "recommended_phrases": 3 to 6 NEW ' + profile.target_language + ' phrases that would have made this exact ' +
      'conversation smoother, appropriate for CEFR ' + profile.current_cefr + '. "phrase" is in ' + profile.target_language +
      ', "translation" is English, "context" is one short English sentence on when to use it.',
    '- "next_topic_recommendation": one concrete conversation topic for the next session that will force the learner ' +
      'to reuse those phrases and re-attempt the structures they got wrong. One sentence, in English.',
    '- "cefr_level_feedback": two to four sentences in English on their current level, what went well, and the single ' +
      'highest-value thing to fix next.',
    activeList
      ? '- "used_target_phrases": the learner is currently practising these target phrases:\n' + activeList + '\n' +
        '"used_target_phrases" must list, copied EXACTLY as written above, only those target phrases the LEARNER ' +
        'actually produced in their own turns. Count a phrase as used even if they conjugated it, declined it, ' +
        'split it, changed its tense, or made a small error in it. Do not count phrases only the PARTNER said. ' +
        'Do not invent phrases that are not in the list. If none were used, return an empty array.'
      : '- "used_target_phrases": return an empty array, the learner has no active target phrases.',
    stage
      ? '- "stage_goal_met" and "stage_evidence": this session was part of a language island. The stage objective ' +
        'was: "' + (stage.objective || stage.title) + '". It counts as met when: "' + (stage.done_when || 'the learner ' +
        'achieved the objective unaided') + '". Judge STRICTLY from the transcript, on what the LEARNER produced, not ' +
        'on what the partner said. Set "stage_goal_met" true only if the transcript really shows it, and quote the ' +
        'learner\'s own words in "stage_evidence" (one sentence). If it was not met, say what is still missing.'
      : '- "stage_goal_met": false, and "stage_evidence": "" — this session was not part of an island.',
    'Output raw JSON only, with no markdown fences and no commentary.'
  ].join('\n');
}

/* ============================================================================
   SPACED REPETITION — ported from Wordstack, driven by saved vocabulary.

   Each saved phrase is forged into a card set: six natural example sentences
   plus one mp3 per sentence. That set yields 13 cards — 1 reading, 6 listening,
   6 speaking-cloze — scheduled with the same SM-2 variant Wordstack uses.
   ========================================================================== */

const SRS_DECKS = ['reading', 'listening', 'speaking'];
const LEARN_STEPS_MIN = [1, 10];
const RELEARN_STEPS_MIN = [10];
const LEARN_AHEAD_MIN = 20;
const DEFAULT_NEW_PER_DAY = 20;
const SENTENCES_PER_SET = 6;

const CARD_ACCENTS = {
  reading:   ['#2B59C3', '#7C3AED'],
  listening: ['#0EA5A4', '#2B59C3'],
  speaking:  ['#E8590C', '#F5C400']
};

/* ---------- text helpers (verbatim behaviour from the original) ---------- */

const esc = v => String(v == null ? '' : v)
  .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
  .replaceAll('"', '&quot;').replaceAll("'", '&#39;');

const stripField = v => String(v == null ? '' : v).replace(/\t/g, ' ').replace(/\r?\n/g, '<br>');
const rescape = v => v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

const splitPhrase = w => String(w == null ? '' : w)
  .split(/\s*(?:\.{2,}|…)\s*/)
  .map(t => t.trim())
  .filter(Boolean);

function findParts(safe, parts) {
  const ranges = [];
  let from = 0;
  for (const part of parts) {
    const pat = new RegExp(rescape(esc(part)), 'ig');
    pat.lastIndex = from;
    const m = pat.exec(safe);
    if (!m) return null;
    ranges.push([m.index, m.index + m[0].length]);
    from = m.index + m[0].length;
  }
  return ranges;
}

function wrapRanges(safe, ranges, wrapFn) {
  let out = '';
  let prev = 0;
  ranges.forEach(r => {
    out += safe.slice(prev, r[0]) + wrapFn(safe.slice(r[0], r[1]));
    prev = r[1];
  });
  return out + safe.slice(prev);
}

const CARD_FONT = "-apple-system,'Segoe UI',Roboto,'Noto Sans','Helvetica Neue',sans-serif";
const HL_B = inner =>
  '<b style="font-weight:700;color:#1E2A38;background:#FFE45C;padding:0 .18em;border-radius:4px;">' + inner + '</b>';
const NATIVE_SPAN = t => '<span style="color: #666666; font-size: 0.9em;">' + t + '</span>';
const AUDIO_TAG = b64 => b64
  ? '<audio controls preload="none" style="width:100%;max-width:420px;" src="data:audio/mp3;base64,' + b64 + '"></audio>'
  : '<div style="font-size:.85em;color:#8A94A6;border:1px dashed #C9D2DD;border-radius:8px;padding:8px 12px;">Audio is still loading for this card.</div>';

function boldify(sentence, form, baseWord) {
  const safe = esc(sentence);
  const needles = [form, baseWord];
  for (const needle of needles) {
    const parts = splitPhrase(needle);
    if (!parts.length) continue;
    if (parts.length === 1) {
      const pattern = new RegExp(rescape(esc(parts[0])), 'gi');
      if (pattern.test(safe)) return safe.replace(pattern, m => HL_B(m));
    } else {
      const ranges = findParts(safe, parts);
      if (ranges) return wrapRanges(safe, ranges, m => HL_B(m));
    }
  }
  return safe;
}

function clozify(sentence, form, baseWord, hint) {
  const safe = esc(sentence);
  const hintSpan = NATIVE_SPAN(esc(hint));
  const wrap = m => '{{c1::' + HL_B(m) + '::' + hintSpan + '}}';
  for (const needle of [form, baseWord]) {
    const parts = splitPhrase(needle);
    if (!parts.length) continue;
    const ranges = findParts(safe, parts);
    if (ranges) return wrapRanges(safe, ranges, wrap);
  }
  return wrap(safe);
}

function cardShell(inner, accentFrom, accentTo, badge) {
  return '<div style="font-family:' + CARD_FONT + ';max-width:560px;margin:8px auto;text-align:left;background:#FFFFFF;border:1px solid #E3E8F0;border-radius:16px;overflow:hidden;box-shadow:0 6px 18px rgba(20,30,55,.10);">'
    + '<div style="height:6px;background:linear-gradient(90deg,' + accentFrom + ',' + accentTo + ');"></div>'
    + '<div style="padding:16px 20px 18px;">'
    + (badge ? '<div style="font-size:.68em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8A94A6;margin-bottom:10px;">' + badge + '</div>' : '')
    + inner
    + '</div></div>';
}

const numChip = n =>

const sentenceRow = (n, html) =>

const wordChip = (word, translation) =>

  + (translation ? '<div style="margin-top:10px;font-size:1.05em;color:#1E2A38;font-weight:600;">' + translation + '</div>' : '');

/* ---------- SM-2 scheduler ---------- */

function newRev(cardId, setId, deck, idx, learnerId, language) {
  const now = new Date().toISOString();
  return {
    card_id: cardId, user_id: learnerId, target_language: language,
    set_id: setId, deck: deck, idx: idx,
    state: 'new', step: 0, ivl: 0, ef: 2.5, reps: 0, lapses: 0,
    due_at: now, updated_at: now
  };
}

function applyRating(rev, rating, nowMs) {
  const at = nowMs || Date.now();
  const r = Object.assign({}, rev);
  const inMin = m => new Date(at + m * 60000).toISOString();
  const inDay = d => new Date(at + d * 86400000).toISOString();
  const clampEf = e => Math.max(1.3, e);

  if (r.state === 'new') { r.state = 'learning'; r.step = 0; }

  if (r.state === 'learning' || r.state === 'relearning') {
    const steps = r.state === 'learning' ? LEARN_STEPS_MIN : RELEARN_STEPS_MIN;
    const graduate = easy => {
      r.ivl = r.state === 'relearning'
        ? Math.max(1, Math.round(r.ivl * 0.5)) + (easy ? 1 : 0)
        : (easy ? 4 : 1);
      r.state = 'review'; r.step = 0; r.due_at = inDay(r.ivl);
    };
    if (rating === 'again') { r.step = 0; r.due_at = inMin(steps[0]); }
    else if (rating === 'hard') { r.due_at = inMin(Math.max(steps[Math.min(r.step, steps.length - 1)] * 1.5, 5)); }
    else if (rating === 'good') {
      r.step += 1;
      if (r.step >= steps.length) graduate(false);
      else r.due_at = inMin(steps[r.step]);
    } else { graduate(true); }
  } else {
    if (rating === 'again') {
      r.lapses += 1; r.ef = clampEf(r.ef - 0.2);
      r.state = 'relearning'; r.step = 0; r.due_at = inMin(RELEARN_STEPS_MIN[0]);
    } else if (rating === 'hard') {
      r.ivl = Math.max(r.ivl + 1, Math.round(r.ivl * 1.2));
      r.ef = clampEf(r.ef - 0.15); r.due_at = inDay(r.ivl);
    } else if (rating === 'good') {
      r.ivl = Math.max(r.ivl + 1, Math.round(r.ivl * r.ef)); r.due_at = inDay(r.ivl);
    } else {
      r.ivl = Math.max(r.ivl + 2, Math.round(r.ivl * r.ef * 1.3));
      r.ef = clampEf(r.ef + 0.15); r.due_at = inDay(r.ivl);
    }
    r.ivl = Math.min(r.ivl, 36500);
  }
  r.reps += 1;
  r.updated_at = new Date().toISOString();
  return r;
}

function fmtDue(iso) {
  const ms = new Date(iso) - Date.now();
  const min = Math.round(ms / 60000);
  if (min < 60) return Math.max(1, min) + 'm';
  if (min < 60 * 36) return Math.round(min / 60) + 'h';
  const d = Math.round(ms / 86400000);
  if (d < 31) return d + 'd';
  if (d < 365) return (Math.round(d / 30.4 * 10) / 10) + 'mo';
  return (Math.round(d / 365 * 10) / 10) + 'y';
}

/* ---------- queue building ---------- */

function allCards(sets) {
  const out = [];
  (sets || []).forEach(set => {
    if (!set.data || !Array.isArray(set.data.sentences) || !set.data.sentences.length) return;
    const n = set.data.sentences.length;
    out.push({ cardId: set.id + '|reading|0', set: set, deck: 'reading', idx: 0 });
    for (let i = 0; i < n; i++) out.push({ cardId: set.id + '|listening|' + i, set: set, deck: 'listening', idx: i });
    for (let i = 0; i < n; i++) out.push({ cardId: set.id + '|speaking|' + i, set: set, deck: 'speaking', idx: i });
  });
  return out;
}

function dueCounts(sets, reviews, remainingNew) {
  const now = Date.now();
  const endOfDay = new Date(); endOfDay.setHours(23, 59, 59, 999);
  let learn = 0, due = 0, freshTotal = 0;

  allCards(sets).forEach(c => {
    const r = reviews.get(c.cardId);
    if (!r || r.state === 'new') freshTotal += 1;
    else if (r.state === 'learning' || r.state === 'relearning') {
      if (new Date(r.due_at) - now <= LEARN_AHEAD_MIN * 60000) learn += 1;
    } else if (new Date(r.due_at) <= endOfDay) due += 1;
  });

  const fresh = Math.min(freshTotal, Math.max(0, remainingNew));
  return { learn: learn, due: due, fresh: fresh, freshTotal: freshTotal, total: learn + due + fresh };
}

function nextDueAt(sets, reviews) {
  let min = null;
  const now = Date.now();
  allCards(sets).forEach(c => {
    const r = reviews.get(c.cardId);
    if (!r || r.state === 'new') return;
    const t = new Date(r.due_at);
    if (t > now && (!min || t < min)) min = t;
  });
  return min;
}

function buildQueue(sets, reviews, remainingNew, learnerId, language) {
  const now = Date.now();
  const endOfDay = new Date(); endOfDay.setHours(23, 59, 59, 999);
  const learn = [], rev = [], freshAll = [];

  allCards(sets).forEach(c => {
    const r = reviews.get(c.cardId) || null;
    const item = Object.assign({}, c, {
      rev: r || newRev(c.cardId, c.set.id, c.deck, c.idx, learnerId, language)
    });
    if (!r || r.state === 'new') freshAll.push(item);
    else if (r.state === 'learning' || r.state === 'relearning') {
      if (new Date(r.due_at) - now <= LEARN_AHEAD_MIN * 60000) learn.push(item);
    } else if (new Date(r.due_at) <= endOfDay) rev.push(item);
  });

  const byDue = (a, b) => new Date(a.rev.due_at) - new Date(b.rev.due_at);
  learn.sort(byDue);
  rev.sort(byDue);
  freshAll.sort((a, b) => new Date(a.set.created_at || 0) - new Date(b.set.created_at || 0));

  return { learn: learn, rev: rev, fresh: freshAll.slice(0, Math.max(0, remainingNew)), done: 0 };
}

function pickNext(q) {
  const now = Date.now();
  const learnIdx = q.learn.findIndex(c => new Date(c.rev.due_at) <= now);
  if (learnIdx >= 0) return q.learn.splice(learnIdx, 1)[0];
  if (q.rev.length) return q.rev.shift();
  if (q.fresh.length) return q.fresh.shift();
  if (q.learn.length) return q.learn.shift();
  return null;
}

/* ---------- forging a phrase into a card set ---------- */

async function generateSentences(apiKey, phrase, nativeLang, targetLang) {
  const sys = 'You generate language-learning example sentences. Respond with a single valid JSON object and nothing else. No markdown fences.';
  const user = [
    'Target language: ' + targetLang,
    'Native language: ' + nativeLang,
    'Target word or phrase: "' + phrase + '"',
    '',
    'Create EXACTLY ' + SENTENCES_PER_SET + ' sentences in ' + targetLang + ', each containing the target word or phrase ' +
      '(inflected/conjugated forms are encouraged where natural). Keep sentences 6-18 words long.',
    '',
    'NATURALNESS — this is the top priority:',
    '- Write the way native speakers ACTUALLY talk, not like a textbook. Prefer idiomatic, colloquial phrasing; ' +
      'contractions and casual register are welcome where the language uses them.',
    '- Ground each sentence in a realistic everyday situation (chatting with a friend, texting, at work, complaining, ' +
      'telling a story, news, small talk). Vary tense, register, and context across the sentences.',
    '- A native speaker reading the sentence should never think "nobody says it like that".',
    '',
    'SEPARABLE PHRASES:',
    '- If the target phrase contains "..." it is separable: other words belong BETWEEN its parts. Use it naturally ' +
      'with real words in between.',
    '- In that case, word_form must return the parts as they actually appear in that sentence, joined by " ... ". ' +
      'Each part must be copied verbatim from the sentence.',
    '',
    'Return JSON with this exact shape:',
    '{',
    '  "definition": "concise definition/explanation of the phrase in ' + nativeLang + ' (max 25 words)",',
    '  "word_translation": "the closest single translation of just the word/phrase into ' + nativeLang + '",',
    '  "sentences": [',
    '    {',
    '      "target": "the sentence in ' + targetLang + ', plain text, no HTML",',
    '      "native": "faithful ' + nativeLang + ' translation, plain text",',
    '      "word_form": "the EXACT substring of the target sentence that is the phrase as it appears there (verbatim, ' +
      'including inflection); for separable phrases: the parts verbatim, joined by \' ... \'"',
    '    }',
    '  ]',
    '}',
    'The sentences array must have exactly ' + SENTENCES_PER_SET + ' items. word_form must be copy-pasted verbatim from its sentence.'
  ].join('\n');

  const raw = await chatCompletion(apiKey, [
    { role: 'system', content: sys },
    { role: 'user', content: user }
  ], { json: true, temperature: 0.8, maxTokens: 2000 });

  const cleaned = raw.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  const parsed = JSON.parse(cleaned);
  if (!Array.isArray(parsed.sentences) || !parsed.sentences.length) {
    throw new Error('The model returned no sentences.');
  }
  parsed.sentences = parsed.sentences.slice(0, SENTENCES_PER_SET);
  return parsed;
}

function base64FromArrayBuffer(buf) {
  const bytes = new Uint8Array(buf);
  let binary = '';
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(binary);
}

/* ---------- Anki export (same three files as the original) ---------- */

function deckName(language, suffix) {
  return 'Fluent Loop::' + language + '::' + suffix;
}

function buildReadingDeck(sets, language) {
  const name = deckName(language, 'Reading');
  const rows = sets.map(set => stripField(readingFront(set)) + '\t' + stripField(readingBack(set)));
  return {
    filename: name.replace(/::/g, '-') + '.txt',
    content: '#separator:tab\n#html:true\n#deck:' + name + '\n#columns:Front\tBack\n' + rows.join('\n')
  };
}

function buildListeningDeck(sets, language) {
  const name = deckName(language, 'Listening');
  const rows = [];
  sets.forEach(set => {
    set.data.sentences.forEach((s, i) => {
      const audio = (set.audio || [])[i] || '';
      rows.push(stripField(listeningFront(audio)) + '\t' + stripField(listeningBack(set, s)));
    });
  });
  return {
    filename: name.replace(/::/g, '-') + '.txt',
    content: '#separator:tab\n#html:true\n#deck:' + name + '\n#columns:Front\tBack\n' + rows.join('\n')
  };
}

function buildSpeakingDeck(sets, language) {
  const name = deckName(language, 'Speaking');
  const rows = [];
  sets.forEach(set => {
    set.data.sentences.forEach((s, i) => {
      const audio = (set.audio || [])[i] || '';
      rows.push(stripField(speakingText(set, s)) + '\t' + stripField(speakingExtra(set, s, audio)));
    });
  });
  return {
    filename: name.replace(/::/g, '-') + '.txt',
    content: '#separator:tab\n#html:true\n#notetype:Cloze\n#deck:' + name + '\n#columns:Text\tBack Extra\n' + rows.join('\n')
  };
}

function Toast({ toast, onDismiss }) {
  useEffect(() => {

  }, [toast, onDismiss]);

  if (!toast) return null;
  const tone = toast.type === 'error'
    ? 'bg-red-500/15 border-red-500/40 text-red-200'
    : toast.type === 'success'
      ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-200'
      : 'bg-gray-700/60 border-gray-600 text-gray-100';

  return (

function SetupScreen({ initial, onSaved, onCancel, pushToast, learnerId }) {
  const [openaiKey, setOpenaiKey] = useState(initial ? initial.openaiKey : '');
  const [supabaseUrl, setSupabaseUrl] = useState(initial ? initial.supabaseUrl : '');
  const [supabaseKey, setSupabaseKey] = useState(initial ? initial.supabaseKey : '');
  const [language, setLanguage] = useState(initial ? initial.target_language : 'German');
  const [cefr, setCefr] = useState(initial ? initial.current_cefr : 'B1');
  const [mode, setMode] = useState(initial ? initial.vocab_injection_mode : 'adapt_naturally');
  const [voice, setVoice] = useState(initial && initial.voice ? initial.voice : 'alloy');
  const [busy, setBusy] = useState(false);
  const [step, setStep] = useState('');

  async function handleSave(e) {
    e.preventDefault();
    const key = openaiKey.trim();
    const url = supabaseUrl.trim().replace(/\/+$/, '');
    const anon = supabaseKey.trim();

    if (!key || !url || !anon) {
      pushToast('error', 'OpenAI key, Supabase URL and Supabase anon key are all required.');
      return;
    }
    if (!/^https?:\/\//i.test(url)) {
      pushToast('error', 'Supabase URL must start with https://');
      return;
    }

    setBusy(true);
    try {
      setStep('Verifying OpenAI key…');
      await verifyOpenAIKey(key);

      setStep('Connecting to Supabase…');
      const client = window.supabase.createClient(url, anon);

      const probe = await client.from('profiles').select('id').limit(1);
      if (probe.error) {
        throw new Error('Supabase: ' + probe.error.message + ' (check the URL, the anon key, that the tables exist, and that RLS allows anon access)');
      }

      // On a first run there is no learner row yet, so make sure one exists
      // before writing a profile that points at it.
      setStep('Checking the schema…');
      const learnerRows = await ensureLearner(client);
      const who = (learnerId && learnerRows.some(l => l.id === learnerId)) ? learnerId : learnerRows[0].id;

      const langProbe = await client.from('target_vocabulary').select('target_language').limit(1);
      if (langProbe.error) {
        if (missingLanguageColumn(langProbe.error)) throw new Error(MIGRATION_HINT);
        throw new Error('Supabase: ' + langProbe.error.message);
      }

      setStep('Saving your ' + language + ' profile…');
      // Settings only ever touch the profile row for the language being saved.
      const existing = await client
        .from('profiles')
        .select('*')
        .eq('user_id', who)
        .eq('target_language', language)
        .maybeSingle();
      if (existing.error) throw new Error('Supabase: ' + existing.error.message);

      const profileRow = {
        user_id: who,
        target_language: language,
        current_cefr: cefr,
        vocab_injection_mode: mode
      };

      let saved;
      if (existing.data) {
        const upd = await client
          .from('profiles')
          .update(profileRow)
          .eq('id', existing.data.id)
          .select()
          .single();
        if (upd.error) throw new Error('Supabase: ' + upd.error.message);
        saved = upd.data;
      } else {
        const ins = await client
          .from('profiles')
          .insert(profileRow)
          .select()
          .single();
        if (ins.error) throw new Error('Supabase: ' + ins.error.message);
        saved = ins.data;
      }

      const prevCfg = loadConfig() || {};
      const cfg = {
        openaiKey: key, supabaseUrl: url, supabaseKey: anon, voice: voice,
        targetLanguage: language,
        learnerId: who,
        conversationMode: prevCfg.conversationMode || MODE_TURN
      };
      saveConfig(cfg);
      pushToast('success', 'Connected. Everything checks out.');
      onSaved(cfg, client, saved);
    } catch (err) {
      console.error(err);
      pushToast('error', err.message || String(err));
    } finally {
      setBusy(false);
      setStep('');
    }
  }

  return (
    <div className="mx-auto flex min-h-full w-full max-w-md flex-col px-5 pb-10 pt-10">
      <div className="mb-8">
        <div className="mb-3 inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-indigo-500/15 text-indigo-400">
          <MicIcon className="h-6 w-6" />
        </div>
        <h1 className="text-2xl font-semibold tracking-tight">Fluent Loop</h1>
        <p className="mt-1 text-sm text-gray-400">
          Talk out loud every day. Your mistakes become tomorrow's vocabulary.
        </p>
      </div>

      <form onSubmit={handleSave} className="space-y-5">
        <div className="space-y-4 rounded-2xl border border-gray-800 bg-gray-800/40 p-4">
          <h2 className="text-sm font-semibold text-gray-200">Credentials</h2>
          <Field label="OpenAI API Key" hint="Used for Whisper, GPT-4o and TTS. Stored only in this browser.">
            <input className={inputClass} type="password" autoComplete="off" spellCheck="false"
              placeholder="sk-…" value={openaiKey} onChange={e => setOpenaiKey(e.target.value)} />
          </Field>
          <Field label="Supabase URL">
            <input className={inputClass} type="url" autoComplete="off" spellCheck="false"
              placeholder="https://xxxx.supabase.co" value={supabaseUrl} onChange={e => setSupabaseUrl(e.target.value)} />
          </Field>
          <Field label="Supabase Anon Key">
            <input className={inputClass} type="password" autoComplete="off" spellCheck="false"
              placeholder="eyJhbGciOi…" value={supabaseKey} onChange={e => setSupabaseKey(e.target.value)} />
          </Field>
        </div>

        <div className="space-y-4 rounded-2xl border border-gray-800 bg-gray-800/40 p-4">
          <h2 className="text-sm font-semibold text-gray-200">Learning profile</h2>
          <Field label="Target Language">
            <select className={inputClass} value={language} onChange={e => setLanguage(e.target.value)}>
              {LANGUAGES.map(l => <option key={l.code} value={l.name}>{l.name}</option>)}
            </select>
          </Field>
          <Field label="CEFR Level">
            <select className={inputClass} value={cefr} onChange={e => setCefr(e.target.value)}>
              {CEFR_LEVELS.map(l => <option key={l.code} value={l.code}>{l.label}</option>)}
            </select>
          </Field>
          <Field label="Partner Voice">
            <select className={inputClass} value={voice} onChange={e => setVoice(e.target.value)}>
              {VOICES.map(v => <option key={v} value={v}>{v}</option>)}
            </select>
          </Field>

          <div>
            <span className="mb-1.5 block text-xs font-medium uppercase tracking-wider text-gray-400">
              Vocab Injection Mode
            </span>
            <div className="grid grid-cols-2 gap-2">
              <button type="button" onClick={() => setMode('adapt_naturally')}
                className={'no-tap rounded-xl border p-3 text-left transition ' + (mode === 'adapt_naturally'
                  ? 'border-indigo-500 bg-indigo-500/15'
                  : 'border-gray-700 bg-gray-800 hover:border-gray-600')}>
                <div className="text-sm font-medium">Adapt Naturally</div>
                <div className="mt-0.5 text-xs text-gray-400">Phrases get conjugated to fit the sentence.</div>
              </button>
              <button type="button" onClick={() => setMode('force_verbatim')}
                className={'no-tap rounded-xl border p-3 text-left transition ' + (mode === 'force_verbatim'
                  ? 'border-indigo-500 bg-indigo-500/15'
                  : 'border-gray-700 bg-gray-800 hover:border-gray-600')}>
                <div className="text-sm font-medium">Force Verbatim</div>
                <div className="mt-0.5 text-xs text-gray-400">Phrases appear exactly as saved.</div>
              </button>
            </div>
          </div>
        </div>

        <button type="submit" disabled={busy}
          className="no-tap flex w-full items-center justify-center gap-2 rounded-xl bg-indigo-600 px-4 py-3.5 text-sm font-semibold text-white transition hover:bg-indigo-500 disabled:opacity-50">
          {busy ? <Spinner className="h-4 w-4" /> : null}
          {busy ? (step || 'Testing…') : 'Test & Save'}
        </button>

        {onCancel ? (
          <button type="button" onClick={onCancel}
            className="no-tap w-full rounded-xl px-4 py-3 text-sm text-gray-400 transition hover:text-white">
            Cancel
          </button>
        ) : null}
      </form>

      <details className="mt-8 rounded-2xl border border-gray-800 bg-gray-800/30 p-4">
        <summary className="cursor-pointer text-sm font-medium text-gray-300">First time? Run this SQL in Supabase</summary>
        <pre className="mt-3 overflow-x-auto rounded-lg bg-gray-900 p-3 text-[11px] leading-relaxed text-gray-400">{SQL_SNIPPET}</pre>
      </details>
    </div>
  );
}

const SQL_SNIPPET = `-- New install. Rows are owned by a learner profile and scoped to one language.
create table if not exists public.learners (
  id text primary key,
  name text not null,
  emoji text not null default '🙂',
  created_at timestamptz not null default now()
);
insert into public.learners (id, name) values ('default_user', 'Me')
  on conflict (id) do nothing;

-- Hard cap of five profiles, enforced in the database and not only in the UI.
create or replace function public.enforce_learner_limit()
returns trigger language plpgsql as $$
begin
  if (select count(*) from public.learners) >= 5 then
    raise exception 'Profile limit reached: a maximum of 5 profiles is allowed';
  end if;
  return new;
end; $$;
drop trigger if exists learners_limit on public.learners;
create trigger learners_limit before insert on public.learners
  for each row execute function public.enforce_learner_limit();

create table if not exists public.profiles (
  id uuid primary key default gen_random_uuid(),
  user_id text default 'default_user',
  target_language text not null default 'German',
  current_cefr text default 'B1',
  vocab_injection_mode text default 'adapt_naturally',
  unique (user_id, target_language)
);

create table if not exists public.target_vocabulary (
  id uuid primary key default gen_random_uuid(),
  user_id text default 'default_user',
  target_language text not null default 'German',
  phrase text not null,
  translation text,
  correction_context text,
  times_reviewed int default 0,
  status text default 'learning',
  mastered_at timestamptz,
  created_at timestamptz default now()
);

create table if not exists public.conversations (
  id uuid primary key default gen_random_uuid(),
  user_id text default 'default_user',
  target_language text not null default 'German',
  topic text not null,
  duration_seconds int,
  transcript jsonb not null,
  feedback jsonb,
  created_at timestamptz default now()
);

create index if not exists target_vocabulary_scope
  on public.target_vocabulary (user_id, target_language, status);
create index if not exists conversations_scope
  on public.conversations (user_id, target_language, created_at desc);

-- Flashcards: one card set per phrase, plus SM-2 state and an append-only log.
create table if not exists public.vocab_sets (
  id uuid primary key default gen_random_uuid(),
  user_id text not null default 'default_user',
  target_language text not null default 'German',
  vocab_id uuid references public.target_vocabulary(id) on delete cascade,
  phrase text not null,
  voice text,
  data jsonb not null,
  audio jsonb,
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);
create unique index if not exists vocab_sets_one_per_phrase
  on public.vocab_sets (user_id, target_language, vocab_id);

create table if not exists public.srs_reviews (
  card_id text primary key,
  user_id text not null default 'default_user',
  target_language text not null default 'German',
  set_id uuid not null references public.vocab_sets(id) on delete cascade,
  deck text not null, idx int not null,
  state text not null default 'new', step int not null default 0,
  ivl int not null default 0, ef float8 not null default 2.5,
  reps int not null default 0, lapses int not null default 0,
  due_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);

create table if not exists public.srs_revlog (
  id uuid primary key default gen_random_uuid(),
  user_id text not null default 'default_user',
  target_language text, card_id text not null, set_id uuid, deck text,
  rating text not null, state text, ivl int,
  was_new boolean not null default false,
  at timestamptz not null default now()
);

-- Language islands: the learner picks the island, the model plans the roadmap.
create table if not exists public.islands (
  id uuid primary key default gen_random_uuid(),
  user_id text not null default 'default_user',
  target_language text not null default 'German',
  name text not null, goal text, about_you text,
  status text not null default 'active',
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);
create unique index if not exists islands_one_active
  on public.islands (user_id, target_language) where status = 'active';

create table if not exists public.island_stages (
  id uuid primary key default gen_random_uuid(),
  island_id uuid not null references public.islands(id) on delete cascade,
  user_id text not null default 'default_user',
  target_language text not null default 'German',
  position int not null, title text not null,
  objective text, scenario text, structures jsonb, phrases jsonb,
  done_when text, recycles_from jsonb,
  status text not null default 'locked',
  ai_verdict boolean not null default false,
  seeded boolean not null default false,
  sessions_count int not null default 0,
  completed_at timestamptz,
  created_at timestamptz not null default now()
);
create unique index if not exists island_stages_position
  on public.island_stages (island_id, position);

alter table public.conversations add column if not exists stage_id uuid;

-- Upgrading an older database? The repo carries both migrations under
-- supabase/migrations, so "supabase db push" applies them in order.`;
