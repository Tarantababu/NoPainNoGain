/* ---------------------------------------------------------------------- App */

function App() {
  const [config, setConfig] = useState(loadConfig);
  const [client, setClient] = useState(null);
  const [profile, setProfile] = useState(null);
  const [language, setLanguage] = useState(() => {
    const cfg = loadConfig();
    return (cfg && cfg.targetLanguage) || 'German';
  });
  const [switchingLanguage, setSwitchingLanguage] = useState(false);
  const [screen, setScreen] = useState(loadConfig() ? 'loading' : 'setup');
  const [toast, setToast] = useState(null);

  const [vocab, setVocab] = useState([]);
  const [vocabLoading, setVocabLoading] = useState(true);
  const [stats, setStats] = useState({ sessions: 0, mastered: 0 });
  const [recommended, setRecommended] = useState({ topic: FALLBACK_TOPICS[0], source: 'starter' });

  const [topic, setTopic] = useState('');
  const [mode, setMode] = useState(() => {
    const cfg = loadConfig();
    return cfg && cfg.conversationMode === MODE_REALTIME ? MODE_REALTIME : MODE_TURN;
  });
  const [messages, setMessages] = useState([]);
  const [status, setStatus] = useState('idle');
  const [muted, setMuted] = useState(false);
  const [connectionState, setConnectionState] = useState('');
  const [secondsLeft, setSecondsLeft] = useState(SESSION_SECONDS);
  const [micDisabled, setMicDisabled] = useState(false);

  const [feedback, setFeedback] = useState(null);
  const [sheetOpen, setSheetOpen] = useState(false);
  const [suggestOpen, setSuggestOpen] = useState(false);
  const [suggestBusy, setSuggestBusy] = useState(false);
  const [suggestNote, setSuggestNote] = useState('');
  const [suggestItems, setSuggestItems] = useState([]);
  const [exportOpen, setExportOpen] = useState(false);
  const [exportBusy, setExportBusy] = useState(false);
  const [exportNote, setExportNote] = useState('');
  const [savingFeedback, setSavingFeedback] = useState(false);
  const [saveNote, setSaveNote] = useState('');

  // Refs that must not trigger re-renders.
  const audioRef = useRef(null);
  const audioUrlRef = useRef(null);
  const recorderRef = useRef(null);
  const streamRef = useRef(null);
  const chunksRef = useRef([]);
  const messagesRef = useRef([]);
  const sessionVocabRef = useRef([]);
  const endingRef = useRef(false);
  const statusRef = useRef('idle');
  const turkishCacheRef = useRef(new Map());
  const realtimeRef = useRef(null);
  const realtimeDcRef = useRef(null);
  const realtimeItemsRef = useRef([]);
  const modeRef = useRef(MODE_TURN);
  const languageRef = useRef('German');

  useEffect(() => { messagesRef.current = messages; }, [messages]);
  useEffect(() => { statusRef.current = status; }, [status]);
  useEffect(() => { modeRef.current = mode; }, [mode]);
  useEffect(() => { languageRef.current = language; }, [language]);

  const changeMode = useCallback((next) => {
    setMode(next);
    const cfg = loadConfig();
    if (cfg) saveConfig(Object.assign({}, cfg, { conversationMode: next }));
  }, []);

  const pushToast = useCallback((type, message) => {
    setToast({ type: type, message: message });
  }, []);
  const dismissToast = useCallback(() => setToast(null), []);

  /* ------------------------------------------------------------ audio utils */

  const stopPlayback = useCallback(() => {
    if (audioRef.current) {
      audioRef.current.pause();
      audioRef.current.currentTime = 0;
    }
    if (audioUrlRef.current) {
      URL.revokeObjectURL(audioUrlRef.current);
      audioUrlRef.current = null;
    }
  }, []);

  const releaseMic = useCallback(() => {
    if (streamRef.current) {
      streamRef.current.getTracks().forEach(t => t.stop());
      streamRef.current = null;
    }
    recorderRef.current = null;
    chunksRef.current = [];
  }, []);

  const playAudioBlob = useCallback(async (blob) => {
    stopPlayback();
    const url = URL.createObjectURL(blob);
    audioUrlRef.current = url;
    if (!audioRef.current) audioRef.current = new Audio();
    const audio = audioRef.current;
    audio.src = url;
    audio.onended = () => {
      if (statusRef.current === 'speaking') setStatus('idle');
    };
    audio.onerror = () => {
      if (statusRef.current === 'speaking') setStatus('idle');
    };
    setStatus('speaking');
    try {
      await audio.play();
    } catch (err) {
      // Autoplay blocked or interrupted by the user tapping the mic.
      if (statusRef.current === 'speaking') setStatus('idle');
    }
  }, [stopPlayback]);

  /* --------------------------------------------------------- data fetching */

  const refreshVocab = useCallback(async (c, languageOverride) => {
    const db = c || client;
    const lang = languageOverride || languageRef.current;
    if (!db || !lang) return [];
    setVocabLoading(true);
    try {
      const res = await scoped(db.from('target_vocabulary').select('*'), lang)
        .eq('status', 'learning')
        .order('created_at', { ascending: true });
      if (res.error) throw new Error(missingLanguageColumn(res.error) ? MIGRATION_HINT : res.error.message);
      const rows = res.data || [];
      setVocab(rows);
      return rows;
    } catch (err) {
      pushToast('error', 'Could not load vocabulary: ' + err.message);
      return [];
    } finally {
      setVocabLoading(false);
    }
  }, [client, pushToast]);

  const refreshStats = useCallback(async (c, languageOverride) => {
    const db = c || client;
    const lang = languageOverride || languageRef.current;
    if (!db || !lang) return;
    try {
      const [sessionsRes, masteredRes] = await Promise.all([
        scoped(db.from('conversations').select('id', { count: 'exact', head: true }), lang),
        scoped(db.from('target_vocabulary').select('id', { count: 'exact', head: true }), lang).eq('status', 'mastered')
      ]);
      setStats({
        sessions: sessionsRes.count || 0,
        mastered: masteredRes.count || 0
      });
    } catch (err) {
      console.warn('stats failed', err);
    }
  }, [client]);

  const refreshRecommendedTopic = useCallback(async (c, vocabRows, languageOverride) => {
    const db = c || client;
    const lang = languageOverride || languageRef.current;
    if (!db || !lang) return;
    try {
      const res = await scoped(db.from('conversations').select('feedback, topic, created_at'), lang)
        .order('created_at', { ascending: false })
        .limit(1);
      if (res.error) throw new Error(res.error.message);

      const last = (res.data || [])[0];
      const fromFeedback = last && last.feedback && last.feedback.next_topic_recommendation;
      if (fromFeedback) {
        setRecommended({ topic: fromFeedback, source: 'from last session' });
        return;
      }

      const rows = vocabRows || vocab;
      if (rows && rows.length) {
        const picks = rows.slice(0, 3).map(v => '"' + v.phrase + '"').join(', ');
        setRecommended({
          topic: 'A conversation where you naturally need ' + picks + '.',
          source: 'from your active vocabulary'
        });
        return;
      }

      const idx = new Date().getDate() % FALLBACK_TOPICS.length;
      setRecommended({ topic: FALLBACK_TOPICS[idx], source: 'starter' });
    } catch (err) {
      console.warn('topic recommendation failed', err);
      const idx = new Date().getDate() % FALLBACK_TOPICS.length;
      setRecommended({ topic: FALLBACK_TOPICS[idx], source: 'starter' });
    }
  }, [client, vocab]);

  /* ------------------------------------------------------------ boot / init */

  useEffect(() => {
    let cancelled = false;

    async function boot() {
      const cfg = config;
      if (!cfg) { setScreen('setup'); return; }

      try {
        const db = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
        if (cancelled) return;
        setClient(db);

        const activeLanguage = cfg.targetLanguage || 'German';
        languageRef.current = activeLanguage;
        setLanguage(activeLanguage);

        const row = await loadOrCreateProfile(db, activeLanguage, null);
        if (cancelled) return;
        setProfile(row);
        setScreen('dashboard');

        const rows = await refreshVocab(db, activeLanguage);
        if (cancelled) return;
        await Promise.all([
          refreshStats(db, activeLanguage),
          refreshRecommendedTopic(db, rows, activeLanguage)
        ]);
      } catch (err) {
        if (cancelled) return;
        console.error(err);
        pushToast('error', missingLanguageColumn(err)
          ? MIGRATION_HINT
          : 'Connection failed: ' + err.message + ' — check your settings.');
        setScreen('setup');
      }
    }

    if (config && !client) boot();
    else if (!config) setScreen('setup');

    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [config]);

  /* ------------------------------------------------------------ the timer */

  useEffect(() => {
    if (screen !== 'session') return undefined;
    const id = setInterval(() => {
      setSecondsLeft(prev => {
        if (prev <= 1) {
          clearInterval(id);
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [screen]);

  useEffect(() => {
    if (screen === 'session' && secondsLeft === 0 && !endingRef.current) {
      pushToast('info', "Time's up — analysing your session.");
      endSession();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [secondsLeft, screen]);

  /* ------------------------------------------------------- realtime session */

  const teardownRealtime = useCallback(() => {
    if (realtimeRef.current) {
      try { realtimeRef.current.close(); } catch (e) { /* noop */ }
      realtimeRef.current = null;
    }
    realtimeDcRef.current = null;
  }, []);

  // Items are tracked by their server-side id so the transcript keeps the order
  // the conversation actually happened in, even though a user transcription can
  // land after the reply it triggered.
  const syncRealtimeTranscript = useCallback(() => {
    const rows = realtimeItemsRef.current
      .filter(it => it.content && it.content.trim())
      .map(it => ({ role: it.role, content: it.content.trim() }));
    messagesRef.current = rows;
    setMessages(rows);
  }, []);

  const upsertRealtimeItem = useCallback((id, role, content) => {
    if (!id) return;
    const items = realtimeItemsRef.current;
    let item = items.find(it => it.id === id);
    if (!item) {
      item = { id: id, role: role || 'assistant', content: '' };
      items.push(item);
    }
    if (role) item.role = role;
    if (typeof content === 'string') item.content = content;
    syncRealtimeTranscript();
  }, [syncRealtimeTranscript]);

  const handleRealtimeEvent = useCallback((event) => {
    if (!event || !event.type) return;

    switch (event.type) {
      // Establishes ordering as soon as the server creates the item.
      case 'conversation.item.added':
      case 'conversation.item.created': {
        const item = event.item;
        if (item && item.id && (item.role === 'user' || item.role === 'assistant')) {
          upsertRealtimeItem(item.id, item.role, undefined);
        }
        break;
      }

      case 'conversation.item.input_audio_transcription.completed':
        upsertRealtimeItem(event.item_id, 'user', event.transcript || '');
        break;

      case 'conversation.item.input_audio_transcription.failed':
        console.warn('Transcription failed', event);
        break;

      // Event name differs between the preview and GA surfaces; accept both.
      case 'response.output_audio_transcript.done':
      case 'response.audio_transcript.done':
        upsertRealtimeItem(event.item_id, 'assistant', event.transcript || '');
        break;

      case 'input_audio_buffer.speech_started':
        setStatus('listening');
        break;

      case 'input_audio_buffer.speech_stopped':
        if (statusRef.current === 'listening') setStatus('live');
        break;

      case 'response.created':
        setStatus('speaking');
        break;

      case 'response.done':
        if (statusRef.current === 'speaking') setStatus('live');
        break;

      case 'error': {
        const msg = event.error && event.error.message ? event.error.message : 'Realtime error.';
        console.error('Realtime error', event);
        pushToast('error', msg);
        break;
      }

      default:
        break;
    }
  }, [upsertRealtimeItem, pushToast]);

  const startRealtimeSession = useCallback(async (chosenTopic) => {
    const sessionConfig = buildRealtimeSession(profile, chosenTopic, sessionVocabRef.current, config.voice);

    try {
      const conn = await connectRealtime(config.openaiKey, sessionConfig, {
        onOpen: (dc) => {
          realtimeDcRef.current = dc;
          // Re-send the config on the channel: it is the only path that applies
          // when the connection was made with the raw key rather than a secret.
          dc.send(JSON.stringify({ type: 'session.update', session: sessionConfig }));
          dc.send(JSON.stringify({
            type: 'response.create',
            response: {
              instructions: 'Greet the learner briefly in ' + profile.target_language +
                ' and ask one opening question about the topic. Two sentences maximum.'
            }
          }));
          setStatus('live');
        },
        onEvent: handleRealtimeEvent,
        onConnectionState: (state) => {
          setConnectionState(state);
          if (state === 'failed' || state === 'disconnected') {
            pushToast('error', 'The realtime connection dropped. End the session to save what you have.');
            setStatus('live');
          }
        }
      });

      realtimeRef.current = conn;
      setMuted(false);
    } catch (err) {
      console.error(err);
      teardownRealtime();
      pushToast('error', 'Could not start realtime: ' + (err.message || String(err)));
      setScreen('dashboard');
      setStatus('idle');
    }
  }, [profile, config, handleRealtimeEvent, teardownRealtime, pushToast]);

  const toggleMute = useCallback(() => {
    const conn = realtimeRef.current;
    if (!conn || !conn.micStream) return;
    const next = !muted;
    conn.micStream.getAudioTracks().forEach(t => { t.enabled = !next; });
    setMuted(next);
  }, [muted]);

  useEffect(() => {
    return () => {
      stopPlayback();
      releaseMic();
      teardownRealtime();
    };
  }, [stopPlayback, releaseMic, teardownRealtime]);

  /* --------------------------------------------------------- session start */

  const startSession = useCallback(async (chosenTopic) => {
    if (!chosenTopic || !profile) return;

    endingRef.current = false;
    setTopic(chosenTopic);
    setMessages([]);
    messagesRef.current = [];
    setSecondsLeft(SESSION_SECONDS);
    setFeedback(null);
    setSheetOpen(false);
    setMicDisabled(false);
    sessionVocabRef.current = vocab.slice();
    realtimeItemsRef.current = [];
    setConnectionState('');
    setMuted(false);
    setScreen('session');

    if (mode === MODE_REALTIME) {
      setStatus('connecting');
      await startRealtimeSession(chosenTopic);
      return;
    }

    setStatus('starting');

    const systemPrompt = buildSystemPrompt(profile, chosenTopic, sessionVocabRef.current);

    try {
      const opener = await chatCompletion(config.openaiKey, [
        { role: 'system', content: systemPrompt },
        {
          role: 'user',
          content: '[The session begins now. Greet me briefly in ' + profile.target_language +
            ' and ask one opening question about the topic. Two sentences maximum.]'
        }
      ], { maxTokens: 160, temperature: 0.9 });

      if (!opener) throw new Error('Empty opening line from the model.');

      const next = [{ role: 'assistant', content: opener }];
      setMessages(next);
      messagesRef.current = next;

      const speech = await synthesizeSpeech(config.openaiKey, opener, config.voice);
      await playAudioBlob(speech);
    } catch (err) {
      console.error(err);
      pushToast('error', err.message);
      setStatus('idle');
    }
  }, [profile, vocab, config, mode, startRealtimeSession, playAudioBlob, pushToast]);

  /* --------------------------------------------------------- the voice turn */

  const handleRecordedAudio = useCallback(async (blob) => {
    if (!blob || blob.size < 1200) {
      setStatus('idle');
      pushToast('info', 'That recording was too short to hear. Hold the button a little longer.');
      return;
    }

    setStatus('transcribing');
    try {
      const text = await transcribeAudio(config.openaiKey, blob, profile.target_language);
      if (!text) {
        setStatus('idle');
        pushToast('info', 'Nothing was picked up. Try again a bit closer to the mic.');
        return;
      }

      const withUser = messagesRef.current.concat([{ role: 'user', content: text }]);
      setMessages(withUser);
      messagesRef.current = withUser;

      setStatus('thinking');
      const systemPrompt = buildSystemPrompt(profile, topic, sessionVocabRef.current);
      const reply = await chatCompletion(
        config.openaiKey,
        [{ role: 'system', content: systemPrompt }].concat(withUser),
        { maxTokens: 200, temperature: 0.85 }
      );
      if (!reply) throw new Error('Empty reply from the model.');

      const withAssistant = messagesRef.current.concat([{ role: 'assistant', content: reply }]);
      setMessages(withAssistant);
      messagesRef.current = withAssistant;

      setStatus('synthesizing');
      const speech = await synthesizeSpeech(config.openaiKey, reply, config.voice);
      await playAudioBlob(speech);
    } catch (err) {
      console.error(err);
      pushToast('error', err.message);
      setStatus('idle');
    }
  }, [config, profile, topic, playAudioBlob, pushToast]);

  const startRecording = useCallback(async () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setMicDisabled(true);
      pushToast('error', 'This browser has no microphone API. Use Chrome, Edge or Safari over https or localhost.');
      return;
    }
    if (typeof MediaRecorder === 'undefined') {
      setMicDisabled(true);
      pushToast('error', 'MediaRecorder is not supported in this browser.');
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
      streamRef.current = stream;

      const mime = pickRecorderMime();
      const recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
      recorderRef.current = recorder;
      chunksRef.current = [];

      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunksRef.current.push(e.data);
      };
      recorder.onstop = () => {
        const type = recorder.mimeType || mime || 'audio/webm';
        const blob = new Blob(chunksRef.current, { type: type });
        chunksRef.current = [];
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(t => t.stop());
          streamRef.current = null;
        }
        recorderRef.current = null;
        handleRecordedAudio(blob);
      };
      recorder.onerror = (e) => {
        console.error(e);
        pushToast('error', 'Recording failed. Try again.');
        setStatus('idle');
        releaseMic();
      };

      recorder.start();
      setStatus('recording');
    } catch (err) {
      console.error(err);
      setStatus('idle');
      if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) {
        pushToast('error', 'Microphone access denied. Allow the mic for this page and try again.');
      } else if (err && err.name === 'NotFoundError') {
        pushToast('error', 'No microphone found on this device.');
      } else {
        pushToast('error', 'Could not start recording: ' + (err.message || err.name));
      }
    }
  }, [handleRecordedAudio, pushToast, releaseMic]);

  const toggleMic = useCallback(() => {
    if (modeRef.current === MODE_REALTIME) {
      toggleMute();
      return;
    }

    if (status === 'recording') {
      if (recorderRef.current && recorderRef.current.state !== 'inactive') {
        recorderRef.current.stop();
      }
      setStatus('transcribing');
      return;
    }

    // Interruption: tapping the mic while the partner is talking kills playback instantly.
    if (status === 'speaking') {
      stopPlayback();
    }

    if (status === 'idle' || status === 'speaking') {
      startRecording();
    }
  }, [status, stopPlayback, startRecording, toggleMute]);

  /* ------------------------------------------------------- end and analyse */

  const endSession = useCallback(async () => {
    if (endingRef.current) return;
    endingRef.current = true;

    if (recorderRef.current && recorderRef.current.state !== 'inactive') {
      try { recorderRef.current.onstop = null; recorderRef.current.stop(); } catch (e) { /* noop */ }
    }
    releaseMic();
    stopPlayback();
    teardownRealtime();
    setConnectionState('');
    setStatus('analyzing');

    const transcript = messagesRef.current.slice();
    const usedSeconds = SESSION_SECONDS - secondsLeft;
    const sessionTopic = topic;
    // Pin the language at end time so a mid-analysis switch cannot misfile rows.
    const sessionLanguage = languageRef.current;
    const sessionVocab = sessionVocabRef.current.slice();

    const userTurns = transcript.filter(m => m.role === 'user');
    if (!userTurns.length) {
      pushToast('info', 'No speech recorded, so there is nothing to analyse.');
      setScreen('dashboard');
      setStatus('idle');
      endingRef.current = false;
      return;
    }

    let parsed = null;
    try {
      const raw = await chatCompletion(config.openaiKey, [
        { role: 'system', content: 'You are a meticulous language assessor. You always reply with a single valid JSON object and nothing else.' },
        { role: 'user', content: buildAnalysisPrompt(profile, sessionTopic, transcript, sessionVocab) }
      ], { json: true, temperature: 0.3, maxTokens: 1600 });

      const cleaned = raw.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
      parsed = JSON.parse(cleaned);
    } catch (err) {
      console.error(err);
      pushToast('error', 'Analysis failed: ' + err.message);
      setScreen('dashboard');
      setStatus('idle');
      endingRef.current = false;
      return;
    }

    const analysis = {
      grammar_mistakes: Array.isArray(parsed.grammar_mistakes) ? parsed.grammar_mistakes : [],
      recommended_phrases: Array.isArray(parsed.recommended_phrases) ? parsed.recommended_phrases : [],
      next_topic_recommendation: parsed.next_topic_recommendation || '',
      cefr_level_feedback: parsed.cefr_level_feedback || ''
    };

    // Vocab progression engine — a phrase counts as reviewed when the local scan of the
    // learner's own words finds it, or when the analyser reports the learner produced it
    // (which catches conjugated, split and declined forms the string scan cannot see).
    const learnerText = userTurns.map(m => m.content).join(' \n ');
    const modelUsed = new Set(
      (Array.isArray(parsed.used_target_phrases) ? parsed.used_target_phrases : [])
        .map(p => normalizeText(p))
        .filter(Boolean)
    );
    const progressed = [];
    const masteredNow = [];
    for (const v of sessionVocab) {
      if (phraseWasUsed(v.phrase, learnerText) || modelUsed.has(normalizeText(v.phrase))) {
        const times = (v.times_reviewed || 0) + 1;
        const nextStatus = times >= MASTERY_THRESHOLD ? 'mastered' : 'learning';
        progressed.push({ id: v.id, phrase: v.phrase, times_reviewed: times, status: nextStatus });
        if (nextStatus === 'mastered') masteredNow.push(v.phrase);
      }
    }
    analysis.mastered_now = masteredNow;

    setFeedback(analysis);
    setSheetOpen(true);
    setScreen('dashboard');
    setStatus('idle');
    setSavingFeedback(true);
    setSaveNote('Saving to your database…');

    const problems = [];

    // 1. Insert newly recommended phrases (skip ones already tracked).
    try {
      if (analysis.recommended_phrases.length && client) {
        const existing = await scoped(client.from('target_vocabulary').select('phrase'), sessionLanguage);
        if (existing.error) throw new Error(existing.error.message);

        const known = new Set((existing.data || []).map(r => normalizeText(r.phrase)));
        const rows = analysis.recommended_phrases
          .filter(p => p && p.phrase && !known.has(normalizeText(p.phrase)))
          .map(p => ({
            user_id: DEFAULT_USER,
            target_language: sessionLanguage,
            phrase: String(p.phrase).trim(),
            translation: p.translation ? String(p.translation).trim() : null,
            correction_context: p.context ? String(p.context).trim() : null,
            times_reviewed: 0,
            status: 'learning'
          }));

        if (rows.length) {
          const ins = await client.from('target_vocabulary').insert(rows);
          if (ins.error) throw new Error(ins.error.message);
        }
      }
    } catch (err) {
      console.error(err);
      problems.push('new vocabulary');
    }

    // 2. Apply the progression updates.
    try {
      if (progressed.length && client) {
        for (const p of progressed) {
          const upd = await client
            .from('target_vocabulary')
            .update({ times_reviewed: p.times_reviewed, status: p.status })
            .eq('id', p.id);
          if (upd.error) throw new Error(upd.error.message);
        }
      }
    } catch (err) {
      console.error(err);
      problems.push('vocabulary progress');
    }

    // 3. Persist the conversation itself.
    try {
      if (client) {
        const ins = await client.from('conversations').insert({
          user_id: DEFAULT_USER,
          target_language: sessionLanguage,
          topic: sessionTopic,
          duration_seconds: usedSeconds,
          transcript: transcript,
          feedback: analysis
        });
        if (ins.error) throw new Error(ins.error.message);
      }
    } catch (err) {
      console.error(err);
      problems.push('session transcript');
    }

    setSavingFeedback(false);
    if (problems.length) {
      setSaveNote('Could not save: ' + problems.join(', ') + '.');
      pushToast('error', 'Some data did not save: ' + problems.join(', ') + '.');
    } else {
      const bits = [];
      if (analysis.recommended_phrases.length) bits.push(analysis.recommended_phrases.length + ' new phrases');
      if (progressed.length) bits.push(progressed.length + ' reviewed');
      if (masteredNow.length) bits.push(masteredNow.length + ' mastered');
      setSaveNote('Saved' + (bits.length ? ' · ' + bits.join(' · ') : '') + '.');
    }

    const rows = await refreshVocab(client, sessionLanguage);
    await Promise.all([
      refreshStats(client, sessionLanguage),
      refreshRecommendedTopic(client, rows, sessionLanguage)
    ]);
    endingRef.current = false;
  }, [client, config, profile, topic, secondsLeft, releaseMic, stopPlayback, teardownRealtime, pushToast, refreshVocab, refreshStats, refreshRecommendedTopic]);

  /* -------------------------------------------------------- language switch */

  // Switching language swaps the entire workspace: its own profile row, its own
  // vocabulary, its own history. Nothing is carried across.
  const switchLanguage = useCallback(async (nextLanguage) => {
    if (!client || !nextLanguage || nextLanguage === language) return;

    setSwitchingLanguage(true);
    try {
      const row = await loadOrCreateProfile(client, nextLanguage, null);

      languageRef.current = nextLanguage;
      setLanguage(nextLanguage);
      setProfile(row);
      setVocab([]);
      setFeedback(null);
      setSheetOpen(false);
      setSuggestItems([]);
      turkishCacheRef.current = new Map();

      const cfg = loadConfig();
      if (cfg) saveConfig(Object.assign({}, cfg, { targetLanguage: nextLanguage }));
      setConfig(loadConfig());

      const rows = await refreshVocab(client, nextLanguage);
      await Promise.all([
        refreshStats(client, nextLanguage),
        refreshRecommendedTopic(client, rows, nextLanguage)
      ]);
      pushToast('success', 'Switched to ' + nextLanguage + ' · ' + row.current_cefr + '.');
    } catch (err) {
      console.error(err);
      pushToast('error', missingLanguageColumn(err) ? MIGRATION_HINT : 'Could not switch language: ' + err.message);
    } finally {
      setSwitchingLanguage(false);
    }
  }, [client, language, refreshVocab, refreshStats, refreshRecommendedTopic, pushToast]);

  /* ---------------------------------------------------- phrase suggestions */

  const fetchKnownPhrases = useCallback(async () => {
    if (!client) return [];
    const res = await scoped(client.from('target_vocabulary').select('phrase'), languageRef.current);
    if (res.error) throw new Error(res.error.message);
    return (res.data || []).map(r => r.phrase).filter(Boolean);
  }, [client]);

  const openSuggest = useCallback(() => {
    setSuggestItems([]);
    setSuggestNote('');
    setSuggestOpen(true);
  }, []);

  const generateSuggestions = useCallback(async (theme) => {
    if (!profile) return;
    setSuggestBusy(true);
    setSuggestNote('Looking for phrases worth your time…');
    try {
      const known = await fetchKnownPhrases();
      const fresh = await suggestStarterPhrases(config.openaiKey, profile, theme, known);
      if (!fresh.length) {
        setSuggestNote('Nothing new came back. Try a different theme.');
      } else {
        setSuggestNote(fresh.length + ' suggestions — untick anything you do not want.');
      }
      // Keep whatever the learner typed by hand, replace the generated batch.
      setSuggestItems(prev => prev
        .filter(it => it.source === 'manual')
        .concat(fresh.map(f => Object.assign({}, f, { selected: true }))));
    } catch (err) {
      console.error(err);
      setSuggestNote('');
      pushToast('error', 'Could not fetch suggestions: ' + (err.message || String(err)));
    } finally {
      setSuggestBusy(false);
    }
  }, [profile, config, fetchKnownPhrases, pushToast]);

  const toggleSuggestion = useCallback((index) => {
    setSuggestItems(prev => prev.map((it, i) => (i === index ? Object.assign({}, it, { selected: !it.selected }) : it)));
  }, []);

  const addManualPhrase = useCallback((phrase, translation) => {
    const key = normalizeText(phrase);
    let duplicate = false;
    setSuggestItems(prev => {
      if (prev.some(it => normalizeText(it.phrase) === key)) {
        duplicate = true;
        return prev;
      }
      return [{
        phrase: phrase,
        translation: translation || '',
        context: '',
        category: '',
        source: 'manual',
        selected: true
      }].concat(prev);
    });
    if (duplicate) pushToast('info', 'That phrase is already in the list.');
  }, [pushToast]);

  const addSelectedPhrases = useCallback(async () => {
    const chosen = suggestItems.filter(it => it.selected);
    if (!chosen.length || !client) return;

    setSuggestBusy(true);
    setSuggestNote('Saving to your vocabulary…');
    try {
      const known = await fetchKnownPhrases();
      const knownKeys = new Set(known.map(normalizeText));

      const rows = chosen
        .filter(it => !knownKeys.has(normalizeText(it.phrase)))
        .map(it => ({
          user_id: DEFAULT_USER,
          target_language: languageRef.current,
          phrase: it.phrase,
          translation: it.translation || null,
          correction_context: it.context || null,
          times_reviewed: 0,
          status: 'learning'
        }));

      const skipped = chosen.length - rows.length;

      if (rows.length) {
        const ins = await client.from('target_vocabulary').insert(rows);
        if (ins.error) throw new Error(ins.error.message);
      }

      setSuggestOpen(false);
      setSuggestItems([]);
      setSuggestNote('');

      if (rows.length) {
        pushToast('success', 'Added ' + rows.length + ' phrase' + (rows.length === 1 ? '' : 's') +
          (skipped ? ' · ' + skipped + ' already saved' : '') + '.');
      } else {
        pushToast('info', 'Those phrases are already in your vocabulary.');
      }

      const refreshed = await refreshVocab(client);
      await Promise.all([refreshStats(client), refreshRecommendedTopic(client, refreshed)]);
    } catch (err) {
      console.error(err);
      setSuggestNote('');
      pushToast('error', 'Could not save phrases: ' + (err.message || String(err)));
    } finally {
      setSuggestBusy(false);
    }
  }, [suggestItems, client, fetchKnownPhrases, pushToast, refreshVocab, refreshStats, refreshRecommendedTopic]);

  /* --------------------------------------------------------- vocab export */

  const openExport = useCallback(() => {
    if (!vocab.length) {
      pushToast('info', 'No active phrases to export yet.');
      return;
    }
    setExportNote('');
    setExportOpen(true);
  }, [vocab.length, pushToast]);

  const runExport = useCallback(async (format, withTurkish) => {
    if (!vocab.length) return;

    setExportBusy(true);
    let rows = vocab.map(v => ({
      id: v.id,
      phrase: v.phrase,
      translation: v.translation,
      correction_context: v.correction_context,
      times_reviewed: v.times_reviewed,
      status: v.status,
      created_at: v.created_at,
      turkish: ''
    }));

    try {
      if (withTurkish) {
        const cache = turkishCacheRef.current;
        rows.forEach(r => {
          const hit = cache.get(r.phrase);
          if (hit) r.turkish = hit;
        });

        const missing = rows.filter(r => !r.turkish);
        if (missing.length) {
          setExportNote('Translating ' + missing.length + ' phrase' + (missing.length === 1 ? '' : 's') + ' into Turkish…');
          const translations = await translateToTurkish(config.openaiKey, missing, profile.target_language);
          missing.forEach((r, i) => {
            const tr = translations[i] || '';
            r.turkish = tr;
            if (tr) cache.set(r.phrase, tr);
          });
        }
      }

      setExportNote('Building the file…');
      const stamp = new Date().toISOString().slice(0, 10);
      const langSlug = profile.target_language.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      const base = 'fluent-loop-vocab-' + langSlug + '-' + stamp;

      if (format === 'csv') {
        downloadFile(base + '.csv', 'text/csv', buildVocabCsv(rows, profile.target_language, withTurkish));
      } else {
        downloadFile(base + '.txt', 'text/plain', buildVocabText(rows, profile.target_language, withTurkish));
      }

      setExportNote('Downloaded ' + base + '.' + format);
      pushToast('success', 'Exported ' + rows.length + ' phrase' + (rows.length === 1 ? '' : 's') + ' as .' + format + '.');
      setExportOpen(false);
    } catch (err) {
      console.error(err);
      setExportNote('');
      pushToast('error', 'Export failed: ' + (err.message || String(err)));
    } finally {
      setExportBusy(false);
    }
  }, [vocab, config, profile, pushToast]);

  /* ------------------------------------------------------------- settings */

  const handleSetupSaved = useCallback(async (cfg, db, savedProfile) => {
    const lang = savedProfile.target_language;
    languageRef.current = lang;
    setLanguage(lang);
    setConfig(cfg);
    setClient(db);
    setProfile(savedProfile);
    setScreen('dashboard');
    const rows = await refreshVocab(db, lang);
    await Promise.all([refreshStats(db, lang), refreshRecommendedTopic(db, rows, lang)]);
  }, [refreshVocab, refreshStats, refreshRecommendedTopic]);

  /* ---------------------------------------------------------------- render */

  if (screen === 'loading') {
    return (
      <div className="flex h-full items-center justify-center text-gray-400">
        <Spinner className="h-6 w-6" />
      </div>
    );
  }

  if (screen === 'setup' || screen === 'settings') {
    const initial = {
      openaiKey: config ? config.openaiKey : '',
      supabaseUrl: config ? config.supabaseUrl : '',
      supabaseKey: config ? config.supabaseKey : '',
      voice: config && config.voice ? config.voice : 'alloy',
      target_language: profile ? profile.target_language : language,
      current_cefr: profile ? profile.current_cefr : 'B1',
      vocab_injection_mode: profile ? profile.vocab_injection_mode : 'adapt_naturally'
    };
    return (
      <React.Fragment>
        <Toast toast={toast} onDismiss={dismissToast} />
        <SetupScreen
          initial={initial}
          onSaved={handleSetupSaved}
          onCancel={screen === 'settings' && profile ? () => setScreen('dashboard') : null}
          pushToast={pushToast}
        />
      </React.Fragment>
    );
  }

  if (!profile) {
    return (
      <div className="flex h-full items-center justify-center text-gray-400">
        <Spinner className="h-6 w-6" />
      </div>
    );
  }

  return (
    <React.Fragment>
      <Toast toast={toast} onDismiss={dismissToast} />

      {screen === 'session' ? (
        <SessionScreen
          profile={profile}
          topic={topic}
          messages={messages}
          status={status}
          secondsLeft={secondsLeft}
          onToggleMic={toggleMic}
          onEnd={endSession}
          micDisabled={micDisabled}
          vocabCount={sessionVocabRef.current.length}
          mode={mode}
          muted={muted}
          connectionState={connectionState}
        />
      ) : (
        <Dashboard
          profile={profile}
          vocab={vocab}
          vocabLoading={vocabLoading}
          recommendedTopic={recommended.topic}
          recommendedSource={recommended.source}
          stats={stats}
          onStart={startSession}
          onOpenSettings={() => setScreen('settings')}
          onShowLastFeedback={() => setSheetOpen(true)}
          hasLastFeedback={!!feedback}
          onExport={openExport}
          mode={mode}
          onModeChange={changeMode}
          onSuggest={openSuggest}
          language={language}
          onLanguageChange={switchLanguage}
          switchingLanguage={switchingLanguage}
        />
      )}

      {suggestOpen && profile ? (
        <SuggestSheet
          targetLanguage={profile.target_language}
          cefr={profile.current_cefr}
          items={suggestItems}
          busy={suggestBusy}
          note={suggestNote}
          onGenerate={generateSuggestions}
          onAdd={addSelectedPhrases}
          onToggle={toggleSuggestion}
          onAddManual={addManualPhrase}
          onClose={() => setSuggestOpen(false)}
        />
      ) : null}

      {exportOpen && profile ? (
        <ExportSheet
          vocab={vocab}
          targetLanguage={profile.target_language}
          defaultTurkish={profile.target_language !== 'Turkish'}
          busy={exportBusy}
          note={exportNote}
          onExport={runExport}
          onClose={() => setExportOpen(false)}
        />
      ) : null}

      {sheetOpen && feedback ? (
        <FeedbackSheet
          feedback={feedback}
          saving={savingFeedback}
          saveNote={saveNote}
          onClose={() => setSheetOpen(false)}
        />
      ) : null}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
