                    ? 'border-gray-700 bg-gray-800/60 text-gray-500'
                    : 'border-gray-700 text-gray-300')}>
                {p.now ? '✓ ' : ''}{p.phrase}
              </span>
            ))}
          </div>
          <div className="mt-1.5 text-[10px] text-gray-600">Goals are judged after the session from what you said.</div>
        </div>
      ) : null}
    </div>
  );
}

function SessionScreen({
  profile, topic, messages, status, secondsLeft, onToggleMic, onEnd, micDisabled, vocabCount,
  mode, muted, connectionState, stageInfo
}) {
  const isLive = mode === MODE_REALTIME;
  const isRecording = status === 'recording' || status === 'listening';
  const isSpeaking = status === 'speaking';
  const isBusy = status === 'transcribing' || status === 'thinking' || status === 'synthesizing' ||
    status === 'starting' || status === 'analyzing' || status === 'connecting';
  const low = secondsLeft <= 120;

  let buttonClass = 'bg-indigo-600 hover:bg-indigo-500 text-white';
  if (isLive && muted) buttonClass = 'bg-gray-700 text-gray-300';
  else if (isRecording) buttonClass = 'bg-red-600 text-white rec-pulse';
  else if (isSpeaking) buttonClass = 'bg-emerald-600 text-white speak-pulse';
  else if (isBusy) buttonClass = 'bg-gray-700 text-gray-300';

  let statusText = STATUS_COPY[status] || '';
  if (isLive && muted && status !== 'connecting') statusText = STATUS_COPY.muted;
  // In live mode barge-in is handled by voice activity detection, so there is
  // nothing to tap: the learner just talks over the model.
  else if (isLive && status === 'speaking') statusText = 'Speaking — just talk to cut in';

  return (
    <div className="mx-auto flex h-full w-full max-w-md flex-col">
      <header className="flex items-center justify-between border-b border-gray-800 px-5 py-3.5">
        <button onClick={onEnd} disabled={status === 'analyzing'}
          className="no-tap rounded-lg px-2 py-1 text-sm text-gray-400 transition hover:text-white disabled:opacity-40">
          End &amp; Analyze
        </button>
        <div className={'rounded-lg px-3 py-1 font-mono text-sm tabular-nums transition ' + (low
          ? 'bg-red-500/15 text-red-300'
          : 'bg-gray-800 text-gray-300')}>
          {formatClock(secondsLeft)}
        </div>
      </header>

      <div className="border-b border-gray-800 px-5 py-2.5">
        <div className="flex items-center gap-2 truncate text-xs text-gray-500">
          <span className={'inline-flex shrink-0 items-center gap-1 rounded px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide ' + (isLive
            ? 'bg-emerald-500/20 text-emerald-300'
            : 'bg-gray-700/70 text-gray-300')}>
            {isLive ? (
              <span className={'inline-block h-1.5 w-1.5 rounded-full ' + (connectionState === 'connected' ? 'bg-emerald-400' : 'bg-amber-400')} />
            ) : null}
            {isLive ? 'live' : 'turn-based'}
          </span>
          <span className="truncate">
            <span className="text-gray-400">{profile.target_language} · {profile.current_cefr}</span>
            {vocabCount ? <span> · {vocabCount} target phrase{vocabCount === 1 ? '' : 's'} in play</span> : null}
          </span>
        </div>
        <div className="mt-0.5 truncate text-sm text-gray-300" title={topic}>{topic}</div>
      </div>

      <StageStrip stage={stageInfo} messages={messages} language={profile.target_language} />

      <main className="flex-1 overflow-y-auto px-4 py-4">
        <TranscriptView messages={messages} status={status} targetLanguage={profile.target_language} live={isLive} />
      </main>

      <footer className="safe-b border-t border-gray-800 bg-gray-900/80 px-5 pb-6 pt-5 backdrop-blur">
        <div className="flex flex-col items-center gap-3">
          <button onClick={onToggleMic} disabled={micDisabled || (isLive ? status === 'connecting' || status === 'analyzing' : isBusy)}
            className={'no-tap flex h-24 w-24 items-center justify-center rounded-full transition-all duration-200 active:scale-95 disabled:opacity-60 ' + buttonClass}
            aria-label={isLive ? (muted ? 'Unmute microphone' : 'Mute microphone') : (isRecording ? 'Stop recording' : 'Start recording')}>
            {isLive ? (
              status === 'connecting' ? <Spinner className="h-8 w-8" />
                : muted ? <MicOffIcon className="h-9 w-9" />
                : isSpeaking ? (
                  <span className="eq flex h-8 items-center text-white">
                    <span /><span /><span /><span />
                  </span>
                ) : <MicIcon className="h-9 w-9" />
            ) : (
              isBusy ? <Spinner className="h-8 w-8" />
                : isRecording ? <StopIcon className="h-8 w-8" />
                : isSpeaking ? (
                  <span className="eq flex h-8 items-center text-white">
                    <span /><span /><span /><span />
                  </span>
                ) : <MicIcon className="h-9 w-9" />
            )}
          </button>
          <div className={'h-5 text-xs font-medium ' + (isLive && muted ? 'text-gray-400' : isRecording ? 'text-red-400' : isSpeaking ? 'text-emerald-400' : 'text-gray-400')}>
            {statusText}
          </div>
        </div>
      </footer>
    </div>
  );
}

/* --------------------------------------------------------- feedback bottom sheet */

function StageResult({ r }) {
  const goalsLeft = r.checks.filter(c => !c.met).length;
  const phraseSessionsLeft = r.phrases.reduce((n, p) => n + Math.max(0, STAGE_PHRASE_SESSIONS - p.after), 0);
  const gained = r.progressAfter - r.progressBefore;

  return (
    <div className="space-y-4">
      <div className="rounded-xl border border-indigo-500/40 bg-indigo-500/10 p-4">
        <div className="text-[11px] font-semibold uppercase tracking-wider text-indigo-300">
          Stage {r.position}{r.total ? ' of ' + r.total : ''}
        </div>
        <div className="mt-0.5 text-sm font-medium text-white">{r.title}</div>
        <div className="mt-3 flex items-center justify-between text-xs">
          <span className="text-gray-400">{r.progressBefore}% → <span className="font-semibold text-white">{r.progressAfter}%</span></span>
          {gained > 0 ? <span className="font-semibold text-emerald-300">+{gained}% this session</span> : null}
        </div>
        <div className="relative mt-1.5 h-2 w-full overflow-hidden rounded-full bg-gray-700">
          <div className="absolute inset-y-0 left-0 rounded-full bg-emerald-500/70" style={{ width: r.progressAfter + '%' }} />
          <div className="absolute inset-y-0 left-0 rounded-full bg-indigo-500" style={{ width: r.progressBefore + '%' }} />
        </div>
      </div>

      {r.checks.length ? (
        <div>
          <div className="mb-2 text-[11px] font-semibold uppercase tracking-wider text-gray-500">Goals</div>
          <div className="space-y-2">
            {r.checks.map(c => (
              <div key={c.id} className={'rounded-xl border p-3 ' + (c.newly
                ? 'border-emerald-500/50 bg-emerald-500/10'
                : c.met ? 'border-gray-800 bg-gray-800/30' : 'border-gray-800 bg-gray-800/50')}>
                <div className={'flex items-start gap-2 text-sm ' + (c.met ? 'text-emerald-200' : 'text-gray-200')}>
                  <span className="shrink-0">{c.met ? '✓' : '○'}</span>
                  <span className="flex-1">{c.text}</span>
                  {c.newly ? <span className="shrink-0 rounded bg-emerald-500/25 px-1.5 py-0.5 text-[10px] font-semibold uppercase text-emerald-200">new</span> : null}
                </div>
                {c.met && c.evidence ? (
                  <div className="mt-1 pl-5 text-xs italic text-gray-400">“{c.evidence}”</div>
                ) : null}
                {!c.met && c.missing ? (
                  <div className="mt-1 pl-5 text-xs text-gray-400">{c.missing}</div>
                ) : null}
              </div>
            ))}
          </div>
        </div>
      ) : null}

      <div>
        <div className="mb-2 text-[11px] font-semibold uppercase tracking-wider text-gray-500">
          Phrases · each needs {STAGE_PHRASE_SESSIONS} sessions
        </div>
        <div className="space-y-1.5">
          {r.phrases.map(p => (
            <div key={p.phrase} className="flex items-center gap-2 text-sm">
              <span className="flex shrink-0 gap-1">
                {Array.from({ length: STAGE_PHRASE_SESSIONS }).map((_, i) => (
                  <span key={i} className={'h-2 w-2 rounded-full ' + (i < p.before
                    ? 'bg-indigo-400'
                    : i < p.after ? 'bg-emerald-400' : 'bg-gray-700')} />
                ))}
              </span>
              <span className={'truncate ' + (p.ready ? 'text-gray-400' : 'text-gray-200')}>{p.phrase}</span>
              {p.after > p.before ? <span className="shrink-0 text-[11px] font-semibold text-emerald-300">+1</span> : null}
            </div>
          ))}
        </div>
      </div>

      {r.cleared ? (
        <p className="rounded-xl bg-emerald-500/10 p-3 text-center text-sm font-medium text-emerald-200">Stage cleared.</p>
      ) : (
        <p className="text-center text-xs text-gray-500">
          To clear this stage: {goalsLeft ? goalsLeft + ' goal' + (goalsLeft === 1 ? '' : 's') : 'no goals'}
          {' and '}{phraseSessionsLeft ? phraseSessionsLeft + ' more phrase use' + (phraseSessionsLeft === 1 ? '' : 's') + ' in later sessions' : 'no phrases'} left.
        </p>
      )}
    </div>
  );
}

function StageCelebration({ r, onClose }) {
  const islandDone = !r.nextTitle;
  const owned = r.phrases.slice(0, 5);
  return (
    <div className="fixed inset-0 z-[60] flex items-center justify-center p-6">
      <div className="fade-in absolute inset-0 bg-black/75 backdrop-blur-sm" onClick={onClose} />
      <div className="sheet-up relative w-full max-w-sm rounded-3xl border border-emerald-500/40 bg-gray-900 p-6 text-center shadow-2xl">
        <div className="mx-auto mb-3 flex h-16 w-16 items-center justify-center rounded-2xl bg-emerald-500/15 text-emerald-300">
          <LogoMark className="h-9 w-9" />
        </div>
        <div className="text-[11px] font-semibold uppercase tracking-wider text-emerald-300">
          {islandDone ? 'Island complete' : 'Stage ' + r.position + (r.total ? ' of ' + r.total : '') + ' cleared'}
        </div>
        <h2 className="mt-1 text-xl font-semibold tracking-tight text-white">{r.title}</h2>
        <p className="mt-2 text-sm text-gray-400">
          {islandDone
            ? 'Every stage done. This subject is yours now — you can hold it in real conversation.'
            : 'You showed you can do it, and these are yours now:'}
        </p>

        {!islandDone ? (
          <div className="mt-3 space-y-1 text-left">
            {owned.map(p => (
              <div key={p.phrase} className="truncate rounded-lg bg-gray-800/70 px-3 py-1.5 text-sm text-gray-200">
                <span className="mr-1.5 text-emerald-300">✓</span>{p.phrase}
              </div>
            ))}
          </div>
        ) : null}

        {!islandDone ? (
          <div className="mt-4 rounded-xl border border-indigo-500/30 bg-indigo-500/10 p-3 text-left">
            <div className="text-[11px] font-semibold uppercase tracking-wider text-indigo-300">Next up</div>
            <div className="mt-0.5 text-sm text-white">{r.nextTitle}</div>
          </div>
        ) : null}

        <button onClick={onClose}
          className="no-tap mt-5 w-full rounded-xl bg-emerald-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-emerald-500">
          Continue
        </button>
      </div>
    </div>
  );
}

function FeedbackSheet({ feedback, saving, saveNote, onClose }) {
  const [tab, setTab] = useState('grammar');
  const [picked, setPicked] = useState(false);
  const stageResult = feedback ? feedback.stage_result : null;
  // The stage result arrives a moment after the sheet opens; lead with it,
  // unless the learner has already chosen a tab themselves.
  useEffect(() => {
    if (stageResult && !picked) setTab('island');
  }, [stageResult, picked]);
  if (!feedback) return null;

  const mistakes = Array.isArray(feedback.grammar_mistakes) ? feedback.grammar_mistakes : [];
  const phrases = Array.isArray(feedback.recommended_phrases) ? feedback.recommended_phrases : [];
  const words = Array.isArray(feedback.word_gaps) ? feedback.word_gaps : [];

  const tabs = [
    ...(stageResult ? [{ id: 'island', label: 'Island', count: null }] : []),
    { id: 'grammar', label: 'Grammar', count: mistakes.length },
    { id: 'vocab', label: 'New Vocab', count: phrases.length + words.length },
    { id: 'summary', label: 'Summary', count: null }
  ];

  return (
    <div className="fixed inset-0 z-40 flex flex-col justify-end">
      <div className="fade-in absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={onClose} />
      <div className="sheet-up relative flex max-h-[88vh] flex-col rounded-t-3xl border-t border-gray-700 bg-gray-900 shadow-2xl">
        <div className="mx-auto mt-3 h-1.5 w-10 shrink-0 rounded-full bg-gray-700" />

        <div className="mx-auto w-full max-w-md px-5 pt-4">
          <div className="flex items-center justify-between">
            <h2 className="text-lg font-semibold tracking-tight">Session analysis</h2>
            <button onClick={onClose} className="no-tap rounded-lg p-1.5 text-gray-400 transition hover:text-white" aria-label="Close">
              <svg className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                <path d="M18 6 6 18M6 6l12 12" />
              </svg>
            </button>
          </div>

          <div className="mt-2 flex h-5 items-center gap-2 text-xs text-gray-500">
            {saving ? <Spinner className="h-3.5 w-3.5" /> : null}
            <span>{saveNote}</span>
          </div>

          <div className="mt-3 flex gap-1.5 rounded-xl bg-gray-800/70 p-1">
            {tabs.map(t => (
              <button key={t.id} onClick={() => { setTab(t.id); setPicked(true); }}
                className={'no-tap flex-1 rounded-lg px-2 py-2 text-xs font-medium transition ' + (tab === t.id
                  ? 'bg-gray-700 text-white'
                  : 'text-gray-400 hover:text-gray-200')}>
                {t.label}{t.count !== null ? ' (' + t.count + ')' : ''}
              </button>
            ))}
          </div>
        </div>

        <div className="mx-auto w-full max-w-md flex-1 overflow-y-auto px-5 pb-8 pt-4">
          {tab === 'island' && stageResult ? <StageResult r={stageResult} /> : null}

          {tab === 'grammar' ? (
            mistakes.length ? (
              <div className="space-y-3">
                {mistakes.map((m, i) => (
                  <div key={i} className="rounded-xl border border-gray-800 bg-gray-800/50 p-3.5">
                    <div className="text-sm text-red-300 line-through decoration-red-500/50">{m.original}</div>
                    <div className="mt-1.5 text-sm font-medium text-emerald-300">{m.correction}</div>
                    <div className="mt-2 border-t border-gray-700/60 pt-2 text-xs leading-relaxed text-gray-400">
                      {m.explanation}
                    </div>
                  </div>
                ))}
              </div>
            ) : (
              <p className="py-8 text-center text-sm text-gray-500">No grammar mistakes worth flagging. Clean run.</p>
            )
          ) : null}

          {tab === 'vocab' ? (
            (phrases.length || words.length) ? (
              <div className="space-y-3">
                {words.length ? (
                  <div className="text-[11px] font-semibold uppercase tracking-wider text-amber-300">
                    Words you were missing
                  </div>
                ) : null}
                {words.map((w, i) => (
                  <div key={'w' + i} className="rounded-xl border border-amber-500/30 bg-amber-500/5 p-3.5">
                    <div className="flex items-center gap-2">
                      <span className="text-sm font-medium text-white">{w.word}</span>
                      <span className="rounded bg-amber-500/20 px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-amber-300">word</span>
                    </div>
                    <div className="mt-0.5 text-sm text-gray-400">{w.translation}</div>
                    <div className="mt-2 border-t border-gray-700/60 pt-2 text-xs leading-relaxed text-gray-500">
                      You needed it when you said: <span className="italic text-gray-400">"{w.evidence}"</span>
                    </div>
                  </div>
                ))}
                {words.length && phrases.length ? (
                  <div className="pt-1 text-[11px] font-semibold uppercase tracking-wider text-indigo-300">
                    Phrases to start using
                  </div>
                ) : null}
                {phrases.map((p, i) => (
                  <div key={i} className="rounded-xl border border-gray-800 bg-gray-800/50 p-3.5">
                    <div className="text-sm font-medium text-white">{p.phrase}</div>
                    <div className="mt-0.5 text-sm text-gray-400">{p.translation}</div>
                    {p.context ? (
                      <div className="mt-2 border-t border-gray-700/60 pt-2 text-xs leading-relaxed text-gray-500">
                        {p.context}
                      </div>
                    ) : null}
                  </div>
                ))}
                <p className="pt-1 text-center text-xs text-gray-600">
                  Saved to your active vocabulary — your partner will work them into the next session.
                </p>
              </div>
            ) : (
              <p className="py-8 text-center text-sm text-gray-500">No new phrases recommended this time.</p>
            )
          ) : null}

          {tab === 'summary' ? (
            <div className="space-y-4">
              <div className="rounded-xl border border-gray-800 bg-gray-800/50 p-4">
                <div className="mb-1.5 text-[11px] font-semibold uppercase tracking-wider text-indigo-400">
                  Level feedback
                </div>
                <p className="text-sm leading-relaxed text-gray-300">{feedback.cefr_level_feedback || '—'}</p>
              </div>
              <div className="rounded-xl border border-gray-800 bg-gray-800/50 p-4">
                <div className="mb-1.5 text-[11px] font-semibold uppercase tracking-wider text-emerald-400">
                  Next session topic
                </div>
                <p className="text-sm leading-relaxed text-gray-300">{feedback.next_topic_recommendation || '—'}</p>
              </div>
              {Array.isArray(feedback.mastered_now) && feedback.mastered_now.length ? (
                <div className="rounded-xl border border-emerald-800/50 bg-emerald-500/10 p-4">
                  <div className="mb-1.5 text-[11px] font-semibold uppercase tracking-wider text-emerald-400">
                    Mastered this session
                  </div>
                  <p className="text-sm leading-relaxed text-emerald-200">{feedback.mastered_now.join(' · ')}</p>
                </div>
              ) : null}
            </div>
          ) : null}
        </div>

        <div className="safe-b mx-auto w-full max-w-md border-t border-gray-800 px-5 py-4">
          <button onClick={onClose}
            className="no-tap w-full rounded-xl bg-indigo-600 px-4 py-3.5 text-sm font-semibold text-white transition hover:bg-indigo-500">
            Back to dashboard
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- App */

function App() {
  const [config, setConfig] = useState(loadConfig);
  const [client, setClient] = useState(null);
  const [profile, setProfile] = useState(null);
  const [language, setLanguage] = useState(() => {
    const cfg = loadConfig();
    return (cfg && cfg.targetLanguage) || 'German';
  });
  const [learners, setLearners] = useState([]);
  const [learnerId, setLearnerId] = useState(() => {
    const cfg = loadConfig();
    return (cfg && cfg.learnerId) || DEFAULT_USER;
  });
  const [profilesOpen, setProfilesOpen] = useState(false);
  const [profilesBusy, setProfilesBusy] = useState(false);
  const [island, setIsland] = useState(null);
  const [celebration, setCelebration] = useState(null);
  const [stages, setStages] = useState([]);
  const [islandOpen, setIslandOpen] = useState(false);
  const [islandBusy, setIslandBusy] = useState(false);
  const [islandNote, setIslandNote] = useState('');
  const [srsSets, setSrsSets] = useState([]);
  const [srsReviews, setSrsReviews] = useState(() => new Map());
  const [srsIntroducedToday, setSrsIntroducedToday] = useState(0);
  const [srsRevlog, setSrsRevlog] = useState([]);
  const [srsLoading, setSrsLoading] = useState(false);
  const [studyOpen, setStudyOpen] = useState(false);
  const [forgeOpen, setForgeOpen] = useState(false);
  const [forgeBusy, setForgeBusy] = useState(false);
  const [forgeProgress, setForgeProgress] = useState('');
  const [newPerDay, setNewPerDay] = useState(() => {
    const cfg = loadConfig();
    const n = cfg && cfg.newPerDay;
    return Number.isFinite(n) ? n : DEFAULT_NEW_PER_DAY;
  });
  const [resetBusy, setResetBusy] = useState(false);
  const [statsOpen, setStatsOpen] = useState(false);
  const [statsLoading, setStatsLoading] = useState(false);
  const [dailyStats, setDailyStats] = useState(null);
  const [switchingLanguage, setSwitchingLanguage] = useState(false);
  const [screen, setScreen] = useState(loadConfig() ? 'loading' : 'setup');
  const [toast, setToast] = useState(null);

  const [vocab, setVocab] = useState([]);
  const [allVocab, setAllVocab] = useState([]);
  const [vocabLoading, setVocabLoading] = useState(true);
  const [stats, setStats] = useState({ sessions: 0, mastered: 0 });
  const [recommended, setRecommended] = useState({ topic: FALLBACK_TOPICS[0], source: 'starter' });

  const [topic, setTopic] = useState('');
  const [mode, setMode] = useState(() => {
    const cfg = loadConfig();
    return cfg && cfg.conversationMode === MODE_REALTIME ? MODE_REALTIME : MODE_TURN;
  });
  const [messages, setMessages] = useState([]);
  const [status, setStatus] = useState('idle');
  const [muted, setMuted] = useState(false);
  const [connectionState, setConnectionState] = useState('');
  const [secondsLeft, setSecondsLeft] = useState(SESSION_SECONDS);
  const [micDisabled, setMicDisabled] = useState(false);

  const [feedback, setFeedback] = useState(null);
  const [sheetOpen, setSheetOpen] = useState(false);
  const [suggestOpen, setSuggestOpen] = useState(false);
  const [suggestBusy, setSuggestBusy] = useState(false);
  const [suggestNote, setSuggestNote] = useState('');
  const [suggestItems, setSuggestItems] = useState([]);
  const [exportOpen, setExportOpen] = useState(false);
  const [exportBusy, setExportBusy] = useState(false);
  const [exportNote, setExportNote] = useState('');
  const [savingFeedback, setSavingFeedback] = useState(false);
  const [saveNote, setSaveNote] = useState('');

  // Refs that must not trigger re-renders.
  const audioRef = useRef(null);
  const audioUrlRef = useRef(null);
  const recorderRef = useRef(null);
  const recordStartRef = useRef(0);
  const streamRef = useRef(null);
  const chunksRef = useRef([]);
  const messagesRef = useRef([]);
  const sessionVocabRef = useRef([]);
  const sessionStageRef = useRef(null);
  const sessionMemoryRef = useRef(null);
  const sessionAllVocabRef = useRef([]);
  const sessionLengthRef = useRef(SESSION_SECONDS);
  const checksInFlight = useRef(new Set());
  const endingRef = useRef(false);
  const statusRef = useRef('idle');
  const turkishCacheRef = useRef(new Map());
  const realtimeRef = useRef(null);
  const realtimeDcRef = useRef(null);
  const realtimeItemsRef = useRef([]);
  const transcriberFallbackRef = useRef(false);
  const modeRef = useRef(MODE_TURN);
  const languageRef = useRef('German');
  const learnerRef = useRef(DEFAULT_USER);

  useEffect(() => { messagesRef.current = messages; }, [messages]);
  useEffect(() => { statusRef.current = status; }, [status]);
  useEffect(() => { modeRef.current = mode; }, [mode]);
  useEffect(() => { languageRef.current = language; }, [language]);
  useEffect(() => { learnerRef.current = learnerId; }, [learnerId]);

  const changeMode = useCallback((next) => {
    setMode(next);
    const cfg = loadConfig();
    if (cfg) saveConfig(Object.assign({}, cfg, { conversationMode: next }));
  }, []);

  const pushToast = useCallback((type, message) => {
    setToast({ type: type, message: message });
  }, []);
  const dismissToast = useCallback(() => setToast(null), []);

  /* ------------------------------------------------------------ audio utils */

  const stopPlayback = useCallback(() => {
    if (audioRef.current) {
      audioRef.current.pause();
      audioRef.current.currentTime = 0;
    }
    if (audioUrlRef.current) {
      URL.revokeObjectURL(audioUrlRef.current);
      audioUrlRef.current = null;
    }
  }, []);

  const releaseMic = useCallback(() => {
    if (streamRef.current) {
      streamRef.current.getTracks().forEach(t => t.stop());
      streamRef.current = null;
    }
    recorderRef.current = null;
    chunksRef.current = [];
  }, []);

  const playAudioBlob = useCallback(async (blob) => {
    stopPlayback();
    const url = URL.createObjectURL(blob);
    audioUrlRef.current = url;
    if (!audioRef.current) audioRef.current = new Audio();
    const audio = audioRef.current;
    audio.src = url;
    audio.onended = () => {
      if (statusRef.current === 'speaking') setStatus('idle');
    };
    audio.onerror = () => {
      if (statusRef.current === 'speaking') setStatus('idle');
    };
    setStatus('speaking');
    try {
      await audio.play();
    } catch (err) {
      // Autoplay blocked or interrupted by the user tapping the mic.
      if (statusRef.current === 'speaking') setStatus('idle');
    }
  }, [stopPlayback]);

  /* --------------------------------------------------------- data fetching */

  const refreshVocab = useCallback(async (c, languageOverride, learnerOverride) => {
    const db = c || client;
    const lang = languageOverride || languageRef.current;
    const who = learnerOverride || learnerRef.current;
    if (!db || !lang || !who) return [];
    setVocabLoading(true);
    try {
      // Fetch every status: the vocabulary bar wants the 'learning' ones, but the
      // island gate has to see mastered phrases too, or clearing a stage becomes
      // impossible the moment its phrases graduate.
      const res = await scoped(db.from('target_vocabulary').select('*'), who, lang)
        .order('created_at', { ascending: true });
      if (res.error) throw new Error(missingLanguageColumn(res.error) ? MIGRATION_HINT : res.error.message);
      const all = res.data || [];
      const rows = all.filter(r => r.status === 'learning');
      setAllVocab(all);
      setVocab(rows);
      return all;
    } catch (err) {
      pushToast('error', 'Could not load vocabulary: ' + err.message);
      return [];
    } finally {
      setVocabLoading(false);
    }
  }, [client, pushToast]);

  const refreshStats = useCallback(async (c, languageOverride, learnerOverride) => {
    const db = c || client;
    const lang = languageOverride || languageRef.current;
    const who = learnerOverride || learnerRef.current;
    if (!db || !lang || !who) return;
    try {
      const [sessionsRes, masteredRes] = await Promise.all([
        scoped(db.from('conversations').select('id', { count: 'exact', head: true }), who, lang),
        scoped(db.from('target_vocabulary').select('id', { count: 'exact', head: true }), who, lang).eq('status', 'mastered')
      ]);
      setStats({
        sessions: sessionsRes.count || 0,
        mastered: masteredRes.count || 0
      });
    } catch (err) {
      console.warn('stats failed', err);
    }
  }, [client]);

  const refreshRecommendedTopic = useCallback(async (c, vocabRows, languageOverride, learnerOverride) => {
    const db = c || client;
    const lang = languageOverride || languageRef.current;
    const who = learnerOverride || learnerRef.current;
    if (!db || !lang || !who) return;
    try {
      const res = await scoped(db.from('conversations').select('feedback, topic, created_at'), who, lang)
        .order('created_at', { ascending: false })
        .limit(1);
      if (res.error) throw new Error(res.error.message);

      const last = (res.data || [])[0];
      const fromFeedback = last && last.feedback && last.feedback.next_topic_recommendation;
      if (fromFeedback) {
        setRecommended({ topic: fromFeedback, source: 'from last session' });
        return;
      }

      const rows = vocabRows || vocab;
      if (rows && rows.length) {
        const learning = rows.filter(r => r.status === 'learning');
        if (!learning.length) {
          const idx = new Date().getDate() % FALLBACK_TOPICS.length;
          setRecommended({ topic: FALLBACK_TOPICS[idx], source: 'starter' });
          return;
        }
        const picks = learning.slice(0, 3).map(v => '"' + v.phrase + '"').join(', ');
        setRecommended({
          topic: 'A conversation where you naturally need ' + picks + '.',
          source: 'from your active vocabulary'
        });
        return;
      }

      const idx = new Date().getDate() % FALLBACK_TOPICS.length;
      setRecommended({ topic: FALLBACK_TOPICS[idx], source: 'starter' });
    } catch (err) {
      console.warn('topic recommendation failed', err);
      const idx = new Date().getDate() % FALLBACK_TOPICS.length;
      setRecommended({ topic: FALLBACK_TOPICS[idx], source: 'starter' });
    }
  }, [client, vocab]);

  /* -------------------------------------------------------------- daily stats */

  const refreshDailyStats = useCallback(async (c, languageOverride, learnerOverride) => {
    const db = c || client;
    const lang = languageOverride || languageRef.current;
    const who = learnerOverride || learnerRef.current;
    if (!db || !lang || !who) return;

    setStatsLoading(true);
    try {
      const [convRes, vocabRes] = await Promise.all([
        scoped(db.from('conversations').select('created_at, duration_seconds'), who, lang),
        scoped(db.from('target_vocabulary').select('created_at, status, mastered_at'), who, lang)
      ]);
      if (convRes.error) throw new Error(convRes.error.message);
      if (vocabRes.error) throw new Error(vocabRes.error.message);
      setDailyStats(buildDailyStats(convRes.data || [], vocabRes.data || [], 14));
    } catch (err) {
      console.error(err);
      pushToast('error', 'Could not load progress: ' + err.message);
    } finally {
      setStatsLoading(false);
    }
  }, [client, pushToast]);

  const openStats = useCallback(() => {
    setStatsOpen(true);
    refreshDailyStats();
  }, [refreshDailyStats]);

  /* ------------------------------------------------------------ language islands */

  const refreshIsland = useCallback(async (c, languageOverride, learnerOverride) => {
    const db = c || client;
    const lang = languageOverride || languageRef.current;
    const who = learnerOverride || learnerRef.current;
    if (!db || !lang || !who) return null;

    try {
      const isl = await scoped(db.from('islands').select('*'), who, lang)
        .eq('status', 'active')
        .maybeSingle();
      if (isl.error) throw new Error(isl.error.message);

      if (!isl.data) {
        setIsland(null);
        setStages([]);
        return null;
      }

      const st = await db
        .from('island_stages')
        .select('*')
        .eq('island_id', isl.data.id)
        .order('position', { ascending: true });
      if (st.error) throw new Error(st.error.message);

      setIsland(isl.data);
      setStages(st.data || []);

      return { island: isl.data, stages: st.data || [] };
    } catch (err) {
      console.error(err);
      if (missingIslandTables(err)) {
        pushToast('error', 'The island tables are missing. Run the latest migration, then reload.');
      } else {
        pushToast('error', 'Could not load your island: ' + err.message);
      }
      return null;
    }
  }, [client, pushToast]);

  const currentStage = useMemo(
    () => stages.find(s => s.status === 'current') || null,
    [stages]
  );

  // Stages planned before checks existed, or just promoted, get their
  // objective turned into concrete checks the first time they are current.
  // Runs as an effect so it only fires once the profile is actually loaded.
  useEffect(() => {
    const current = currentStage;
    if (!current || !client || !config || !config.openaiKey || !profile) return;
    if (Array.isArray(current.checks) && current.checks.length) return;
    if (checksInFlight.current.has(current.id)) return;

    checksInFlight.current.add(current.id);
    generateStageChecks(config.openaiKey, profile, current)
      .then(async checks => {
        const upd = await client.from('island_stages').update({ checks: checks }).eq('id', current.id);
        if (upd.error) throw new Error(upd.error.message);
        setStages(prev => prev.map(x => (x.id === current.id ? Object.assign({}, x, { checks: checks }) : x)));
      })
      .catch(err => console.warn('Could not generate stage checks; the stage keeps its single verdict', err))
      .finally(() => checksInFlight.current.delete(current.id));
  }, [currentStage, client, config, profile]);

  // Phrases enter the vocabulary when their stage becomes current, so the SRS
  // queue only ever holds what the learner is actually working on.
  const seedStagePhrases = useCallback(async (stage) => {
    if (!client || !stage || stage.seeded) return;
    const phrases = Array.isArray(stage.phrases) ? stage.phrases : [];
    if (!phrases.length) return;

    try {
      const lang = languageRef.current;
      const existing = await scoped(
        client.from('target_vocabulary').select('phrase, kind'), learnerRef.current, lang
      );
      if (existing.error) throw new Error(existing.error.message);
      const known = new Set((existing.data || []).map(r => vocabKey(r.phrase, r.kind, lang)));

      const rows = phrases
        .filter(p => !known.has(vocabKey(p.phrase, p.kind, lang)))
        .map(p => ({
          user_id: learnerRef.current,
          target_language: lang,
          phrase: p.phrase,
          kind: p.kind || detectKind(p.phrase, lang),
          translation: p.translation || null,
          correction_context: p.note || null,
          times_reviewed: 0,
          status: 'learning'
        }));

      if (rows.length) {
        const ins = await client.from('target_vocabulary').insert(rows);
        if (ins.error) throw new Error(ins.error.message);
      }
      const upd = await client.from('island_stages').update({ seeded: true }).eq('id', stage.id);
      if (upd.error) throw new Error(upd.error.message);
    } catch (err) {
      console.error(err);
      pushToast('error', 'Could not add the stage phrases: ' + err.message);
    }
  }, [client, pushToast]);

  const createIsland = useCallback(async (name, aboutYou) => {
    if (!client || !profile || !name.trim()) return;

    setIslandBusy(true);
    setIslandNote('Designing your roadmap — this takes a moment…');
    try {
      // Feed the planner what the learner actually gets wrong, when we know it.
      const recent = await scoped(
        client.from('conversations').select('feedback, created_at'), learnerRef.current, languageRef.current
      ).order('created_at', { ascending: false }).limit(5);
      const weakSpots = [];
      ((recent.data) || []).forEach(row => {
        const fb = row.feedback;
        if (fb && Array.isArray(fb.grammar_mistakes)) {
          fb.grammar_mistakes.slice(0, 3).forEach(m => {
            if (m && m.explanation) weakSpots.push(m.explanation);
          });
        }
      });

      const plan = await generateIslandRoadmap(
        config.openaiKey, profile, name.trim(), aboutYou, weakSpots.slice(0, 8)
      );

      const insIsland = await client.from('islands').insert({
        user_id: learnerRef.current,
        target_language: languageRef.current,
        name: name.trim(),
        goal: plan.goal,
        about_you: (aboutYou || '').trim() || null,
        status: 'active'
      }).select().single();
      if (insIsland.error) throw new Error(insIsland.error.message);

      const rows = plan.stages.map(st => ({
        island_id: insIsland.data.id,
        user_id: learnerRef.current,
        target_language: languageRef.current,
        position: st.position,
        title: st.title,
        objective: st.objective,
        scenario: st.scenario,
        structures: st.structures,
        phrases: st.phrases,
        done_when: st.done_when,
        recycles_from: st.recycles_from,
        status: st.position === 1 ? 'current' : 'locked'
      }));

      const insStages = await client.from('island_stages').insert(rows).select();
      if (insStages.error) throw new Error(insStages.error.message);

      const first = (insStages.data || []).find(r => r.position === 1);
      if (first) await seedStagePhrases(first);

      setIslandNote('');
      pushToast('success', 'Island ready: ' + plan.stages.length + ' stages mapped out.');
      await refreshIsland(client);
      await refreshVocab(client);
      setIslandOpen(false);
    } catch (err) {
      console.error(err);
      setIslandNote('');
      pushToast('error', 'Could not design the island: ' + (err.message || String(err)));
    } finally {
      setIslandBusy(false);
    }
  }, [client, profile, config, seedStagePhrases, refreshIsland, refreshVocab, pushToast]);

  const advanceStageRef = useRef(async () => {});

  const advanceStage = useCallback(async (stage, opts) => {
    if (!client || !stage) return;
    const forced = opts && opts.force;

    setIslandBusy(true);
    try {
      const done = await client.from('island_stages').update({
        status: 'done',
        completed_at: new Date().toISOString()
      }).eq('id', stage.id);
      if (done.error) throw new Error(done.error.message);

      const next = stages.find(s => s.position === stage.position + 1);
      if (next) {
        const upd = await client.from('island_stages').update({ status: 'current' }).eq('id', next.id);
        if (upd.error) throw new Error(upd.error.message);
        await seedStagePhrases(next);
        if (!(opts && opts.silent)) {
          pushToast('success', (forced ? 'Skipped to' : 'Stage cleared. Next up:') + ' ' + next.title + '.');
        }
      } else {
        const fin = await client.from('islands').update({ status: 'done' }).eq('id', stage.island_id);
        if (fin.error) throw new Error(fin.error.message);
        if (!(opts && opts.silent)) pushToast('success', 'Island complete. That subject is yours now.');
      }

      await refreshIsland(client);
      await refreshVocab(client);
    } catch (err) {
      console.error(err);
      pushToast('error', 'Could not advance the stage: ' + err.message);
    } finally {
      setIslandBusy(false);
    }
  }, [client, stages, seedStagePhrases, refreshIsland, refreshVocab, pushToast]);

  useEffect(() => { advanceStageRef.current = advanceStage; }, [advanceStage]);

  const archiveIsland = useCallback(async () => {
    if (!client || !island) return;
    setIslandBusy(true);
    try {
      const upd = await client.from('islands').update({ status: 'archived' }).eq('id', island.id);
      if (upd.error) throw new Error(upd.error.message);
      setIsland(null);
      setStages([]);
      pushToast('success', 'Island archived. Your phrases and history stay put.');
      await refreshIsland(client);
    } catch (err) {
      console.error(err);
      pushToast('error', 'Could not archive: ' + err.message);
    } finally {
      setIslandBusy(false);
    }
  }, [client, island, refreshIsland, pushToast]);

  /* -------------------------------------------------------- spaced repetition */

  // Card sets are fetched without their audio: the queue only needs the text,
  // and six base64 mp3s per set would make the dashboard load enormous.
  const refreshSrs = useCallback(async (c, languageOverride, learnerOverride) => {
    const db = c || client;
    const lang = languageOverride || languageRef.current;
    const who = learnerOverride || learnerRef.current;
    if (!db || !lang || !who) return;

    setSrsLoading(true);
    try {
      const [setsRes, reviewsRes, logRes] = await Promise.all([
        scoped(db.from('vocab_sets').select('id, vocab_id, phrase, data, created_at'), who, lang)
          .order('created_at', { ascending: true }),
        scoped(db.from('srs_reviews').select('*'), who, lang),
        scoped(db.from('srs_revlog').select('card_id, rating, state, ivl, deck, was_new, at'), who, lang)
          .order('at', { ascending: false })
      ]);
      if (setsRes.error) throw new Error(setsRes.error.message);
      if (reviewsRes.error) throw new Error(reviewsRes.error.message);
      if (logRes.error) throw new Error(logRes.error.message);

      setSrsSets(setsRes.data || []);

      const map = new Map();
      (reviewsRes.data || []).forEach(r => map.set(r.card_id, r));
      setSrsReviews(map);

      const log = logRes.data || [];
      setSrsRevlog(log);

      const today = dayKey(new Date());
      setSrsIntroducedToday(log.filter(r => r.was_new && dayKey(r.at) === today).length);
    } catch (err) {
      console.error(err);
      if (missingSrsTables(err)) {
        pushToast('error', 'The flashcard tables are missing. Run the SRS migration, then reload.');
      } else {
        pushToast('error', 'Could not load flashcards: ' + err.message);
      }
    } finally {
      setSrsLoading(false);
    }
  }, [client, pushToast]);

  const remainingNew = Math.max(0, newPerDay - srsIntroducedToday);

  // Card maturity mirrors Anki's buckets: young is under 21 days, mature above.
  const srsSummary = useMemo(() => {
    const today = dayKey(new Date());
    const todayLogs = srsRevlog.filter(r => dayKey(r.at) === today);
    const again = todayLogs.filter(r => r.rating === 'again').length;
    const maturity = { fresh: 0, learning: 0, young: 0, mature: 0, total: 0 };

    allCards(srsSets).forEach(c => {
      const r = srsReviews.get(c.cardId);
      maturity.total += 1;
      if (!r || r.state === 'new') maturity.fresh += 1;
      else if (r.state === 'learning' || r.state === 'relearning') maturity.learning += 1;
      else if ((r.ivl || 0) < 21) maturity.young += 1;
      else maturity.mature += 1;
    });

    return {
      reviewsToday: todayLogs.length,
      accuracyToday: todayLogs.length ? Math.round((1 - again / todayLogs.length) * 100) : 0,
      totalReviews: srsRevlog.length,
      sets: srsSets.length,
      maturity: maturity
    };
  }, [srsRevlog, srsSets, srsReviews]);
  const srsCounts = useMemo(
    () => dueCounts(srsSets, srsReviews, remainingNew),
    [srsSets, srsReviews, remainingNew]
  );

  // Phrases that have no card set yet — the candidates for forging.
  const unforged = useMemo(() => {
    const done = new Set(srsSets.map(s => s.vocab_id).filter(Boolean));
    return vocab.filter(v => !done.has(v.id));
  }, [vocab, srsSets]);

  const changeNewPerDay = useCallback((value) => {
    const n = Math.max(0, Math.min(999, parseInt(value, 10) || 0));
    setNewPerDay(n);
    const cfg = loadConfig();
    if (cfg) saveConfig(Object.assign({}, cfg, { newPerDay: n }));
  }, []);

  // Forge = generate six sentences, then one mp3 per sentence, then store both.
  const forgePhrases = useCallback(async (rows) => {
    if (!client || !rows.length) return;

    setForgeBusy(true);
    const lang = languageRef.current;
    const who = learnerRef.current;
    const voice = (config.voice || 'alloy');
    let made = 0;
    const failures = [];

    try {
      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const label = '(' + (i + 1) + '/' + rows.length + ') ' + row.phrase;
        try {
          setForgeProgress(label + ' — writing sentences…');
          const data = await generateSentences(config.openaiKey, row.phrase, 'English', lang);

          const audio = [];
          for (let j = 0; j < data.sentences.length; j++) {
            setForgeProgress(label + ' — recording audio (' + (j + 1) + '/' + data.sentences.length + ')…');
            const blob = await synthesizeSpeech(config.openaiKey, data.sentences[j].target, voice);
            audio.push(base64FromArrayBuffer(await blob.arrayBuffer()));
          }

          const ins = await client.from('vocab_sets').insert({
            user_id: who,
            target_language: lang,
            vocab_id: row.id,
            phrase: row.phrase,
            voice: voice,
            data: data,
            audio: audio
          });
          if (ins.error) throw new Error(ins.error.message);
          made += 1;
        } catch (err) {
          console.error('Forge failed for ' + row.phrase, err);
          failures.push(row.phrase);
        }
      }

      if (made) pushToast('success', 'Forged ' + made + ' phrase' + (made === 1 ? '' : 's') + ' into cards.');
      if (failures.length) {
        pushToast('error', 'Could not forge: ' + failures.slice(0, 3).join(', ') +
          (failures.length > 3 ? ' and ' + (failures.length - 3) + ' more' : '') + '.');
      }
      await refreshSrs(client, lang, who);
    } finally {
      setForgeBusy(false);
      setForgeProgress('');
    }
  }, [client, config, pushToast, refreshSrs]);

  // Audio lives in its own column so the queue stays light; pull it per set.
  const loadSetAudio = useCallback(async (setId) => {
    if (!client) return null;
    const res = await client.from('vocab_sets').select('audio').eq('id', setId).maybeSingle();
    if (res.error) throw new Error(res.error.message);
    return res.data ? res.data.audio : null;
  }, [client]);

  const recordAnswer = useCallback(async (card, rating) => {
    if (!client) return null;
    const wasNew = !card.rev || card.rev.state === 'new';
    const updated = applyRating(card.rev, rating);
    updated.user_id = learnerRef.current;
    updated.target_language = languageRef.current;

    setSrsReviews(prev => {
      const next = new Map(prev);
      next.set(updated.card_id, updated);
      return next;
    });
    if (wasNew) setSrsIntroducedToday(n => n + 1);

    try {
      const up = await client.from('srs_reviews').upsert(updated, { onConflict: 'card_id' });
      if (up.error) throw new Error(up.error.message);

      const entry = {
        user_id: learnerRef.current,
        target_language: languageRef.current,
        card_id: updated.card_id,
        set_id: card.set.id,
        deck: card.deck,
        rating: rating,
        state: updated.state,
        ivl: updated.ivl,
        was_new: wasNew,
        at: new Date().toISOString()
      };
      const log = await client.from('srs_revlog').insert(entry);
      if (log.error) throw new Error(log.error.message);
      setSrsRevlog(prev => [entry].concat(prev));
    } catch (err) {
      console.error(err);
      pushToast('error', 'Answer not saved: ' + err.message);
    }
    return updated;
  }, [client, pushToast]);

  /* ------------------------------------------------------------ boot / init */

  useEffect(() => {
    let cancelled = false;

    async function boot() {
      const cfg = config;
      if (!cfg) { setScreen('setup'); return; }

      try {
        const db = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
        if (cancelled) return;
        setClient(db);

        const learnerRows = await ensureLearner(db);
        if (cancelled) return;
        setLearners(learnerRows);

        const wanted = cfg.learnerId || DEFAULT_USER;
        const activeLearner = learnerRows.some(l => l.id === wanted) ? wanted : learnerRows[0].id;
        learnerRef.current = activeLearner;
        setLearnerId(activeLearner);

        const activeLanguage = cfg.targetLanguage || 'German';
        languageRef.current = activeLanguage;
        setLanguage(activeLanguage);

        const row = await loadOrCreateProfile(db, activeLearner, activeLanguage, null);
        if (cancelled) return;
        setProfile(row);
        setScreen('dashboard');

        const rows = await refreshVocab(db, activeLanguage, activeLearner);
        if (cancelled) return;
        await Promise.all([
          refreshStats(db, activeLanguage, activeLearner),
          refreshRecommendedTopic(db, rows, activeLanguage, activeLearner),
          refreshDailyStats(db, activeLanguage, activeLearner),
          refreshSrs(db, activeLanguage, activeLearner),
          refreshIsland(db, activeLanguage, activeLearner)
        ]);
      } catch (err) {
        if (cancelled) return;
        console.error(err);
        pushToast('error', (missingLanguageColumn(err) || missingLearnersTable(err))
          ? MIGRATION_HINT
          : 'Connection failed: ' + err.message + ' — check your settings.');
        setScreen('setup');
      }
    }

    if (config && !client) boot();
    else if (!config) setScreen('setup');

    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [config]);

  /* ------------------------------------------------------------ the timer */

  useEffect(() => {
    if (screen !== 'session') return undefined;
    const id = setInterval(() => {
      setSecondsLeft(prev => {
        if (prev <= 1) {
          clearInterval(id);
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [screen]);

  useEffect(() => {
    if (screen === 'session' && secondsLeft === 0 && !endingRef.current) {
      pushToast('info', "Time's up — analysing your session.");
      endSession();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [secondsLeft, screen]);

  /* ------------------------------------------------------- realtime session */

  const teardownRealtime = useCallback(() => {
    if (realtimeRef.current) {
      try { realtimeRef.current.close(); } catch (e) { /* noop */ }
      realtimeRef.current = null;
    }
    realtimeDcRef.current = null;
  }, []);

  // Items are tracked by their server-side id so the transcript keeps the order
  // the conversation actually happened in, even though a user transcription can
  // land after the reply it triggered.
  const syncRealtimeTranscript = useCallback(() => {
    const rows = realtimeItemsRef.current
      .filter(it => it.content && it.content.trim())
      .map(it => ({ role: it.role, content: it.content.trim() }));
    messagesRef.current = rows;
    setMessages(rows);
  }, []);

  const upsertRealtimeItem = useCallback((id, role, content) => {
    if (!id) return;
    const items = realtimeItemsRef.current;
    let item = items.find(it => it.id === id);
    if (!item) {
      item = { id: id, role: role || 'assistant', content: '' };
      items.push(item);
    }
    if (role) item.role = role;
    if (typeof content === 'string') item.content = content;
    syncRealtimeTranscript();
  }, [syncRealtimeTranscript]);

  const handleRealtimeEvent = useCallback((event) => {
    if (!event || !event.type) return;

    switch (event.type) {
      // Establishes ordering as soon as the server creates the item.
      case 'conversation.item.added':
      case 'conversation.item.created': {
        const item = event.item;
        if (item && item.id && (item.role === 'user' || item.role === 'assistant')) {
          upsertRealtimeItem(item.id, item.role, undefined);
        }
        break;
      }

      case 'conversation.item.input_audio_transcription.completed':
        upsertRealtimeItem(event.item_id, 'user', event.transcript || '');
        // The session's transcriber reports its own bill, as tokens or as a duration.
        if (event.usage) recordSpend('transcription', costOfTranscriptionUsage(event.usage, 0));
        break;

      case 'conversation.item.input_audio_transcription.failed':
        console.warn('Transcription failed', event);
        break;

      // Event name differs between the preview and GA surfaces; accept both.
      case 'response.output_audio_transcript.done':
      case 'response.audio_transcript.done':
        upsertRealtimeItem(event.item_id, 'assistant', event.transcript || '');
        break;

      case 'input_audio_buffer.speech_started':
        setStatus('listening');
        break;

      case 'input_audio_buffer.speech_stopped':
        if (statusRef.current === 'listening') setStatus('live');
        break;

      case 'response.created':
        setStatus('speaking');
        break;

      case 'response.done':
        if (statusRef.current === 'speaking') setStatus('live');
        recordSpend('realtime', costOfRealtimeResponse(event.response && event.response.usage));
        break;

      case 'error': {
        const msg = event.error && event.error.message ? event.error.message : 'Realtime error.';
        console.error('Realtime error', event);
        // If the call cannot use the verbatim transcriber, it would carry on
        // with no transcript at all and leave nothing to analyse. Drop back to
        // whisper-1 once, keeping the call alive.
        const dc = realtimeDcRef.current;
        if (dc && !transcriberFallbackRef.current && /transcri|gpt-4o-transcribe/i.test(msg)) {
          transcriberFallbackRef.current = true;
          try {
            dc.send(JSON.stringify({
              type: 'session.update',
              session: {
                type: 'realtime',
                audio: { input: { transcription: {
                  model: TRANSCRIBE_FALLBACK, language: langCode(languageRef.current)
                } } }
              }
            }));
            console.warn('Realtime transcription fell back to ' + TRANSCRIBE_FALLBACK);
          } catch (e) { /* the toast below still tells the learner */ }
          break;
        }
        pushToast('error', msg);
        break;
      }

      default:
        break;
    }
  }, [upsertRealtimeItem, pushToast]);

  const startRealtimeSession = useCallback(async (chosenTopic) => {
    const sessionConfig = buildRealtimeSession(
      profile, chosenTopic, sessionVocabRef.current, config.voice, sessionStageRef.current, sessionMemoryRef.current
    );

    try {
      const conn = await connectRealtime(config.openaiKey, sessionConfig, {
        onOpen: (dc) => {
          realtimeDcRef.current = dc;
          // Re-send the config on the channel: it is the only path that applies
          // when the connection was made with the raw key rather than a secret.
          dc.send(JSON.stringify({ type: 'session.update', session: sessionConfig }));
          // No per-response instructions here. In the Realtime API they REPLACE
          // the session instructions for that response, which is how the opener
          // used to lose the topic, the level and the language rules and fall
          // back to asking what the learner wanted to talk about. The session
          // prompt already carries the opening-turn rules, so just trigger it.
          dc.send(JSON.stringify({ type: 'response.create' }));
          setStatus('live');
        },
        onEvent: handleRealtimeEvent,
        onConnectionState: (state) => {
          setConnectionState(state);
          if (state === 'failed' || state === 'disconnected') {
            pushToast('error', 'The realtime connection dropped. End the session to save what you have.');
            setStatus('live');
          }
        }
      });

      realtimeRef.current = conn;
      setMuted(false);
    } catch (err) {
      console.error(err);
      teardownRealtime();
      pushToast('error', 'Could not start realtime: ' + (err.message || String(err)));
      setScreen('dashboard');
      setStatus('idle');
    }
  }, [profile, config, handleRealtimeEvent, teardownRealtime, pushToast]);

  const toggleMute = useCallback(() => {
    const conn = realtimeRef.current;
    if (!conn || !conn.micStream) return;
    const next = !muted;
    conn.micStream.getAudioTracks().forEach(t => { t.enabled = !next; });
    setMuted(next);
  }, [muted]);

  useEffect(() => {
    return () => {
      stopPlayback();
      releaseMic();
      teardownRealtime();
    };
  }, [stopPlayback, releaseMic, teardownRealtime]);

  /* --------------------------------------------------------- session start */

  const startSession = useCallback(async (chosenTopic, opts) => {
    if (!chosenTopic || !profile) return;
    const focus = !!(opts && opts.focus);

    endingRef.current = false;
    setTopic(chosenTopic);
    setMessages([]);
    messagesRef.current = [];
    sessionLengthRef.current = focus ? FOCUS_SESSION_SECONDS : SESSION_SECONDS;
    setSecondsLeft(sessionLengthRef.current);
    setFeedback(null);
    setSheetOpen(false);
    setMicDisabled(false);
    sessionVocabRef.current = vocab.slice();
    sessionAllVocabRef.current = allVocab.slice();
    // A focused session carries exactly what is still missing, so the partner
    // can aim at it instead of replaying the whole stage.
    sessionStageRef.current = currentStage
      ? Object.assign({}, currentStage, focus ? { focus: stageGate(currentStage, allVocab) } : {})
      : null;
    realtimeItemsRef.current = [];
    transcriberFallbackRef.current = false;
    setConnectionState('');
    setMuted(false);
    setScreen('session');

    setStatus(mode === MODE_REALTIME ? 'connecting' : 'starting');

    // The partner should know this learner before saying a word. A failure here
    // only costs the memory, never the session.
    sessionMemoryRef.current = null;
    try {
      const past = await scoped(
        client.from('conversations').select('topic, feedback, created_at'),
        learnerRef.current, languageRef.current
      ).order('created_at', { ascending: false }).limit(8);
      if (past.error) throw new Error(past.error.message);
      sessionMemoryRef.current = memoryFromConversations(past.data, island ? island.about_you : '');
    } catch (err) {
      console.warn('Partner memory unavailable, starting without it', err);
    }

    if (mode === MODE_REALTIME) {
      await startRealtimeSession(chosenTopic);
      return;
    }

    const systemPrompt = buildSystemPrompt(
      profile, chosenTopic, sessionVocabRef.current, sessionStageRef.current, sessionMemoryRef.current
    );

    try {
      const opener = await chatCompletion(config.openaiKey, [
        { role: 'system', content: systemPrompt },
        {
          // A neutral cue only. What to say lives in YOUR OPENING TURN in the
          // system prompt, next to the topic, so the two can never drift apart.
          role: 'user',
          content: '(The learner has just joined and is waiting for you to begin.)'
        }
      ], { maxTokens: levelSpec(profile.current_cefr).maxTokens, temperature: 0.8 });

      if (!opener) throw new Error('Empty opening line from the model.');

      const next = [{ role: 'assistant', content: opener }];
      setMessages(next);
      messagesRef.current = next;

      const speech = await synthesizeSpeech(config.openaiKey, opener, config.voice, levelSpec(profile.current_cefr).speed);
      await playAudioBlob(speech);
    } catch (err) {
      console.error(err);
      pushToast('error', err.message);
      setStatus('idle');
    }
  }, [client, profile, vocab, allVocab, config, mode, currentStage, island, startRealtimeSession, playAudioBlob, pushToast]);

  /* --------------------------------------------------------- the voice turn */

  const handleRecordedAudio = useCallback(async (blob, seconds) => {
    if (!blob || blob.size < 1200) {
      setStatus('idle');
      pushToast('info', 'That recording was too short to hear. Hold the button a little longer.');
      return;
    }

    setStatus('transcribing');
    try {
      const text = await transcribeAudio(config.openaiKey, blob, profile.target_language, seconds, profile.current_cefr);
      if (!text) {
        setStatus('idle');
        pushToast('info', 'Nothing was picked up. Try again a bit closer to the mic.');
        return;
      }

      const withUser = messagesRef.current.concat([{ role: 'user', content: text }]);
      setMessages(withUser);
      messagesRef.current = withUser;

      setStatus('thinking');
      const systemPrompt = buildSystemPrompt(
        profile, topic, sessionVocabRef.current, sessionStageRef.current, sessionMemoryRef.current
      );
      const reply = await chatCompletion(
        config.openaiKey,
        [{ role: 'system', content: systemPrompt }].concat(withUser),
        { maxTokens: levelSpec(profile.current_cefr).maxTokens, temperature: 0.85 }
      );
      if (!reply) throw new Error('Empty reply from the model.');

      const withAssistant = messagesRef.current.concat([{ role: 'assistant', content: reply }]);
      setMessages(withAssistant);
      messagesRef.current = withAssistant;

      setStatus('synthesizing');
      const speech = await synthesizeSpeech(config.openaiKey, reply, config.voice, levelSpec(profile.current_cefr).speed);
      await playAudioBlob(speech);
    } catch (err) {
      console.error(err);
      pushToast('error', err.message);
      setStatus('idle');
    }
  }, [config, profile, topic, playAudioBlob, pushToast]);

  const startRecording = useCallback(async () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setMicDisabled(true);
      pushToast('error', 'This browser has no microphone API. Use Chrome, Edge or Safari over https or localhost.');
      return;
    }
    if (typeof MediaRecorder === 'undefined') {
      setMicDisabled(true);
      pushToast('error', 'MediaRecorder is not supported in this browser.');
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
      streamRef.current = stream;

      const mime = pickRecorderMime();
      const recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
      recorderRef.current = recorder;
      chunksRef.current = [];

      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunksRef.current.push(e.data);
      };
      recorder.onstop = () => {
        const type = recorder.mimeType || mime || 'audio/webm';
        const blob = new Blob(chunksRef.current, { type: type });
        chunksRef.current = [];
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(t => t.stop());
          streamRef.current = null;
        }
        recorderRef.current = null;
        // Whisper bills by audio length, so hand the duration on for the ledger.
        const seconds = recordStartRef.current ? (Date.now() - recordStartRef.current) / 1000 : 0;
        handleRecordedAudio(blob, seconds);
      };
      recorder.onerror = (e) => {
        console.error(e);
        pushToast('error', 'Recording failed. Try again.');
        setStatus('idle');
        releaseMic();
      };

      recorder.start();
      recordStartRef.current = Date.now();
      setStatus('recording');
    } catch (err) {
      console.error(err);
      setStatus('idle');
      if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) {
        pushToast('error', 'Microphone access denied. Allow the mic for this page and try again.');
      } else if (err && err.name === 'NotFoundError') {
        pushToast('error', 'No microphone found on this device.');
      } else {
        pushToast('error', 'Could not start recording: ' + (err.message || err.name));
      }
    }
  }, [handleRecordedAudio, pushToast, releaseMic]);

  const toggleMic = useCallback(() => {
    if (modeRef.current === MODE_REALTIME) {
      toggleMute();
      return;
    }

    if (status === 'recording') {
      if (recorderRef.current && recorderRef.current.state !== 'inactive') {
        recorderRef.current.stop();
      }
      setStatus('transcribing');
      return;
    }

    // Interruption: tapping the mic while the partner is talking kills playback instantly.
    if (status === 'speaking') {
      stopPlayback();
    }

    if (status === 'idle' || status === 'speaking') {
      startRecording();
    }
  }, [status, stopPlayback, startRecording, toggleMute]);

  /* ------------------------------------------------------- end and analyse */

  const endSession = useCallback(async () => {
    if (endingRef.current) return;
    endingRef.current = true;

    if (recorderRef.current && recorderRef.current.state !== 'inactive') {
      try { recorderRef.current.onstop = null; recorderRef.current.stop(); } catch (e) { /* noop */ }
    }
    releaseMic();
    stopPlayback();
    teardownRealtime();
    setConnectionState('');
    setStatus('analyzing');

    const transcript = messagesRef.current.slice();
    const usedSeconds = sessionLengthRef.current - secondsLeft;
    const sessionTopic = topic;
    // Pin the language at end time so a mid-analysis switch cannot misfile rows.
    const sessionLanguage = languageRef.current;
    const sessionLearner = learnerRef.current;
    const sessionStage = sessionStageRef.current;
    const sessionVocab = sessionVocabRef.current.slice();

    const userTurns = transcript.filter(m => m.role === 'user');
    if (!userTurns.length) {
      pushToast('info', 'No speech recorded, so there is nothing to analyse.');
      setScreen('dashboard');
      setStatus('idle');
      endingRef.current = false;
      return;
    }

    let parsed = null;
    try {
      const raw = await chatCompletion(config.openaiKey, [
        { role: 'system', content: 'You are a meticulous language assessor. You always reply with a single valid JSON object and nothing else.' },
        { role: 'user', content: buildAnalysisPrompt(profile, sessionTopic, transcript, sessionVocab, sessionStage) }
      ], { json: true, temperature: 0.3, maxTokens: 1600 });

      const cleaned = raw.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
      parsed = JSON.parse(cleaned);
    } catch (err) {
      console.error(err);
      pushToast('error', 'Analysis failed: ' + err.message);
      setScreen('dashboard');
      setStatus('idle');
      endingRef.current = false;
      return;
    }

    const analysis = {
      grammar_mistakes: Array.isArray(parsed.grammar_mistakes) ? parsed.grammar_mistakes : [],
      recommended_phrases: Array.isArray(parsed.recommended_phrases) ? parsed.recommended_phrases : [],
      // Only words the analyser could back with evidence from the transcript.
      word_gaps: (Array.isArray(parsed.word_gaps) ? parsed.word_gaps : [])
        .filter(w => w && w.word && String(w.word).trim() && w.evidence && String(w.evidence).trim())
        .slice(0, 6)
        .map(w => ({
          word: String(w.word).trim(),
          translation: w.translation ? String(w.translation).trim() : '',
          evidence: String(w.evidence).trim(),
          context: w.context ? String(w.context).trim() : ''
        })),
      next_topic_recommendation: parsed.next_topic_recommendation || '',
      cefr_level_feedback: parsed.cefr_level_feedback || '',
      stage_goal_met: !!parsed.stage_goal_met,
      stage_evidence: parsed.stage_evidence || '',
      stage_checks: Array.isArray(parsed.stage_checks) ? parsed.stage_checks : [],
      conversation_summary: parsed.conversation_summary || '',
      learner_facts: Array.isArray(parsed.learner_facts)
        ? parsed.learner_facts.map(f => String(f).trim()).filter(Boolean).slice(0, 6)
        : []
    };

    // Vocab progression engine — a phrase counts as reviewed when the local scan of the
    // learner's own words finds it, or when the analyser reports the learner produced it
    // (which catches conjugated, split and declined forms the string scan cannot see).
    const learnerText = userTurns.map(m => m.content).join(' \n ');
    const modelUsed = new Set(
      (Array.isArray(parsed.used_target_phrases) ? parsed.used_target_phrases : [])
        .map(p => normalizeText(p))
        .filter(Boolean)
    );
    const modelUsedHeads = new Set(
      (Array.isArray(parsed.used_target_phrases) ? parsed.used_target_phrases : []).map(p => headwordOf(p, sessionLanguage)).filter(Boolean)
    );
    const progressed = [];
    const masteredNow = [];
    for (const v of sessionVocab) {
      if (phraseWasUsed(v.phrase, learnerText, v.kind, sessionLanguage) ||
          modelUsed.has(normalizeText(v.phrase)) ||
          (v.kind === 'word' && modelUsedHeads.has(headwordOf(v.phrase, sessionLanguage)))) {
        const times = (v.times_reviewed || 0) + 1;
        const nextStatus = times >= MASTERY_THRESHOLD ? 'mastered' : 'learning';
        progressed.push({ id: v.id, phrase: v.phrase, times_reviewed: times, status: nextStatus });
        if (nextStatus === 'mastered') masteredNow.push(v.phrase);
      }
    }
    analysis.mastered_now = masteredNow;

    setFeedback(analysis);
    setSheetOpen(true);
    setScreen('dashboard');
    setStatus('idle');
    setSavingFeedback(true);
    setSaveNote('Saving to your database…');

    const problems = [];

    // What was actually written, so the summary never claims skipped duplicates.
    let savedPhrases = 0;
    let savedWords = 0;

    // 1. Insert new phrases and the single words the learner was missing
    //    (skip anything already tracked; words dedupe on their headword).
    try {
      if ((analysis.recommended_phrases.length || analysis.word_gaps.length) && client) {
        const existing = await scoped(client.from('target_vocabulary').select('phrase, kind'), sessionLearner, sessionLanguage);
        if (existing.error) throw new Error(existing.error.message);

        const known = new Set((existing.data || []).map(r => vocabKey(r.phrase, r.kind, sessionLanguage)));
        const rows = [];
        const take = (text, kind, translation, context) => {
          const key = vocabKey(text, kind, sessionLanguage);
          if (!key || known.has(key)) return;
          known.add(key);
          rows.push({
            user_id: sessionLearner,
            target_language: sessionLanguage,
            phrase: String(text).trim(),
            kind: kind,
            translation: translation ? String(translation).trim() : null,
            correction_context: context || null,
            times_reviewed: 0,
            status: 'learning'
          });
        };

        analysis.recommended_phrases
          .filter(p => p && p.phrase)
          // A "phrase" that turns out to be one word is still a word.
          .forEach(p => take(p.phrase, detectKind(p.phrase, sessionLanguage), p.translation, p.context ? String(p.context).trim() : ''));

        analysis.word_gaps.forEach(w => take(
          w.word, 'word', w.translation,
          (w.context ? w.context + ' ' : '') + 'You needed it when you said: "' + w.evidence + '"'
        ));

        if (rows.length) {
          const ins = await client.from('target_vocabulary').insert(rows);
          if (ins.error) throw new Error(ins.error.message);
          savedWords = rows.filter(r => r.kind === 'word').length;
          savedPhrases = rows.length - savedWords;
        }
      }
    } catch (err) {
      console.error(err);
      problems.push('new vocabulary');
    }

    // 2. Apply the progression updates.
    try {
      if (progressed.length && client) {
        for (const p of progressed) {
          const patch = { times_reviewed: p.times_reviewed, status: p.status };
          // Stamp the promotion so daily progress can report what was mastered when.
          if (p.status === 'mastered') patch.mastered_at = new Date().toISOString();
          const upd = await client
            .from('target_vocabulary')
            .update(patch)
            .eq('id', p.id);
          if (upd.error) throw new Error(upd.error.message);
        }
      }
    } catch (err) {
      console.error(err);
      problems.push('vocabulary progress');
    }

    // 3. Persist the conversation itself.
    try {
      if (client) {
        const ins = await client.from('conversations').insert({
          user_id: sessionLearner,
          target_language: sessionLanguage,
          stage_id: sessionStage ? sessionStage.id : null,
          topic: sessionTopic,
          duration_seconds: usedSeconds,
          transcript: transcript,
          feedback: analysis
        });
        if (ins.error) throw new Error(ins.error.message);
      }
    } catch (err) {
      console.error(err);
      problems.push('session transcript');
    }

    setSavingFeedback(false);
    if (problems.length) {
      setSaveNote('Could not save: ' + problems.join(', ') + '.');
      pushToast('error', 'Some data did not save: ' + problems.join(', ') + '.');
    } else {
      const bits = [];
      if (savedPhrases) bits.push(savedPhrases + ' new phrase' + (savedPhrases === 1 ? '' : 's'));
      if (savedWords) bits.push(savedWords + ' new word' + (savedWords === 1 ? '' : 's'));
      if (progressed.length) bits.push(progressed.length + ' reviewed');
      if (masteredNow.length) bits.push(masteredNow.length + ' mastered');
      setSaveNote('Saved' + (bits.length ? ' · ' + bits.join(' · ') : '') + '.');
    }

    // The island gate needs both halves: the analyser's verdict on the objective,
    // and every stage phrase actually used enough to count as owned.
    let mergedChecks = null;
    if (sessionStage) {
      try {
        // Read the stage fresh: checks may have been generated after the session began.
        const cur = await client.from('island_stages').select('*').eq('id', sessionStage.id).maybeSingle();
        const base = (cur.data) || sessionStage;
        const patch = { sessions_count: (base.sessions_count || 0) + 1 };
        if (Array.isArray(base.checks) && base.checks.length) {
          mergedChecks = mergeStageChecks(base.checks, analysis.stage_checks, new Date().toISOString());
          // Store without the per-session "newly" flag; it only matters for this feedback.
          patch.checks = mergedChecks.map(c => { const x = Object.assign({}, c); delete x.newly; return x; });
          patch.ai_verdict = mergedChecks.every(c => c.met);
        } else if (analysis.stage_goal_met) {
          patch.ai_verdict = true;
        }
        const upd = await client.from('island_stages').update(patch).eq('id', sessionStage.id);
        if (upd.error) throw new Error(upd.error.message);
      } catch (err) {
        console.error(err);
        problems.push('island progress');
      }
    }

    const rows = await refreshVocab(client, sessionLanguage, sessionLearner);

    // Show the learner what this session did for their stage, and when both
    // halves of the gate are met there is nothing left to decide: move the
    // island on and celebrate it rather than burying it in a toast.
    if (sessionStage) {
      try {
        const fresh = await client.from('island_stages').select('*').eq('id', sessionStage.id).maybeSingle();
        const all = await client.from('island_stages').select('position, title')
          .eq('island_id', sessionStage.island_id).order('position', { ascending: true });
        if (!fresh.error && fresh.data) {
          const before = stageGate(sessionStage, sessionAllVocabRef.current);
          const after = stageGate(fresh.data, rows);
          const next = ((all.data) || []).find(x => x.position === fresh.data.position + 1) || null;
          const beforeUses = new Map(before.phrases.map(p => [p.phrase, p.uses]));

          const result = {
            position: fresh.data.position,
            total: ((all.data) || []).length,
            title: fresh.data.title,
            checks: mergedChecks || [],
            phrases: after.phrases.map(p => ({
              phrase: p.phrase, kind: p.kind, before: beforeUses.get(p.phrase) || 0, after: p.uses, ready: p.ready
            })),
            progressBefore: before.progress,
            progressAfter: after.progress,
            cleared: after.complete && fresh.data.status === 'current',
            nextTitle: next ? next.title : null
          };
          setFeedback(prev => prev ? Object.assign({}, prev, { stage_result: result }) : prev);

          if (result.cleared) {
            await advanceStageRef.current(fresh.data, { silent: true });
            setCelebration(result);
          }
        }
      } catch (err) {
        console.error('Stage result failed', err);
      }
    }

    await Promise.all([
      refreshStats(client, sessionLanguage, sessionLearner),
      refreshRecommendedTopic(client, rows, sessionLanguage, sessionLearner),
      refreshDailyStats(client, sessionLanguage, sessionLearner),
      // Without these the dashboard kept showing the stage as it was before
      // the session, which made real progress look like nothing had happened.
      refreshIsland(client, sessionLanguage, sessionLearner),
      refreshSrs(client, sessionLanguage, sessionLearner)
    ]);
    endingRef.current = false;
  }, [client, config, profile, topic, secondsLeft, releaseMic, stopPlayback, teardownRealtime, pushToast, refreshVocab, refreshStats, refreshRecommendedTopic, refreshDailyStats, refreshIsland, refreshSrs]);

  /* ------------------------------------------------------- learner profiles */

  const activeLearner = useMemo(
    () => learners.find(l => l.id === learnerId) || null,
    [learners, learnerId]
  );

  // Switching profile reloads the whole workspace for that person: their
  // language, their level, their vocabulary, their history.
  const switchLearner = useCallback(async (nextId) => {
    if (!client || !nextId || nextId === learnerId) return;

    setProfilesBusy(true);
    try {
      const lang = languageRef.current;
      const row = await loadOrCreateProfile(client, nextId, lang, null);

      learnerRef.current = nextId;
      setLearnerId(nextId);
      setProfile(row);
      setVocab([]);
      setAllVocab([]);
      setFeedback(null);
      setSheetOpen(false);
      setSuggestItems([]);
      setSrsSets([]);
      setSrsReviews(new Map());
      setSrsRevlog([]);
      setSrsIntroducedToday(0);
      setIsland(null);
      setStages([]);
      setCelebration(null);
      turkishCacheRef.current = new Map();

      const cfg = loadConfig();
      if (cfg) saveConfig(Object.assign({}, cfg, { learnerId: nextId }));
      setConfig(loadConfig());

      const rows = await refreshVocab(client, lang, nextId);
      await Promise.all([
        refreshStats(client, lang, nextId),
        refreshRecommendedTopic(client, rows, lang, nextId),
        refreshDailyStats(client, lang, nextId),
        refreshSrs(client, lang, nextId),
        refreshIsland(client, lang, nextId)
      ]);
      setProfilesOpen(false);
      const who = learners.find(l => l.id === nextId);
      pushToast('success', 'Switched to ' + (who ? who.name : 'profile') + '.');
    } catch (err) {
      console.error(err);
      pushToast('error', 'Could not switch profile: ' + err.message);
    } finally {
      setProfilesBusy(false);
    }
  }, [client, learnerId, learners, refreshVocab, refreshStats, refreshRecommendedTopic, refreshDailyStats, pushToast]);

  const createLearner = useCallback(async (name, emoji) => {
    if (!client) return;
    const clean = (name || '').trim();
    if (!clean) return;

    if (learners.length >= MAX_PROFILES) {
