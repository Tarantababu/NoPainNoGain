      if (pattern.test(safe)) return safe.replace(pattern, m => HL_B(m));
    } else {
      const ranges = findParts(safe, parts);
      if (ranges) return wrapRanges(safe, ranges, m => HL_B(m));
    }
  }
  return safe;
}

function clozify(sentence, form, baseWord, hint) {
  const safe = esc(sentence);
  const hintSpan = NATIVE_SPAN(esc(hint));
  const wrap = m => '{{c1::' + HL_B(m) + '::' + hintSpan + '}}';
  for (const needle of [form, baseWord]) {
    const parts = splitPhrase(needle);
    if (!parts.length) continue;
    const ranges = findParts(safe, parts);
    if (ranges) return wrapRanges(safe, ranges, wrap);
  }
  return wrap(safe);
}

function cardShell(inner, accentFrom, accentTo, badge) {
  return '<div style="font-family:' + CARD_FONT + ';max-width:560px;margin:8px auto;text-align:left;background:#FFFFFF;border:1px solid #E3E8F0;border-radius:16px;overflow:hidden;box-shadow:0 6px 18px rgba(20,30,55,.10);">'
    + '<div style="height:6px;background:linear-gradient(90deg,' + accentFrom + ',' + accentTo + ');"></div>'
    + '<div style="padding:16px 20px 18px;">'
    + (badge ? '<div style="font-size:.68em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8A94A6;margin-bottom:10px;">' + badge + '</div>' : '')
    + inner
    + '</div></div>';
}

const numChip = n =>
  '<span style="flex:none;display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;background:#EEF2FB;color:#2B59C3;border-radius:50%;font-size:.72em;font-weight:700;margin-right:10px;">' + n + '</span>';

const sentenceRow = (n, html) =>
  '<div style="display:flex;align-items:flex-start;margin:9px 0;font-size:1.04em;line-height:1.6;color:#1E2A38;">' + numChip(n) + '<span>' + html + '</span></div>';

const wordChip = (word, translation) =>
  '<div style="display:inline-block;background:#1E2A38;color:#FFE45C;font-weight:700;font-size:1.15em;padding:6px 14px;border-radius:10px;">' + word + '</div>'
  + (translation ? '<div style="margin-top:10px;font-size:1.05em;color:#1E2A38;font-weight:600;">' + translation + '</div>' : '');

/* ---------- the three card faces ---------- */

function readingFront(set) {
  const rows = set.data.sentences
    .map((s, i) => sentenceRow(i + 1, boldify(s.target, s.word_form, set.phrase)))
    .join('');
  return cardShell(rows, CARD_ACCENTS.reading[0], CARD_ACCENTS.reading[1], 'Reading · spot the phrase');
}

function readingBack(set) {
  const inner = wordChip(esc(set.phrase), esc(set.data.word_translation))
    + '<div style="margin-top:10px;">' + NATIVE_SPAN(esc(set.data.definition)) + '</div>';
  return cardShell(inner, CARD_ACCENTS.reading[0], CARD_ACCENTS.reading[1], 'Meaning');
}

function listeningFront(audioB64) {
  const inner = '<div style="text-align:center;padding:4px 0 2px;">'
    + '<div style="font-size:2em;line-height:1;margin-bottom:10px;">🎧</div>'
    + AUDIO_TAG(audioB64)
    + '<div style="margin-top:10px;font-size:.8em;color:#8A94A6;">Listen, then recall the full sentence</div>'
    + '</div>';
  return cardShell(inner, CARD_ACCENTS.listening[0], CARD_ACCENTS.listening[1], 'Listening');
}

function listeningBack(set, s) {
  const inner = '<div style="font-size:1.1em;line-height:1.6;color:#1E2A38;">'
    + boldify(s.target, s.word_form, set.phrase) + '</div>'
    + '<div style="margin-top:8px;">' + NATIVE_SPAN(esc(s.native)) + '</div>';
  return cardShell(inner, CARD_ACCENTS.listening[0], CARD_ACCENTS.listening[1], 'Sentence');
}

function speakingText(set, s) {
  const cloze = clozify(s.target, s.word_form, set.phrase, set.data.word_translation);
  const inner = '<div style="font-size:1.1em;line-height:1.7;color:#1E2A38;">' + cloze + '</div>'
    + '<div style="margin-top:12px;font-size:.8em;color:#8A94A6;">Say the complete sentence out loud</div>';
  return cardShell(inner, CARD_ACCENTS.speaking[0], CARD_ACCENTS.speaking[1], 'Speaking · fill the gap');
}

function speakingExtra(set, s, audioB64) {
  const inner = AUDIO_TAG(audioB64)
    + '<div style="margin-top:10px;">' + NATIVE_SPAN(esc(s.native)) + '</div>'
    + '<div style="margin-top:8px;font-size:.8em;color:#8A94A6;">Shadow the audio two or three times</div>';
  return cardShell(inner, CARD_ACCENTS.speaking[0], CARD_ACCENTS.speaking[1], 'Answer · shadow it');
}

/* ---------- SM-2 scheduler ---------- */

function newRev(cardId, setId, deck, idx, learnerId, language) {
  const now = new Date().toISOString();
  return {
    card_id: cardId, user_id: learnerId, target_language: language,
    set_id: setId, deck: deck, idx: idx,
    state: 'new', step: 0, ivl: 0, ef: 2.5, reps: 0, lapses: 0,
    due_at: now, updated_at: now
  };
}

function applyRating(rev, rating, nowMs) {
  const at = nowMs || Date.now();
  const r = Object.assign({}, rev);
  const inMin = m => new Date(at + m * 60000).toISOString();
  const inDay = d => new Date(at + d * 86400000).toISOString();
  const clampEf = e => Math.max(1.3, e);

  if (r.state === 'new') { r.state = 'learning'; r.step = 0; }

  if (r.state === 'learning' || r.state === 'relearning') {
    const steps = r.state === 'learning' ? LEARN_STEPS_MIN : RELEARN_STEPS_MIN;
    const graduate = easy => {
      r.ivl = r.state === 'relearning'
        ? Math.max(1, Math.round(r.ivl * 0.5)) + (easy ? 1 : 0)
        : (easy ? 4 : 1);
      r.state = 'review'; r.step = 0; r.due_at = inDay(r.ivl);
    };
    if (rating === 'again') { r.step = 0; r.due_at = inMin(steps[0]); }
    else if (rating === 'hard') { r.due_at = inMin(Math.max(steps[Math.min(r.step, steps.length - 1)] * 1.5, 5)); }
    else if (rating === 'good') {
      r.step += 1;
      if (r.step >= steps.length) graduate(false);
      else r.due_at = inMin(steps[r.step]);
    } else { graduate(true); }
  } else {
    if (rating === 'again') {
      r.lapses += 1; r.ef = clampEf(r.ef - 0.2);
      r.state = 'relearning'; r.step = 0; r.due_at = inMin(RELEARN_STEPS_MIN[0]);
    } else if (rating === 'hard') {
      r.ivl = Math.max(r.ivl + 1, Math.round(r.ivl * 1.2));
      r.ef = clampEf(r.ef - 0.15); r.due_at = inDay(r.ivl);
    } else if (rating === 'good') {
      r.ivl = Math.max(r.ivl + 1, Math.round(r.ivl * r.ef)); r.due_at = inDay(r.ivl);
    } else {
      r.ivl = Math.max(r.ivl + 2, Math.round(r.ivl * r.ef * 1.3));
      r.ef = clampEf(r.ef + 0.15); r.due_at = inDay(r.ivl);
    }
    r.ivl = Math.min(r.ivl, 36500);
  }
  r.reps += 1;
  r.updated_at = new Date().toISOString();
  return r;
}

function fmtDue(iso) {
  const ms = new Date(iso) - Date.now();
  const min = Math.round(ms / 60000);
  if (min < 60) return Math.max(1, min) + 'm';
  if (min < 60 * 36) return Math.round(min / 60) + 'h';
  const d = Math.round(ms / 86400000);
  if (d < 31) return d + 'd';
  if (d < 365) return (Math.round(d / 30.4 * 10) / 10) + 'mo';
  return (Math.round(d / 365 * 10) / 10) + 'y';
}

/* ---------- queue building ---------- */

function allCards(sets) {
  const out = [];
  (sets || []).forEach(set => {
    if (!set.data || !Array.isArray(set.data.sentences) || !set.data.sentences.length) return;
    const n = set.data.sentences.length;
    out.push({ cardId: set.id + '|reading|0', set: set, deck: 'reading', idx: 0 });
    for (let i = 0; i < n; i++) out.push({ cardId: set.id + '|listening|' + i, set: set, deck: 'listening', idx: i });
    for (let i = 0; i < n; i++) out.push({ cardId: set.id + '|speaking|' + i, set: set, deck: 'speaking', idx: i });
  });
  return out;
}

function dueCounts(sets, reviews, remainingNew) {
  const now = Date.now();
  const endOfDay = new Date(); endOfDay.setHours(23, 59, 59, 999);
  let learn = 0, due = 0, freshTotal = 0;

  allCards(sets).forEach(c => {
    const r = reviews.get(c.cardId);
    if (!r || r.state === 'new') freshTotal += 1;
    else if (r.state === 'learning' || r.state === 'relearning') {
      if (new Date(r.due_at) - now <= LEARN_AHEAD_MIN * 60000) learn += 1;
    } else if (new Date(r.due_at) <= endOfDay) due += 1;
  });

  const fresh = Math.min(freshTotal, Math.max(0, remainingNew));
  return { learn: learn, due: due, fresh: fresh, freshTotal: freshTotal, total: learn + due + fresh };
}

function nextDueAt(sets, reviews) {
  let min = null;
  const now = Date.now();
  allCards(sets).forEach(c => {
    const r = reviews.get(c.cardId);
    if (!r || r.state === 'new') return;
    const t = new Date(r.due_at);
    if (t > now && (!min || t < min)) min = t;
  });
  return min;
}

function buildQueue(sets, reviews, remainingNew, learnerId, language) {
  const now = Date.now();
  const endOfDay = new Date(); endOfDay.setHours(23, 59, 59, 999);
  const learn = [], rev = [], freshAll = [];

  allCards(sets).forEach(c => {
    const r = reviews.get(c.cardId) || null;
    const item = Object.assign({}, c, {
      rev: r || newRev(c.cardId, c.set.id, c.deck, c.idx, learnerId, language)
    });
    if (!r || r.state === 'new') freshAll.push(item);
    else if (r.state === 'learning' || r.state === 'relearning') {
      if (new Date(r.due_at) - now <= LEARN_AHEAD_MIN * 60000) learn.push(item);
    } else if (new Date(r.due_at) <= endOfDay) rev.push(item);
  });

  const byDue = (a, b) => new Date(a.rev.due_at) - new Date(b.rev.due_at);
  learn.sort(byDue);
  rev.sort(byDue);
  freshAll.sort((a, b) => new Date(a.set.created_at || 0) - new Date(b.set.created_at || 0));

  return { learn: learn, rev: rev, fresh: freshAll.slice(0, Math.max(0, remainingNew)), done: 0 };
}

function pickNext(q) {
  const now = Date.now();
  const learnIdx = q.learn.findIndex(c => new Date(c.rev.due_at) <= now);
  if (learnIdx >= 0) return q.learn.splice(learnIdx, 1)[0];
  if (q.rev.length) return q.rev.shift();
  if (q.fresh.length) return q.fresh.shift();
  if (q.learn.length) return q.learn.shift();
  return null;
}

/* ---------- forging a phrase into a card set ---------- */

async function generateSentences(apiKey, phrase, nativeLang, targetLang) {
  const sys = 'You generate language-learning example sentences. Respond with a single valid JSON object and nothing else. No markdown fences.';
  const user = [
    'Target language: ' + targetLang,
    'Native language: ' + nativeLang,
    'Target word or phrase: "' + phrase + '"',
    '',
    'Create EXACTLY ' + SENTENCES_PER_SET + ' sentences in ' + targetLang + ', each containing the target word or phrase ' +
      '(inflected/conjugated forms are encouraged where natural). Keep sentences 6-18 words long.',
    '',
    'NATURALNESS — this is the top priority:',
    '- Write the way native speakers ACTUALLY talk, not like a textbook. Prefer idiomatic, colloquial phrasing; ' +
      'contractions and casual register are welcome where the language uses them.',
    '- Ground each sentence in a realistic everyday situation (chatting with a friend, texting, at work, complaining, ' +
      'telling a story, news, small talk). Vary tense, register, and context across the sentences.',
    '- A native speaker reading the sentence should never think "nobody says it like that".',
    '',
    'SEPARABLE PHRASES:',
    '- If the target phrase contains "..." it is separable: other words belong BETWEEN its parts. Use it naturally ' +
      'with real words in between.',
    '- In that case, word_form must return the parts as they actually appear in that sentence, joined by " ... ". ' +
      'Each part must be copied verbatim from the sentence.',
    '',
    'Return JSON with this exact shape:',
    '{',
    '  "definition": "concise definition/explanation of the phrase in ' + nativeLang + ' (max 25 words)",',
    '  "word_translation": "the closest single translation of just the word/phrase into ' + nativeLang + '",',
    '  "sentences": [',
    '    {',
    '      "target": "the sentence in ' + targetLang + ', plain text, no HTML",',
    '      "native": "faithful ' + nativeLang + ' translation, plain text",',
    '      "word_form": "the EXACT substring of the target sentence that is the phrase as it appears there (verbatim, ' +
      'including inflection); for separable phrases: the parts verbatim, joined by \' ... \'"',
    '    }',
    '  ]',
    '}',
    'The sentences array must have exactly ' + SENTENCES_PER_SET + ' items. word_form must be copy-pasted verbatim from its sentence.'
  ].join('\n');

  const raw = await chatCompletion(apiKey, [
    { role: 'system', content: sys },
    { role: 'user', content: user }
  ], { json: true, temperature: 0.8, maxTokens: 2000 });

  const cleaned = raw.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  const parsed = JSON.parse(cleaned);
  if (!Array.isArray(parsed.sentences) || !parsed.sentences.length) {
    throw new Error('The model returned no sentences.');
  }
  parsed.sentences = parsed.sentences.slice(0, SENTENCES_PER_SET);
  return parsed;
}

function base64FromArrayBuffer(buf) {
  const bytes = new Uint8Array(buf);
  let binary = '';
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(binary);
}

/* ---------- Anki export (same three files as the original) ---------- */

function deckName(language, suffix) {
  return 'Fluent Loop::' + language + '::' + suffix;
}

function buildReadingDeck(sets, language) {
  const name = deckName(language, 'Reading');
  const rows = sets.map(set => stripField(readingFront(set)) + '\t' + stripField(readingBack(set)));
  return {
    filename: name.replace(/::/g, '-') + '.txt',
    content: '#separator:tab\n#html:true\n#deck:' + name + '\n#columns:Front\tBack\n' + rows.join('\n')
  };
}

function buildListeningDeck(sets, language) {
  const name = deckName(language, 'Listening');
  const rows = [];
  sets.forEach(set => {
    set.data.sentences.forEach((s, i) => {
      const audio = (set.audio || [])[i] || '';
      rows.push(stripField(listeningFront(audio)) + '\t' + stripField(listeningBack(set, s)));
    });
  });
  return {
    filename: name.replace(/::/g, '-') + '.txt',
    content: '#separator:tab\n#html:true\n#deck:' + name + '\n#columns:Front\tBack\n' + rows.join('\n')
  };
}

function buildSpeakingDeck(sets, language) {
  const name = deckName(language, 'Speaking');
  const rows = [];
  sets.forEach(set => {
    set.data.sentences.forEach((s, i) => {
      const audio = (set.audio || [])[i] || '';
      rows.push(stripField(speakingText(set, s)) + '\t' + stripField(speakingExtra(set, s, audio)));
    });
  });
  return {
    filename: name.replace(/::/g, '-') + '.txt',
    content: '#separator:tab\n#html:true\n#notetype:Cloze\n#deck:' + name + '\n#columns:Text\tBack Extra\n' + rows.join('\n')
  };
}

/* ------------------------------------------------------------------- UI bits */

function Spinner({ className }) {

function Toast({ toast, onDismiss }) {

  }, [toast, onDismiss]);

  if (!toast) return null;
  const tone = toast.type === 'error'
    ? 'bg-red-500/15 border-red-500/40 text-red-200'
    : toast.type === 'success'
      ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-200'
      : 'bg-gray-700/60 border-gray-600 text-gray-100';

  return (
    <div className="fixed inset-x-0 top-0 z-50 flex justify-center px-4 pt-4 pointer-events-none">
      <div className={'fade-in pointer-events-auto w-full max-w-md rounded-xl border px-4 py-3 text-sm shadow-lg backdrop-blur ' + tone}
        onClick={onDismiss}>

function formatUsd(v) {
  const n = Number(v) || 0;
  if (Math.abs(n) > 0 && Math.abs(n) < 0.01) return (n < 0 ? '-' : '') + '<$0.01';
  return (n < 0 ? '-$' : '$') + Math.abs(n).toFixed(2);
}

// A sentence with one deliberate, typical learner mistake per language, and the
// wrong fragment that only survives if the transcriber did not "fix" it.
const TRANSCRIPTION_TESTS = {
  English:    { say: 'Yesterday I go to the office and I buyed a coffee.', marker: 'buyed', fix: 'bought' },
  German:     { say: 'Gestern ich habe nach Hause gegangen.', marker: 'habe', fix: 'bin ich … gegangen' },
  Spanish:    { say: 'Ayer yo soy muy cansado después del trabajo.', marker: 'soy', fix: 'estaba' },
  French:     { say: "Hier j'ai allé au marché avec ma mère.", marker: 'ai alle', fix: 'je suis allé' },
  Italian:    { say: 'Ieri ho andato al mercato con mia madre.', marker: 'ho andato', fix: 'sono andato' },
  Portuguese: { say: 'Ontem eu fazi o jantar para a minha família.', marker: 'fazi', fix: 'fiz' },
  Dutch:      { say: 'Gisteren ik heb naar huis gegaan.', marker: 'heb', fix: 'ben ik … gegaan' },
  Swedish:    { say: 'Igår jag gick till affären.', marker: 'igar jag', fix: 'igår gick jag' },
  Turkish:    { say: 'Dün okula gidiyorum ve arkadaşımı görüyorum.', marker: 'gidiyorum', fix: 'gittim' },
  Russian:    { say: 'Вчера я пойду в магазин.', marker: 'пойду', fix: 'пошёл' }
};

function mistakeKept(transcript, marker) {
  return (' ' + normalizeText(transcript) + ' ').indexOf(' ' + normalizeText(marker) + ' ') !== -1;
}

function TranscriptionCheck({ apiKey, language, level }) {
  const test = TRANSCRIPTION_TESTS[language] || null;
  const [phase, setPhase] = useState('idle'); // idle | recording | working | done | error
  const [results, setResults] = useState(null);
  const [error, setError] = useState('');
  const recRef = useRef(null);
  const startRef = useRef(0);

  async function start() {
    setError('');
    setResults(null);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = pickRecorderMime();
      const rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
      const chunks = [];
      rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const seconds = (Date.now() - startRef.current) / 1000;
        const blob = new Blob(chunks, { type: rec.mimeType || mime || 'audio/webm' });
        setPhase('working');
        try {
          // Same recording, both setups, so the only difference is the transcriber.
          const [before, now] = await Promise.all([
            transcribeAudio(apiKey, blob, language, seconds, level,
              { model: TRANSCRIBE_FALLBACK, verbatim: false, detailed: true }),
            transcribeAudio(apiKey, blob, language, seconds, level, { detailed: true })
          ]);
          setResults({ before: before, now: now });
          setPhase('done');
        } catch (err) {
          setError(err.message || String(err));
          setPhase('error');
        }
      };
      recRef.current = rec;
      rec.start();
      startRef.current = Date.now();
      setPhase('recording');
    } catch (err) {
      setError(err && err.name === 'NotAllowedError' ? 'Microphone access was denied.' : (err.message || String(err)));
      setPhase('error');
    }
  }

  function stop() {
    if (recRef.current && recRef.current.state !== 'inactive') recRef.current.stop();
  }

  const row = (label, r) => {
    const kept = test ? mistakeKept(r.text, test.marker) : null;
    return (
      <div className="rounded-lg border border-gray-800 bg-gray-900/60 p-3">
        <div className="flex items-center justify-between text-[11px] font-semibold uppercase tracking-wide text-gray-500">
          <span>{label} · {r.model}</span>
          {kept === null ? null : kept
            ? <span className="text-emerald-300">mistake kept</span>
            : <span className="text-red-300">corrected away</span>}
        </div>
        <div className="mt-1 text-sm text-gray-200">{r.text || '—'}</div>
      </div>
    );
  };

  return (
    <div className="mt-8 rounded-2xl border border-gray-800 bg-gray-800/40 p-4">
      <h2 className="text-sm font-semibold text-gray-200">Transcription check</h2>
      <p className="mt-1 text-xs leading-relaxed text-gray-400">
        Your feedback can only catch mistakes the transcriber leaves in. Read this sentence aloud — the mistake is on
        purpose — and see whether it survives.
      </p>

      <div className="mt-3 rounded-lg border border-indigo-500/30 bg-indigo-500/10 p-3">
        {test ? (
          <React.Fragment>
            <div className="text-sm text-white">“{test.say}”</div>
            <div className="mt-1 text-[11px] text-gray-400">
              The mistake: <span className="text-amber-300">{test.marker}</span> (correct: {test.fix})
            </div>
          </React.Fragment>
        ) : (
          <div className="text-sm text-gray-300">
            Say a short {language} sentence with a mistake you often make, then compare the two transcripts.
          </div>
        )}
      </div>

      {phase === 'recording' ? (
        <button type="button" onClick={stop}
          className="no-tap rec-pulse mt-3 w-full rounded-xl bg-red-600 px-4 py-2.5 text-sm font-semibold text-white">
          Stop and compare
        </button>
      ) : (
        <button type="button" onClick={start} disabled={phase === 'working' || !apiKey}
          className="no-tap mt-3 flex w-full items-center justify-center gap-2 rounded-xl border border-gray-700 px-4 py-2.5 text-sm text-gray-200 transition hover:text-white disabled:opacity-50">
          {phase === 'working' ? <Spinner className="h-4 w-4" /> : null}
          {phase === 'working' ? 'Transcribing both ways…' : phase === 'done' ? 'Try again' : 'Record the sentence'}
        </button>
      )}

      {results ? (
        <div className="mt-3 space-y-2">
          {row('Before', results.before)}
          {row('Now', results.now)}
          {results.now.model !== TRANSCRIBE_MODEL ? (
            <p className="text-xs text-amber-300">
              Your account could not use {TRANSCRIBE_MODEL}, so sessions fall back to {TRANSCRIBE_FALLBACK}.
            </p>
          ) : null}
        </div>
      ) : null}
      {error ? <p className="mt-2 text-xs text-red-300">{error}</p> : null}
      <p className="mt-2 text-[11px] text-gray-600">Two short transcriptions, well under a cent.</p>
    </div>
  );
}

function SetupScreen({ initial, onSaved, onCancel, pushToast, learnerId, resetInfo }) {
  const [confirmingReset, setConfirmingReset] = useState(false);
  const [openaiKey, setOpenaiKey] = useState(initial ? initial.openaiKey : '');
  const [supabaseUrl, setSupabaseUrl] = useState(initial ? initial.supabaseUrl : '');
  const [supabaseKey, setSupabaseKey] = useState(initial ? initial.supabaseKey : '');
  const [language, setLanguage] = useState(initial ? initial.target_language : 'German');
  const [cefr, setCefr] = useState(initial ? initial.current_cefr : 'B1');
  const [mode, setMode] = useState(initial ? initial.vocab_injection_mode : 'adapt_naturally');
  const [voice, setVoice] = useState(initial && initial.voice ? initial.voice : 'alloy');
  const [busy, setBusy] = useState(false);
  const [step, setStep] = useState('');

  async function handleSave(e) {
    e.preventDefault();
    const key = openaiKey.trim();
    const url = supabaseUrl.trim().replace(/\/+$/, '');
    const anon = supabaseKey.trim();

    if (!key || !url || !anon) {
      pushToast('error', 'OpenAI key, Supabase URL and Supabase anon key are all required.');
      return;
    }
    if (!/^https?:\/\//i.test(url)) {
      pushToast('error', 'Supabase URL must start with https://');
      return;
    }

    setBusy(true);
    try {
      setStep('Verifying OpenAI key…');
      await verifyOpenAIKey(key);

      setStep('Connecting to Supabase…');
      const client = window.supabase.createClient(url, anon);

      const probe = await client.from('profiles').select('id').limit(1);
      if (probe.error) {
        throw new Error('Supabase: ' + probe.error.message + ' (check the URL, the anon key, that the tables exist, and that RLS allows anon access)');
      }

      // On a first run there is no learner row yet, so make sure one exists
      // before writing a profile that points at it.
      setStep('Checking the schema…');
      const learnerRows = await ensureLearner(client);
      const who = (learnerId && learnerRows.some(l => l.id === learnerId)) ? learnerId : learnerRows[0].id;

      const langProbe = await client.from('target_vocabulary').select('target_language').limit(1);
      if (langProbe.error) {
        if (missingLanguageColumn(langProbe.error)) throw new Error(MIGRATION_HINT);
        throw new Error('Supabase: ' + langProbe.error.message);
      }

      setStep('Saving your ' + language + ' profile…');
      // Settings only ever touch the profile row for the language being saved.
      const existing = await client
        .from('profiles')
        .select('*')
        .eq('user_id', who)
        .eq('target_language', language)
        .maybeSingle();
      if (existing.error) throw new Error('Supabase: ' + existing.error.message);

      const profileRow = {
        user_id: who,
        target_language: language,
        current_cefr: cefr,
        vocab_injection_mode: mode
      };

      let saved;
      if (existing.data) {
        const upd = await client
          .from('profiles')
          .update(profileRow)
          .eq('id', existing.data.id)
          .select()
          .single();
        if (upd.error) throw new Error('Supabase: ' + upd.error.message);
        saved = upd.data;
      } else {
        const ins = await client
          .from('profiles')
          .insert(profileRow)
          .select()
          .single();
        if (ins.error) throw new Error('Supabase: ' + ins.error.message);
        saved = ins.data;
      }

      const prevCfg = loadConfig() || {};
      const cfg = {
        openaiKey: key, supabaseUrl: url, supabaseKey: anon, voice: voice,
        targetLanguage: language,
        learnerId: who,
        conversationMode: prevCfg.conversationMode || MODE_TURN
      };
      saveConfig(cfg);
      pushToast('success', 'Connected. Everything checks out.');
      onSaved(cfg, client, saved);
    } catch (err) {
      console.error(err);
      pushToast('error', err.message || String(err));
    } finally {
      setBusy(false);
      setStep('');
    }
  }

  return (
    <div className="mx-auto flex min-h-full w-full max-w-md flex-col px-5 pb-10 pt-10">
      <div className="mb-8">
        <div className="mb-3 inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-indigo-500/15 text-indigo-400">
          <LogoMark className="h-6 w-6" />
        </div>
        <h1 className="text-2xl font-semibold tracking-tight">Fluent Loop</h1>
        <p className="mt-1 text-sm text-gray-400">
          Talk out loud every day. Your mistakes become tomorrow's vocabulary.
        </p>
      </div>

      <form onSubmit={handleSave} className="space-y-5">
        <div className="space-y-4 rounded-2xl border border-gray-800 bg-gray-800/40 p-4">
          <h2 className="text-sm font-semibold text-gray-200">Credentials</h2>
          <Field label="OpenAI API Key" hint="Used for Whisper, GPT-4o and TTS. Stored only in this browser.">
            <input className={inputClass} type="password" autoComplete="off" spellCheck="false"
              placeholder="sk-…" value={openaiKey} onChange={e => setOpenaiKey(e.target.value)} />
          </Field>
          <Field label="Supabase URL">
            <input className={inputClass} type="url" autoComplete="off" spellCheck="false"
              placeholder="https://xxxx.supabase.co" value={supabaseUrl} onChange={e => setSupabaseUrl(e.target.value)} />
          </Field>
          <Field label="Supabase Anon Key">
            <input className={inputClass} type="password" autoComplete="off" spellCheck="false"
              placeholder="eyJhbGciOi…" value={supabaseKey} onChange={e => setSupabaseKey(e.target.value)} />
          </Field>
        </div>

        <div className="space-y-4 rounded-2xl border border-gray-800 bg-gray-800/40 p-4">
          <h2 className="text-sm font-semibold text-gray-200">Learning profile</h2>
          <Field label="Target Language">
            <select className={inputClass} value={language} onChange={e => setLanguage(e.target.value)}>
              {LANGUAGES.map(l => <option key={l.code} value={l.name}>{l.name}</option>)}
            </select>
          </Field>
          <Field label="CEFR Level">
            <select className={inputClass} value={cefr} onChange={e => setCefr(e.target.value)}>
              {CEFR_LEVELS.map(l => <option key={l.code} value={l.code}>{l.label}</option>)}
            </select>
          </Field>
          <Field label="Partner Voice">
            <select className={inputClass} value={voice} onChange={e => setVoice(e.target.value)}>
              {VOICES.map(v => <option key={v} value={v}>{v}</option>)}
            </select>
          </Field>

          <div>
            <span className="mb-1.5 block text-xs font-medium uppercase tracking-wider text-gray-400">
              Vocab Injection Mode
            </span>
            <div className="grid grid-cols-2 gap-2">
              <button type="button" onClick={() => setMode('adapt_naturally')}
                className={'no-tap rounded-xl border p-3 text-left transition ' + (mode === 'adapt_naturally'
                  ? 'border-indigo-500 bg-indigo-500/15'
                  : 'border-gray-700 bg-gray-800 hover:border-gray-600')}>
                <div className="text-sm font-medium">Adapt Naturally</div>
                <div className="mt-0.5 text-xs text-gray-400">Phrases get conjugated to fit the sentence.</div>
              </button>
              <button type="button" onClick={() => setMode('force_verbatim')}
                className={'no-tap rounded-xl border p-3 text-left transition ' + (mode === 'force_verbatim'
                  ? 'border-indigo-500 bg-indigo-500/15'
                  : 'border-gray-700 bg-gray-800 hover:border-gray-600')}>
                <div className="text-sm font-medium">Force Verbatim</div>
                <div className="mt-0.5 text-xs text-gray-400">Phrases appear exactly as saved.</div>
              </button>
            </div>
          </div>
        </div>

        <button type="submit" disabled={busy}
          className="no-tap flex w-full items-center justify-center gap-2 rounded-xl bg-indigo-600 px-4 py-3.5 text-sm font-semibold text-white transition hover:bg-indigo-500 disabled:opacity-50">
          {busy ? <Spinner className="h-4 w-4" /> : null}
          {busy ? (step || 'Testing…') : 'Test & Save'}
        </button>

        {onCancel ? (
          <button type="button" onClick={onCancel}
            className="no-tap w-full rounded-xl px-4 py-3 text-sm text-gray-400 transition hover:text-white">
            Cancel
          </button>
        ) : null}
      </form>

      {resetInfo ? <BalanceCard /> : null}

      {resetInfo && resetInfo.check ? (
        <TranscriptionCheck apiKey={resetInfo.check.apiKey} language={resetInfo.check.language} level={resetInfo.check.level} />
      ) : null}

      {resetInfo ? (
        <div className="mt-8 rounded-2xl border border-red-500/30 bg-red-500/5 p-4">
          <h2 className="text-sm font-semibold text-red-300">Reset this workspace</h2>
          <p className="mt-1 text-xs leading-relaxed text-gray-400">
            Erases everything <span className="text-gray-200">{resetInfo.learnerName}</span> has built in{' '}
            <span className="text-gray-200">{resetInfo.language}</span>. Your other profiles and other languages are
            untouched, and your level and injection mode stay as they are.
          </p>

          <div className="mt-3 grid grid-cols-2 gap-2 text-xs">
            {[
              { label: 'phrases', value: resetInfo.phrases },
              { label: 'sessions', value: resetInfo.sessions },
              { label: 'forged card sets', value: resetInfo.cardSets },
              { label: 'island stages', value: resetInfo.stages }
            ].map(cell => (
              <div key={cell.label} className="rounded-lg border border-gray-800 bg-gray-900/60 px-2.5 py-2">
                <span className="font-semibold tabular-nums text-white">{cell.value}</span>
                <span className="ml-1 text-gray-500">{cell.label}</span>
              </div>
            ))}
          </div>

          {confirmingReset ? (
            <div className="mt-3">
              <p className="text-xs font-medium leading-relaxed text-red-300">
                This cannot be undone. Your vocabulary, flashcards, review history, sessions and island roadmap for{' '}
                {resetInfo.language} will be gone for good.
              </p>
              <div className="mt-2.5 flex gap-2">
                <button type="button" onClick={resetInfo.onReset} disabled={resetInfo.busy}
                  className="no-tap flex flex-1 items-center justify-center gap-2 rounded-xl bg-red-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-red-500 disabled:opacity-50">
                  {resetInfo.busy ? <Spinner className="h-4 w-4" /> : null}
                  {resetInfo.busy ? 'Erasing…' : 'Erase it all'}
                </button>
                <button type="button" onClick={() => setConfirmingReset(false)} disabled={resetInfo.busy}
                  className="no-tap rounded-xl border border-gray-700 px-4 py-2.5 text-sm text-gray-300 transition hover:text-white">
                  Cancel
                </button>
              </div>
            </div>
          ) : (
            <button type="button" onClick={() => setConfirmingReset(true)} disabled={resetInfo.busy || !resetInfo.total}
              className="no-tap mt-3 w-full rounded-xl border border-red-500/40 px-4 py-2.5 text-sm font-medium text-red-300 transition hover:bg-red-500/10 disabled:opacity-40">
              {resetInfo.total ? 'Reset ' + resetInfo.language + ' for ' + resetInfo.learnerName : 'Nothing to reset'}
            </button>
          )}
        </div>
      ) : null}

      <details className="mt-8 rounded-2xl border border-gray-800 bg-gray-800/30 p-4">
        <summary className="cursor-pointer text-sm font-medium text-gray-300">First time? Run this SQL in Supabase</summary>
        <pre className="mt-3 overflow-x-auto rounded-lg bg-gray-900 p-3 text-[11px] leading-relaxed text-gray-400">{SQL_SNIPPET}</pre>
      </details>
    </div>
  );
}

const SQL_SNIPPET = `-- New install. Rows are owned by a learner profile and scoped to one language.
create table if not exists public.learners (
  id text primary key,
  name text not null,
  emoji text not null default '🙂',
  created_at timestamptz not null default now()
);
insert into public.learners (id, name) values ('default_user', 'Me')
  on conflict (id) do nothing;

-- Hard cap of five profiles, enforced in the database and not only in the UI.
create or replace function public.enforce_learner_limit()
returns trigger language plpgsql as $$
begin
  if (select count(*) from public.learners) >= 5 then
    raise exception 'Profile limit reached: a maximum of 5 profiles is allowed';
  end if;
  return new;
end; $$;
drop trigger if exists learners_limit on public.learners;
create trigger learners_limit before insert on public.learners
  for each row execute function public.enforce_learner_limit();

create table if not exists public.profiles (
  id uuid primary key default gen_random_uuid(),
  user_id text default 'default_user',
  target_language text not null default 'German',
  current_cefr text default 'B1',
  vocab_injection_mode text default 'adapt_naturally',
  unique (user_id, target_language)
);

create table if not exists public.target_vocabulary (
  id uuid primary key default gen_random_uuid(),
  user_id text default 'default_user',
  target_language text not null default 'German',
  phrase text not null,
  translation text,
  correction_context text,
  times_reviewed int default 0,
  status text default 'learning',
  kind text not null default 'phrase',  -- 'phrase' | 'word'
  mastered_at timestamptz,
  created_at timestamptz default now()
);

create table if not exists public.conversations (
  id uuid primary key default gen_random_uuid(),
  user_id text default 'default_user',
  target_language text not null default 'German',
  topic text not null,
  duration_seconds int,
  transcript jsonb not null,
  feedback jsonb,
  created_at timestamptz default now()
);

create index if not exists target_vocabulary_scope
  on public.target_vocabulary (user_id, target_language, status);
create index if not exists conversations_scope
  on public.conversations (user_id, target_language, created_at desc);

-- Flashcards: one card set per phrase, plus SM-2 state and an append-only log.
create table if not exists public.vocab_sets (
  id uuid primary key default gen_random_uuid(),
  user_id text not null default 'default_user',
  target_language text not null default 'German',
  vocab_id uuid references public.target_vocabulary(id) on delete cascade,
  phrase text not null,
  voice text,
  data jsonb not null,
  audio jsonb,
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);
create unique index if not exists vocab_sets_one_per_phrase
  on public.vocab_sets (user_id, target_language, vocab_id);

create table if not exists public.srs_reviews (
  card_id text primary key,
  user_id text not null default 'default_user',
  target_language text not null default 'German',
  set_id uuid not null references public.vocab_sets(id) on delete cascade,
  deck text not null, idx int not null,
  state text not null default 'new', step int not null default 0,
  ivl int not null default 0, ef float8 not null default 2.5,
  reps int not null default 0, lapses int not null default 0,
  due_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);

create table if not exists public.srs_revlog (
  id uuid primary key default gen_random_uuid(),
  user_id text not null default 'default_user',
  target_language text, card_id text not null, set_id uuid, deck text,
  rating text not null, state text, ivl int,
  was_new boolean not null default false,
  at timestamptz not null default now()
);

-- Language islands: the learner picks the island, the model plans the roadmap.
create table if not exists public.islands (
  id uuid primary key default gen_random_uuid(),
  user_id text not null default 'default_user',
  target_language text not null default 'German',
  name text not null, goal text, about_you text,
  status text not null default 'active',
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);
create unique index if not exists islands_one_active
  on public.islands (user_id, target_language) where status = 'active';

create table if not exists public.island_stages (
  id uuid primary key default gen_random_uuid(),
  island_id uuid not null references public.islands(id) on delete cascade,
  user_id text not null default 'default_user',
  target_language text not null default 'German',
  position int not null, title text not null,
  objective text, scenario text, structures jsonb, phrases jsonb,
  done_when text, recycles_from jsonb,
  status text not null default 'locked',
  ai_verdict boolean not null default false,
  seeded boolean not null default false,
  sessions_count int not null default 0,
  completed_at timestamptz,
  created_at timestamptz not null default now()
);
create unique index if not exists island_stages_position
  on public.island_stages (island_id, position);

alter table public.conversations add column if not exists stage_id uuid;

-- Upgrading an older database? The repo carries both migrations under
-- supabase/migrations, so "supabase db push" applies them in order.`;

function StudyOverlay({
  sets, reviews, remainingNew, learnerId, language, onAnswer, onLoadAudio, onClose
}) {
  const [queue] = useState(() => buildQueue(sets, reviews, remainingNew, learnerId, language));
  const [card, setCard] = useState(null);
  const [audio, setAudio] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [done, setDone] = useState(0);
  const [finished, setFinished] = useState(false);
  const [loadingAudio, setLoadingAudio] = useState(false);
  const audioCache = useRef(new Map());
  const busyRef = useRef(false);

  const advance = useCallback(async () => {
    const next = pickNext(queue);
    if (!next) { setCard(null); setFinished(true); return; }
    setRevealed(false);
    setCard(next);

    if (next.deck === 'reading') { setAudio(null); return; }

    const cached = audioCache.current.get(next.set.id);
    if (cached) { setAudio(cached); return; }

    setLoadingAudio(true);
    setAudio(null);
    try {
      const rows = await onLoadAudio(next.set.id);
      if (rows) audioCache.current.set(next.set.id, rows);
      setAudio(rows || null);
    } catch (err) {
      console.error(err);
      setAudio(null);
    } finally {
      setLoadingAudio(false);
    }
  }, [queue, onLoadAudio]);

  useEffect(() => { advance(); }, []);

  const rate = useCallback(async (rating) => {
    if (!card || !revealed || busyRef.current) return;
    busyRef.current = true;
    const updated = await onAnswer(card, rating);
    // A card still in a learning step comes back later in the same session.
    if (updated && (updated.state === 'learning' || updated.state === 'relearning')) {
      queue.learn.push(Object.assign({}, card, { rev: updated }));
      queue.learn.sort((a, b) => new Date(a.rev.due_at) - new Date(b.rev.due_at));
    }
    setDone(d => d + 1);
    busyRef.current = false;
    advance();
  }, [card, revealed, onAnswer, queue, advance]);

  useEffect(() => {
    function onKey(e) {
      if (e.key === 'Escape') { onClose(); return; }
      if (!card) return;
      if (!revealed && (e.key === ' ' || e.key === 'Enter')) {
        e.preventDefault();
        setRevealed(true);
        return;
      }
      if (revealed) {
        const map = { '1': 'again', '2': 'hard', '3': 'good', '4': 'easy' };
        if (map[e.key]) { e.preventDefault(); rate(map[e.key]); }
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); rate('good'); }
      }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [card, revealed, rate, onClose]);

  const remaining = card ? queue.learn.length + queue.rev.length + queue.fresh.length + 1 : 0;

  let front = '', back = '';
  if (card) {
    const sentence = card.deck === 'reading' ? null : card.set.data.sentences[card.idx];
    const clip = audio ? audio[card.idx] : '';
    if (card.deck === 'reading') {
      front = readingFront(card.set);
      back = readingBack(card.set);
    } else if (card.deck === 'listening') {
      front = listeningFront(clip);
      back = listeningBack(card.set, sentence);
    } else {
      const raw = speakingText(card.set, sentence);
      front = raw.replace(/\{\{c1::([\s\S]*?)::([\s\S]*?)\}\}/g,
        '<span style="background:#FFE45C;border-radius:4px;padding:0 .3em;color:#1E2A38;">[…$2…]</span>');
      back = raw.replace(/\{\{c1::([\s\S]*?)::([\s\S]*?)\}\}/g, '$1') + speakingExtra(card.set, sentence, clip);
    }
  }

  const RATINGS = [
    { id: 'again', label: 'Again', key: '1', cls: 'bg-red-600 hover:bg-red-500' },
    { id: 'hard',  label: 'Hard',  key: '2', cls: 'bg-amber-600 hover:bg-amber-500' },
    { id: 'good',  label: 'Good',  key: '3', cls: 'bg-emerald-600 hover:bg-emerald-500' },
    { id: 'easy',  label: 'Easy',  key: '4', cls: 'bg-sky-600 hover:bg-sky-500' }
  ];

  return (
    <div className="fixed inset-0 z-50 flex flex-col bg-gray-900">
      <header className="flex items-center justify-between border-b border-gray-800 px-5 py-3.5">
        <button onClick={onClose} className="no-tap rounded-lg px-2 py-1 text-sm text-gray-400 transition hover:text-white">
          Close
        </button>
        <div className="flex items-center gap-2 text-xs text-gray-400">
          {card ? (
            <span className="rounded px-2 py-0.5 font-semibold uppercase tracking-wide text-white"
              style={{ background: 'linear-gradient(90deg,' + CARD_ACCENTS[card.deck][0] + ',' + CARD_ACCENTS[card.deck][1] + ')' }}>
              {card.deck}
            </span>
          ) : null}
          <span className="tabular-nums">{done} done{card ? ' · ' + remaining + ' left' : ''}</span>
        </div>
      </header>

      <main className="flex-1 overflow-y-auto px-4 py-4">
        <div className="mx-auto w-full max-w-md">
          {finished ? (
            <div className="py-16 text-center">
              <div className="mb-3 flex justify-center text-indigo-400"><LogoMark className="h-10 w-10" /></div>
              <h2 className="text-lg font-semibold">Queue cleared</h2>
              <p className="mt-1 text-sm text-gray-400">
                {done} card{done === 1 ? '' : 's'} reviewed. Learning cards come back in a few minutes.
              </p>
              <button onClick={onClose}
                className="no-tap mt-6 rounded-xl bg-indigo-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-indigo-500">
                Back to dashboard
              </button>
            </div>
          ) : !card ? (
            <div className="flex justify-center py-16 text-gray-500"><Spinner className="h-6 w-6" /></div>
          ) : (
            <React.Fragment>
              {loadingAudio ? (
                <div className="mb-2 flex items-center justify-center gap-2 text-xs text-gray-500">
                  <Spinner className="h-3.5 w-3.5" /> Loading audio…
                </div>
              ) : null}
              <CardFace html={front} />
              {revealed ? <CardFace html={back} /> : null}
            </React.Fragment>
          )}
        </div>
      </main>

      {card && !finished ? (
        <footer className="safe-b border-t border-gray-800 px-4 pb-5 pt-4">
          <div className="mx-auto w-full max-w-md">
            {!revealed ? (
              <button onClick={() => setRevealed(true)}
                className="no-tap w-full rounded-xl bg-indigo-600 px-4 py-3.5 text-sm font-semibold text-white transition hover:bg-indigo-500">
                Show answer <span className="ml-1 text-indigo-200/70">space</span>
              </button>
            ) : (
              <div className="grid grid-cols-4 gap-2">
                {RATINGS.map(r => (
                  <button key={r.id} onClick={() => rate(r.id)}
                    className={'no-tap rounded-xl px-2 py-3 text-white transition ' + r.cls}>
                    <span className="block text-sm font-semibold">{r.label}</span>
                    <span className="block text-[10px] opacity-80">{fmtDue(applyRating(card.rev, r.id).due_at)}</span>
                  </button>
                ))}
              </div>
            )}
          </div>
        </footer>
      ) : null}
    </div>
  );
}

                the ones before it. Each stage becomes a session topic, and its phrases go into your vocabulary when
                you reach it.
              </div>
            </div>
          ) : (
            <div className="space-y-3">
              {island.goal ? (
                <div className="rounded-xl border border-indigo-500/40 bg-indigo-500/10 p-3.5">
                  <div className="mb-1 text-[11px] font-semibold uppercase tracking-wider text-indigo-300">The goal</div>
                  <p className="text-sm leading-relaxed text-gray-200">{island.goal}</p>
                </div>
              ) : null}

              {stages.map(st => {
                const isCurrent = st.status === 'current';
                const isDone = st.status === 'done';
                const open = expanded === st.id;
                return (
                  <div key={st.id}
                    className={'rounded-xl border transition ' + (isCurrent
                      ? 'border-indigo-500 bg-indigo-500/10'
                      : isDone ? 'border-gray-800 bg-gray-800/30' : 'border-gray-800 bg-gray-800/50')}>
                    <button type="button" onClick={() => setExpanded(open ? null : st.id)}
                      className="no-tap flex w-full items-start gap-3 p-3.5 text-left">
                      <span className={'mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-[11px] font-semibold ' + (isDone
                        ? 'bg-emerald-500/20 text-emerald-300'
                        : isCurrent ? 'bg-indigo-500 text-white' : 'bg-gray-700 text-gray-400')}>
                        {isDone ? '✓' : st.position}
                      </span>
                      <span className="min-w-0 flex-1">
                        <span className={'block text-sm font-medium ' + (isDone ? 'text-gray-400' : 'text-white')}>
                          {st.title}
                        </span>
                        <span className="mt-0.5 block text-xs text-gray-500">
                          {isCurrent ? 'In progress' : isDone ? 'Done' : 'Locked'}
                          {Array.isArray(st.phrases) ? ' · ' + st.phrases.length + ' phrases' : ''}
                        </span>
                      </span>
                    </button>

                    {open ? (
                      <div className="border-t border-gray-700/60 px-3.5 py-3 text-xs leading-relaxed text-gray-400">
                        {st.objective ? <p className="text-gray-300">{st.objective}</p> : null}
                        {st.scenario ? <p className="mt-1.5">Scenario: {st.scenario}</p> : null}
                        {Array.isArray(st.structures) && st.structures.length ? (
                          <p className="mt-1.5">Structures: {st.structures.join(' · ')}</p>
                        ) : null}
                        {Array.isArray(st.recycles_from) && st.recycles_from.length ? (
                          <p className="mt-1.5">Reuses stage {st.recycles_from.join(', ')}</p>
                        ) : null}
                        {st.done_when ? <p className="mt-1.5 text-gray-300">Done when: {st.done_when}</p> : null}
                        {Array.isArray(st.phrases) && st.phrases.length ? (
                          <div className="mt-2 space-y-1 border-t border-gray-700/60 pt-2">
                            {st.phrases.map((ph, i) => (
                              <div key={i} className="truncate">
                                {ph.kind === 'word' ? (
                                  <span className="mr-1.5 rounded bg-amber-500/20 px-1 py-px text-[9px] font-semibold uppercase tracking-wide text-amber-300">word</span>
                                ) : null}
                                <span className="text-gray-200">{ph.phrase}</span>
                                {ph.translation ? <span className="text-gray-500"> — {ph.translation}</span> : null}
                              </div>
                            ))}
                          </div>
                        ) : null}
                      </div>
                    ) : null}
                  </div>
                );
              })}

              {current && gate ? (
                <div className="rounded-xl border border-gray-800 bg-gray-800/40 p-3.5">
                  <div className="mb-2 text-[11px] font-semibold uppercase tracking-wider text-gray-500">
                    To clear “{current.title}”
                  </div>
                  <div className="space-y-1.5 text-xs">
                    {gate.checks.length ? gate.checks.map(c => (
                      <div key={c.id} className={c.met ? 'text-emerald-300' : 'text-gray-400'}>
                        {c.met ? '✓' : '○'} {c.text}
                        {c.met && c.evidence ? <span className="block pl-4 italic text-gray-500">“{c.evidence}”</span> : null}
                        {!c.met && c.missing ? <span className="block pl-4 text-gray-500">{c.missing}</span> : null}
                      </div>
                    )) : (
                      <div className={gate.aiDone ? 'text-emerald-300' : 'text-gray-400'}>
                        {gate.aiDone ? '✓' : '○'} A session shows you can do it
                      </div>
                    )}
                    <div className={gate.vocabDone ? 'text-emerald-300' : 'text-gray-400'}>
                      {gate.vocabDone ? '✓' : '○'} Each phrase used in {STAGE_PHRASE_SESSIONS} sessions ({gate.ready}/{gate.total})
                    </div>
                  </div>
                  {gate.outstanding.length ? (
                    <div className="mt-2 border-t border-gray-700/60 pt-2 text-[11px] text-gray-500">
                      Still owed: {gate.outstanding.slice(0, 4).map(o => o.phrase + ' (' + o.uses + '/' + STAGE_PHRASE_SESSIONS + ')').join(' · ')}
                      {gate.outstanding.length > 4 ? ' …' : ''}
                    </div>
                  ) : null}
                  {gate.complete ? (
                    <button onClick={() => onAdvance(current, {})} disabled={busy}
                      className="no-tap mt-3 w-full rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-emerald-500 disabled:opacity-50">
                      Clear this stage
                    </button>
                  ) : (
                    <button onClick={() => onAdvance(current, { force: true })} disabled={busy}
                      className="no-tap mt-3 w-full rounded-lg border border-gray-700 px-4 py-2 text-xs text-gray-400 transition hover:text-white disabled:opacity-40">
                      Skip this stage anyway
                    </button>
                  )}
                </div>
              ) : null}

              <button onClick={onArchive} disabled={busy}
                className="no-tap w-full rounded-lg px-4 py-2 text-xs text-gray-500 transition hover:text-gray-300 disabled:opacity-40">
                Archive this island and start another
              </button>
            </div>
          )}

          <div className="mt-3 flex min-h-[20px] items-center gap-2 text-xs text-gray-500">
            {busy ? <Spinner className="h-3.5 w-3.5" /> : null}
            <span>{note}</span>
          </div>
        </div>

        {!island ? (
          <div className="safe-b mx-auto w-full max-w-md border-t border-gray-800 px-5 py-4">
            <button onClick={() => onCreate(name, about)} disabled={busy || !name.trim()}
              className="no-tap flex w-full items-center justify-center gap-2 rounded-xl bg-indigo-600 px-4 py-3.5 text-sm font-semibold text-white transition hover:bg-indigo-500 disabled:opacity-50">
              {busy ? <Spinner className="h-4 w-4" /> : null}
              {busy ? 'Designing…' : 'Design my roadmap'}
            </button>
          </div>
        ) : null}
      </div>
    </div>
  );
}

function ProfileSheet({ learners, activeId, busy, onSwitch, onCreate, onDelete, onClose }) {
  const [creating, setCreating] = useState(false);
  const [name, setName] = useState('');
  const [emoji, setEmoji] = useState(PROFILE_EMOJI[0]);
  const [confirmingId, setConfirmingId] = useState('');

  const full = learners.length >= MAX_PROFILES;

  function submit(e) {
    e.preventDefault();
    if (!name.trim()) return;
    onCreate(name, emoji);
    setName('');
    setCreating(false);
  }

  return (
    <div className="fixed inset-0 z-40 flex flex-col justify-end">
      <div className="fade-in absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={busy ? undefined : onClose} />
      <div className="sheet-up relative flex max-h-[88vh] flex-col rounded-t-3xl border-t border-gray-700 bg-gray-900 shadow-2xl">
        <div className="mx-auto mt-3 h-1.5 w-10 shrink-0 rounded-full bg-gray-700" />

        <div className="mx-auto w-full max-w-md px-5 pt-4">
          <div className="flex items-center justify-between">
            <h2 className="text-lg font-semibold tracking-tight">Profiles</h2>
            <button onClick={onClose} disabled={busy}
              className="no-tap rounded-lg p-1.5 text-gray-400 transition hover:text-white disabled:opacity-40" aria-label="Close">
              <svg className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                <path d="M18 6 6 18M6 6l12 12" />
              </svg>
            </button>
          </div>
          <p className="mt-1 text-sm text-gray-400">
            {learners.length} of {MAX_PROFILES} used. Each profile keeps its own languages, vocabulary and streak.
          </p>
        </div>

        <div className="mx-auto w-full max-w-md flex-1 overflow-y-auto px-5 pb-4 pt-4">
          <div className="space-y-2">
            {learners.map(l => {
              const active = l.id === activeId;
              const confirming = confirmingId === l.id;
              return (
                <div key={l.id}
                  className={'rounded-xl border p-3 transition ' + (active
                    ? 'border-indigo-500 bg-indigo-500/10'
                    : 'border-gray-700 bg-gray-800')}>
                  <div className="flex items-center gap-3">
                    <button type="button" onClick={() => onSwitch(l.id)} disabled={busy || active}
                      className="no-tap flex min-w-0 flex-1 items-center gap-3 text-left disabled:cursor-default">
                      <span className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-gray-900/70 text-lg">
                        {l.emoji || '🙂'}
                      </span>
                      <span className="min-w-0 flex-1">
                        <span className="block truncate text-sm font-medium text-white">{l.name}</span>
                        <span className="block text-xs text-gray-500">{active ? 'Active now' : 'Tap to switch'}</span>
                      </span>
                    </button>
                    {learners.length > 1 ? (
                      <button type="button" disabled={busy}
                        onClick={() => (confirming ? onDelete(l.id) : setConfirmingId(l.id))}
                        className={'no-tap shrink-0 rounded-lg px-2.5 py-1.5 text-xs font-medium transition disabled:opacity-40 ' + (confirming
                          ? 'bg-red-600 text-white'
                          : 'border border-gray-700 text-gray-400 hover:text-white')}>
                        {confirming ? 'Delete for good' : 'Delete'}
                      </button>
                    ) : null}
                  </div>
                  {confirming ? (
                    <p className="mt-2 border-t border-gray-700/60 pt-2 text-xs leading-relaxed text-red-300">
                      This erases {l.name}'s vocabulary, sessions and levels in every language. It cannot be undone.
                      <button type="button" onClick={() => setConfirmingId('')}
                        className="no-tap ml-2 text-gray-400 underline">Cancel</button>
                    </p>
                  ) : null}
                </div>
              );
            })}
          </div>

          {creating ? (
            <form onSubmit={submit} className="mt-4 rounded-xl border border-gray-800 bg-gray-800/40 p-3.5">
              <div className="mb-2 text-[11px] font-semibold uppercase tracking-wider text-gray-500">New profile</div>
              <input className={inputClass} type="text" value={name} autoFocus disabled={busy}
                onChange={e => setName(e.target.value)} placeholder="Name" maxLength={40} />
              <div className="mt-2 flex flex-wrap gap-1.5">
                {PROFILE_EMOJI.map(e => (
                  <button key={e} type="button" onClick={() => setEmoji(e)}
                    className={'no-tap flex h-9 w-9 items-center justify-center rounded-lg border text-lg transition ' + (emoji === e
                      ? 'border-indigo-500 bg-indigo-500/20'
                      : 'border-gray-700 bg-gray-900 hover:border-gray-600')}>
                    {e}
                  </button>
                ))}
              </div>
              <div className="mt-3 flex gap-2">
                <button type="submit" disabled={busy || !name.trim()}
                  className="no-tap flex-1 rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-500 disabled:opacity-50">
                  Create
                </button>
                <button type="button" onClick={() => setCreating(false)} disabled={busy}
                  className="no-tap rounded-xl border border-gray-700 px-4 py-2.5 text-sm text-gray-300 transition hover:text-white">
                  Cancel
                </button>
              </div>
            </form>
          ) : (
            <button type="button" onClick={() => setCreating(true)} disabled={busy || full}
              className="no-tap mt-4 w-full rounded-xl border border-dashed border-gray-700 px-4 py-3 text-sm font-medium text-gray-300 transition hover:border-gray-600 hover:text-white disabled:opacity-40">
              {full ? 'Profile limit reached (' + MAX_PROFILES + ')' : '+ New profile'}
            </button>
          )}

          <div className="mt-3 flex h-5 items-center gap-2 text-xs text-gray-500">
            {busy ? <Spinner className="h-3.5 w-3.5" /> : null}
            <span>{busy ? 'Working…' : ''}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

function StatsSheet({ stats, loading, language, learnerName, srs, onClose }) {

  return (
    <div className="fixed inset-0 z-40 flex flex-col justify-end">
      <div className="fade-in absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={onClose} />
      <div className="sheet-up relative flex max-h-[88vh] flex-col rounded-t-3xl border-t border-gray-700 bg-gray-900 shadow-2xl">

            <button onClick={onClose}
              className="no-tap rounded-lg p-1.5 text-gray-400 transition hover:text-white" aria-label="Close">
              <svg className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                <path d="M18 6 6 18M6 6l12 12" />

            </button>

          ) : (

                    { label: 'sessions', value: stats.today.sessions },
                    { label: 'new', value: stats.today.added },
                    { label: 'mastered', value: stats.today.mastered }
                  ].map(cell => (

                      <div className="text-[10px] uppercase tracking-wide text-gray-500">{cell.label}</div>
                    </div>
                  ))}

              </div>

              <div className="rounded-2xl border border-gray-800 bg-gray-800/40 p-4">
                <div className="mb-3 flex items-baseline justify-between">
                  <span className="text-[11px] font-semibold uppercase tracking-wider text-gray-500">Last 14 days</span>
                  <span className="text-xs text-gray-500">{stats.totals.weekMinutes} min this week</span>
                </div>
                <div className="flex h-24 items-end gap-1">
                  {stats.series.map(d => (
                    <div key={d.key} className="group flex flex-1 flex-col items-center justify-end gap-1"
                      title={d.key + ': ' + d.minutes + ' min'}>
                      <div className={'w-full rounded-t transition-all ' + (d.minutes > 0 ? 'bg-indigo-500' : 'bg-gray-700/60')}

                    <span className="text-[11px] font-semibold uppercase tracking-wider text-gray-500">Flashcards</span>

                      { key: 'young', cls: 'bg-indigo-500' },

                    ].map(seg => (
                      srs.maturity[seg.key] ? (

                          style={{ width: (srs.maturity[seg.key] / Math.max(1, srs.maturity.total) * 100) + '%' }}

                      { label: 'new', value: srs.maturity.fresh },
                      { label: 'learning', value: srs.maturity.learning },
                      { label: 'young', value: srs.maturity.young },
                      { label: 'mature', value: srs.maturity.mature }
                    ].map(cell => (
                      <div key={cell.label}>
                        <div className="text-sm font-semibold tabular-nums text-white">{cell.value}</div>
                        <div className="text-[10px] uppercase tracking-wide text-gray-500">{cell.label}</div>
                      </div>
                    ))}
                  </div>

                  <div className="mt-3 border-t border-gray-700/60 pt-2.5 text-xs text-gray-500">
                    {srs.sets} phrase{srs.sets === 1 ? '' : 's'} forged · {srs.totalReviews} review{srs.totalReviews === 1 ? '' : 's'} all time
                  </div>
                </div>
              ) : null}

              <div>
                <div className="mb-2 text-[11px] font-semibold uppercase tracking-wider text-gray-500">All time</div>
                <div className="grid grid-cols-2 gap-2">
                  {[
                    { label: 'Minutes spoken', value: stats.totals.minutes },
                    { label: 'Sessions', value: stats.totals.sessions },
                    { label: 'Phrases learning', value: stats.totals.learning },
                    { label: 'Phrases mastered', value: stats.totals.mastered },
                    { label: 'Days practised', value: stats.totals.activeDays },
                    { label: 'Best streak', value: stats.streak.best }
                  ].map(cell => (
                    <div key={cell.label} className="rounded-xl border border-gray-800 bg-gray-800/50 p-3">
                      <div className="text-xl font-semibold tabular-nums text-white">{cell.value}</div>
                      <div className="mt-0.5 text-xs text-gray-500">{cell.label}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

                      ) : null}
                      {it.source === 'manual' ? (
                        <span className="rounded bg-gray-700 px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-gray-300">yours</span>
                      ) : it.category && it.kind !== 'word' ? (
                        <span className="rounded bg-indigo-500/20 px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-indigo-300">{it.category}</span>
                      ) : null}
                    </span>
                    {it.translation ? <span className="mt-0.5 block text-sm text-gray-400">{it.translation}</span> : null}
                    {it.context ? <span className="mt-1 block text-xs leading-relaxed text-gray-500">{it.context}</span> : null}
                  </span>
                </button>
              ))}
            </div>
          ) : (
            <div className="rounded-xl border border-dashed border-gray-700 bg-gray-800/30 p-4 text-sm text-gray-400">
              Hit Suggest for ten phrases pitched at your level, or type your own below. Anything you add starts at
              0/{MASTERY_THRESHOLD} uses and your partner will work it into the next session.
            </div>
          )}

          <form onSubmit={submitManual} className="mt-4 rounded-xl border border-gray-800 bg-gray-800/40 p-3.5">
            <div className="mb-2 text-[11px] font-semibold uppercase tracking-wider text-gray-500">Add your own</div>
            <div className="space-y-2">
              <input className={inputClass} type="text" value={manualPhrase} disabled={busy}
                onChange={e => setManualPhrase(e.target.value)}
                placeholder={'Phrase in ' + targetLanguage} />
              <div className="flex gap-2">
                <input className={inputClass + ' flex-1'} type="text" value={manualTranslation} disabled={busy}
                  onChange={e => setManualTranslation(e.target.value)}
                  placeholder="Meaning (optional)" />
                <button type="submit" disabled={busy || !manualPhrase.trim()}
                  className="no-tap shrink-0 rounded-xl border border-gray-700 bg-gray-800 px-4 text-sm font-medium text-gray-200 transition hover:border-gray-600 disabled:opacity-40">
                  Add
                </button>
              </div>
            </div>
          </form>

          <div className="mt-3 flex h-5 items-center gap-2 text-xs text-gray-500">
            {busy ? <Spinner className="h-3.5 w-3.5" /> : null}
            <span>{note}</span>
          </div>
        </div>

        <div className="safe-b mx-auto w-full max-w-md border-t border-gray-800 px-5 py-4">
          <button onClick={onAdd} disabled={busy || !selected.length}
            className="no-tap flex w-full items-center justify-center gap-2 rounded-xl bg-indigo-600 px-4 py-3.5 text-sm font-semibold text-white transition hover:bg-indigo-500 disabled:opacity-50">
            {busy ? <Spinner className="h-4 w-4" /> : null}
            {selected.length ? 'Add ' + selected.length + ' phrase' + (selected.length === 1 ? '' : 's') : 'Select phrases to add'}
          </button>
        </div>
      </div>
    </div>
  );
}

function ExportSheet({ vocab, targetLanguage, defaultTurkish, busy, note, forgedCount, onExport, onClose }) {
  const [format, setFormat] = useState('csv');
  const [withTurkish, setWithTurkish] = useState(defaultTurkish);

  const formats = [
    { id: 'csv', label: 'CSV', hint: 'Opens in Excel, Numbers, Sheets' },
    { id: 'txt', label: 'Text', hint: 'Plain readable list' },
    { id: 'anki', label: 'Anki decks', hint: forgedCount ? forgedCount + ' forged phrases · 3 files' : 'Forge cards first' }
  ];
  const ankiOnly = format === 'anki';

  return (
    <div className="fixed inset-0 z-40 flex flex-col justify-end">
      <div className="fade-in absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={busy ? undefined : onClose} />
      <div className="sheet-up relative flex max-h-[88vh] flex-col rounded-t-3xl border-t border-gray-700 bg-gray-900 shadow-2xl">
        <div className="mx-auto mt-3 h-1.5 w-10 shrink-0 rounded-full bg-gray-700" />

        <div className="mx-auto w-full max-w-md px-5 pt-4">
          <div className="flex items-center justify-between">
            <h2 className="text-lg font-semibold tracking-tight">Export vocabulary</h2>
            <button onClick={onClose} disabled={busy}
              className="no-tap rounded-lg p-1.5 text-gray-400 transition hover:text-white disabled:opacity-40" aria-label="Close">
              <svg className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                <path d="M18 6 6 18M6 6l12 12" />
              </svg>
            </button>
          </div>
          <p className="mt-1 text-sm text-gray-400">
            {vocab.length} active phrase{vocab.length === 1 ? '' : 's'} in {targetLanguage}.
          </p>
        </div>

        <div className="mx-auto w-full max-w-md flex-1 overflow-y-auto px-5 pb-4 pt-4">
          <div className="mb-4">
            <span className="mb-1.5 block text-xs font-medium uppercase tracking-wider text-gray-400">File format</span>
            <div className="grid grid-cols-3 gap-2">
              {formats.map(f => (
                <button key={f.id} type="button" onClick={() => setFormat(f.id)}
                  disabled={busy || (f.id === 'anki' && !forgedCount)}
                  className={'no-tap rounded-xl border p-3 text-left transition disabled:opacity-50 ' + (format === f.id
                    ? 'border-indigo-500 bg-indigo-500/15'
                    : 'border-gray-700 bg-gray-800 hover:border-gray-600')}>
                  <div className="text-sm font-medium">{f.label}</div>
                  <div className="mt-0.5 text-xs text-gray-400">{f.hint}</div>
                </button>
              ))}
            </div>
          </div>

          <button type="button" onClick={() => setWithTurkish(!withTurkish)}
            disabled={busy || ankiOnly || targetLanguage === 'Turkish'}
            className={'no-tap flex w-full items-start gap-3 rounded-xl border p-3.5 text-left transition disabled:opacity-50 ' + (withTurkish
              ? 'border-indigo-500 bg-indigo-500/15'
              : 'border-gray-700 bg-gray-800 hover:border-gray-600')}>
            <span className={'mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-md border transition ' + (withTurkish
              ? 'border-indigo-400 bg-indigo-500 text-white'
              : 'border-gray-600 bg-gray-900')}>
              {withTurkish ? (
                <svg className="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                  <path d="m5 12 5 5L20 7" />
                </svg>
              ) : null}
            </span>
            <span>
              <span className="block text-sm font-medium">Include Turkish translations</span>
              <span className="mt-0.5 block text-xs text-gray-400">
                {targetLanguage === 'Turkish'
                  ? 'Your target language is already Turkish.'
                  : 'Translated with GPT-4o on export, then cached for this session.'}
              </span>
            </span>
          </button>

          <div className="mt-4 rounded-xl border border-gray-800 bg-gray-800/40 p-3.5">
            <div className="mb-2 text-[11px] font-semibold uppercase tracking-wider text-gray-500">Preview</div>
            <div className="space-y-1.5">
              {vocab.slice(0, 3).map(v => (
                <div key={v.id} className="truncate text-xs text-gray-400">
                  <span className="text-gray-200">{v.phrase}</span>
                  {withTurkish ? <span className="text-indigo-400"> · tr</span> : null}
                  {v.translation ? <span> · {v.translation}</span> : null}
                </div>
              ))}
              {vocab.length > 3 ? (
                <div className="text-xs text-gray-600">+ {vocab.length - 3} more</div>
              ) : null}
            </div>
          </div>

          <div className="mt-3 flex h-5 items-center gap-2 text-xs text-gray-500">
            {busy ? <Spinner className="h-3.5 w-3.5" /> : null}
            <span>{note}</span>
          </div>
        </div>

        <div className="safe-b mx-auto w-full max-w-md border-t border-gray-800 px-5 py-4">
          <button onClick={() => onExport(format, withTurkish && !ankiOnly && targetLanguage !== 'Turkish')}
            disabled={busy || (ankiOnly ? !forgedCount : !vocab.length)}
            className="no-tap flex w-full items-center justify-center gap-2 rounded-xl bg-indigo-600 px-4 py-3.5 text-sm font-semibold text-white transition hover:bg-indigo-500 disabled:opacity-50">
            {busy ? <Spinner className="h-4 w-4" /> : null}
            {busy ? 'Preparing…' : ankiOnly ? 'Download 3 Anki decks' : 'Download .' + format}
          </button>
        </div>
      </div>
    </div>
  );
}

        {mode === MODE_REALTIME ? (

        </button>
      ) : null}

      <div className="fixed inset-x-0 bottom-0 safe-b bg-gradient-to-t from-gray-900 via-gray-900/95 to-transparent px-5 pb-5 pt-8">
        <div className="mx-auto w-full max-w-md">
          <button onClick={() => onStart(chosen)} disabled={!chosen}
            className="no-tap w-full rounded-2xl bg-indigo-600 px-4 py-4 text-base font-semibold text-white shadow-lg shadow-indigo-900/40 transition hover:bg-indigo-500 disabled:opacity-40">
            Start 30-minute {mode === MODE_REALTIME ? 'live call' : 'session'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* --------------------------------------------------------------- session UI */

const STATUS_COPY = {
  connecting: 'Connecting the live call…',
  live: 'Live — just start talking',
  listening: 'Hearing you…',
  muted: 'Mic muted — tap to unmute',
  idle: 'Tap to speak',
  starting: 'Warming up your partner…',
  recording: 'Listening… tap to send',
  transcribing: 'Transcribing your audio…',
  thinking: 'Thinking of a reply…',
  synthesizing: 'Generating speech…',
  speaking: 'Speaking — tap to interrupt',
  analyzing: 'Analysing your session…'
};

function TranscriptView({ messages, status, targetLanguage, live }) {
  const endRef = useRef(null);
  useEffect(() => {
    if (endRef.current) endRef.current.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }, [messages.length, status]);

  if (!messages.length) {
    return (
      <div className="flex h-full items-center justify-center px-8 text-center">
        <p className="text-sm text-gray-500">
          Your partner will open the conversation in {targetLanguage}. Answer out loud — mistakes are the point.
          {live ? ' The mic stays open, so just talk. Cut in whenever you like.' : ''}
        </p>
      </div>
    );
  }

  return (
    <div className="space-y-3 px-1 pb-4">
      {messages.map((m, i) => (
        <div key={i} className={'bubble-in flex ' + (m.role === 'user' ? 'justify-end' : 'justify-start')}>
          <div className={'max-w-[85%] rounded-2xl px-3.5 py-2.5 text-[15px] leading-relaxed ' + (m.role === 'user'
            ? 'rounded-br-md bg-indigo-600 text-white'
            : 'rounded-bl-md bg-gray-800 text-gray-100')}>
            {m.content}
          </div>
        </div>
      ))}
      {(status === 'thinking' || status === 'synthesizing' || status === 'transcribing') ? (
        <div className="flex justify-start">
          <div className="flex items-center gap-2 rounded-2xl rounded-bl-md bg-gray-800 px-3.5 py-3 text-gray-400">
            <Spinner className="h-4 w-4" />
            <span className="text-xs">{STATUS_COPY[status]}</span>
          </div>
        </div>
      ) : null}
      <div ref={endRef} />
    </div>
  );
}

// What to aim for while talking. Phrases tick the moment the learner says
// them; goals can only be judged afterwards, so they show what is already met.
function StageStrip({ stage, messages, language }) {
  const [open, setOpen] = useState(true);
  const learnerText = useMemo(
    () => messages.filter(m => m.role === 'user').map(m => m.content).join(' \n '),
    [messages]
  );
  if (!stage) return null;

  const phrases = (stage.phrases || []).map(p => ({
    phrase: p.phrase,
    kind: p.kind,
    ready: p.ready,
    now: phraseWasUsed(p.phrase, learnerText, p.kind, language)
  }));
  const saidNow = phrases.filter(p => p.now).length;
  const checks = stage.checks || [];

  return (
    <div className="border-b border-gray-800 bg-indigo-500/5 px-5 py-2">
      <button type="button" onClick={() => setOpen(!open)}
        className="no-tap flex w-full items-center justify-between gap-2 text-left">
        <span className="truncate text-xs font-semibold text-indigo-300">
          {stage.focus ? 'Focused · ' : 'Stage ' + stage.position + ' · '}{stage.title}
        </span>
        <span className="flex shrink-0 items-center gap-1.5 text-[11px] text-gray-400">
          <span className="tabular-nums">{saidNow}/{phrases.length} said</span>
          <svg className={'h-3 w-3 transition ' + (open ? 'rotate-180' : '')} viewBox="0 0 24 24" fill="none"
            stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6" /></svg>
        </span>
      </button>

      {open ? (
        <div className="pb-1 pt-2">
          {checks.length ? (
            <div className="mb-2 space-y-0.5">
              {checks.map(c => (
                <div key={c.id} className={'text-[11px] leading-snug ' + (c.met ? 'text-emerald-300' : 'text-gray-300')}>
                  {c.met ? '✓' : '○'} {c.text}
                </div>
              ))}
            </div>
          ) : null}
          <div className="flex flex-wrap gap-1">
            {phrases.map(p => (
              <span key={p.phrase}
                className={'rounded-md border px-1.5 py-0.5 text-[11px] transition ' + (p.now
                  ? 'border-emerald-500/60 bg-emerald-500/15 text-emerald-200'
                  : p.ready
